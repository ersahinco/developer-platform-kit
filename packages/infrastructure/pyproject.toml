[project]
name = "aws-sdlc-containers-infrastructure"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-sdlc-containers-application",
    "aws-sdlc-containers-domain",
    "boto3>=1.34.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["infrastructure", "infrastructure.dapr", "infrastructure.db"]
package-dir = { infrastructure = "." }
