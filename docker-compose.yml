services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aws_sdlc_containers}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/sql/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql
      # observability.sql removed — backfill_progress is owned by Liquibase changeset 003.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aws_sdlc_containers}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # PgBouncer sits between the app and Postgres.
  # The app's DATABASE_URL points to pgbouncer:5432, not db:5432.
  # transaction mode: server connections are returned to the pool after each
  # transaction, allowing many app connections to share a small server-side pool.
  # edoburu/pgbouncer: actively maintained, current versions, simple env-var config.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aws_sdlc_containers}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
      # Log pool stats once per hour — same as ECS. Reduces noise during local dev.
      STATS_PERIOD: 3600
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  liquibase:
    build:
      context: db
    image: aws-sdlc-containers-liquibase:local
    volumes:
      - ./db:/liquibase/db
    environment:
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/db.changelog-master.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/db
      # Liquibase connects directly to Postgres, not pgbouncer — DDL statements
      # require session mode and must not be proxied through a transaction-mode pool.
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-aws_sdlc_containers}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migration

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@pgbouncer:5432/aws_sdlc_containers}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/backfill-worker/Dockerfile
    environment:
      # Worker bypasses pgbouncer — connects directly to Postgres.
      BACKFILL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aws_sdlc_containers}
      BACKFILL_BATCH_SIZE: ${BACKFILL_BATCH_SIZE:-1000}
      BACKFILL_SLEEP_MS: ${BACKFILL_SLEEP_MS:-100}
    depends_on:
      db:
        condition: service_healthy

  data-export-job:
    build:
      context: .
      dockerfile: apps/data-export-job/Dockerfile
    environment:
      # Export job bypasses pgbouncer, matching worker/DDL behavior.
      DATA_EXPORT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aws_sdlc_containers}
      DATA_EXPORT_OUTPUT_DIR: /exports
    volumes:
      - data_exports:/exports
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - data

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_LOGIN_BANNER: "'Local admin only'"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tools

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.11.2}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      app:
        condition: service_started
    profiles:
      - observability

  loki:
    image: grafana/loki:${LOKI_TAG:-3.6.10}
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    profiles:
      - observability

  promtail:
    image: grafana/promtail:${PROMTAIL_TAG:-3.6.10}
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./docker/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    profiles:
      - observability

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-13.0.1}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    profiles:
      - observability

volumes:
  db_data:
  pgadmin_data:
  prometheus_data:
  loki_data:
  grafana_data:
  data_exports:
