groups:
  - name: app-observability
    rules:
      - alert: AppReadinessFailures
        expr: sum(increase(http_requests_total{route="/ready",status_code=~"5.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          service: app
        annotations:
          summary: App readiness endpoint is returning 5xx responses
          description: The app /ready endpoint has returned one or more 5xx responses in the last 5 minutes.

      - alert: AppRequest5xxSymptoms
        expr: sum by (route) (increase(http_requests_total{route!="/ready",status_code=~"5.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          service: app
        annotations:
          summary: App request route is returning 5xx responses
          description: Route {{ $labels.route }} has returned one or more 5xx responses in the last 5 minutes.

      - alert: AppRequestLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket{route!="/ready"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
          service: app
        annotations:
          summary: App request latency is elevated
          description: Route {{ $labels.route }} p95 latency has been above 2 seconds for 5 minutes.

      - alert: OrderEventPublishFailures
        expr: sum(increase(order_events_publish_total{status="failed"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          service: app
        annotations:
          summary: Order event publishing is failing
          description: One or more order event publish attempts failed in the last 5 minutes.
