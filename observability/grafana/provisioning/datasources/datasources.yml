apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    orgId: 1
    uid: Prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
  - name: Loki
    orgId: 1
    uid: Loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
  - name: Tempo
    orgId: 1
    uid: Tempo
    type: tempo
    access: proxy
    url: ${TEMPO_URL}
