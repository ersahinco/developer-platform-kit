apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: action-app-build
  title: Build workload images
  description: Dispatch the existing App Build workflow; deployment remains a separate action.
  annotations:
    github.com/project-slug: ersahinco/aws-sdlc-containers
    aws-sdlc-containers/workflow-id: app-build.yml
    aws-sdlc-containers/workflow-lane: app
    aws-sdlc-containers/mutation-gateway: github-actions
  tags:
    - delivery
    - build
spec:
  owner: group:default/platform-engineering
  type: delivery-action
  parameters:
    - title: Confirm the build
      required:
        - confirm_build
      properties:
        confirm_build:
          title: Confirmation
          type: string
          default: dry-run
          pattern: ^(dry-run|build)$
          description: Use dry-run for validation only; type build to scan and publish immutable images.
  steps:
    - id: dispatchBuild
      name: Dispatch App Build
      action: github:actions:dispatch
      input:
        repoUrl: ${{ environment.parameters.deliveryRepoUrl }}
        workflowId: app-build.yml
        branchOrTagName: main
        workflowInputs:
          confirm_build: ${{ parameters.confirm_build }}
