apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: action-operational-snapshot
  title: Capture an operational snapshot
  description: Dispatch the read-only operational job through the existing evidence-producing workflow.
  annotations:
    github.com/project-slug: ersahinco/aws-sdlc-containers
    aws-sdlc-containers/workflow-id: operational-snapshot.yml
    aws-sdlc-containers/workflow-lane: data
    aws-sdlc-containers/mutation-gateway: github-actions
  tags:
    - delivery
    - evidence
    - operator-job
spec:
  owner: group:default/platform-engineering
  type: delivery-action
  parameters:
    - title: Confirm the operator job
      required:
        - confirm_snapshot
      properties:
        confirm_snapshot:
          title: Confirmation
          type: string
          pattern: ^run-operational-snapshot$
        dry_run:
          title: Dry run
          type: string
          default: "true"
          enum:
            - "true"
            - "false"
  steps:
    - id: dispatchSnapshot
      name: Dispatch Operational Snapshot
      action: github:actions:dispatch
      input:
        repoUrl: ${{ environment.parameters.deliveryRepoUrl }}
        workflowId: operational-snapshot.yml
        branchOrTagName: main
        workflowInputs:
          confirm_snapshot: ${{ parameters.confirm_snapshot }}
          dry_run: ${{ parameters.dry_run }}
