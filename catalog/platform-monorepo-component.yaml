apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform-monorepo
  description: Stable-center platform monorepo contract, catalog, and delivery toolkit.
  annotations:
    github.com/project-slug: ersahinco/aws-sdlc-containers
    aws-sdlc-containers/capability-profile-command: make monorepo-capability-profile
    aws-sdlc-containers/capability-profile-artifact: monorepo-capability-profile-${github.run_id}
    aws-sdlc-containers/capability-profile-schema: lean-monorepo-capabilities/v1
    aws-sdlc-containers/integration-mode: read-and-dispatch
    aws-sdlc-containers/mutation-gateway: github-actions
    aws-sdlc-containers/placement-source: platform/workload-runtime-support.json
    aws-sdlc-containers/observed-deployment-source: scripts/observability/release_event.py
  links:
    - url: https://github.com/ersahinco/aws-sdlc-containers/actions
      title: GitHub Actions
      icon: dashboard
    - url: https://github.com/ersahinco/aws-sdlc-containers/blob/main/docs/backstage-integration.md
      title: Integration contract
      icon: docs
  tags:
    - platform
    - self-service
    - workload-contract
spec:
  type: platform
  lifecycle: experimental
  owner: group:default/platform-engineering
  system: aws-sdlc-containers
  dependsOn:
    - resource:default/runtime-target-aws-ecs
