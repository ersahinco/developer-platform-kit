# Checkov skip configuration for known-accepted findings.
# Each skip must have a documented rationale. Remove the skip when the
# underlying condition changes.

skip-check:

  # ALB access logging — S3 cost not justified for this demo.
  - CKV_AWS_91

  # ALB deletion protection — environment is designed to be torn down.
  - CKV_AWS_150

  # ALB port 80 open to 0.0.0.0/0 — the listener immediately redirects to
  # HTTPS (301). Blocking port 80 entirely would break clients that follow
  # the redirect from http:// bookmarks. The actual API is only reachable
  # via HTTPS with a valid bearer token.
  - CKV_AWS_260

  # Target group uses HTTP — TLS terminates at the ALB. Traffic from the ALB
  # to the app container is plain HTTP inside the VPC private subnet, protected
  # by security groups (inbound from ALB SG only). End-to-end TLS to the
  # container would require a cert on the app with no security benefit inside
  # a private subnet behind WAF + ALB.
  - CKV_AWS_378

  # WAF full logging to Kinesis Firehose — CloudWatch metrics and sampled
  # requests are enabled on all rules instead. Full logging adds ~$0.10/GB
  # ingested via Firehose and is not justified for this demo.
  - CKV2_AWS_31

  # ECS task egress to 0.0.0.0/0 — tasks need outbound access to ECR,
  # Secrets Manager, and CloudWatch. Production fix: add VPC endpoints for
  # those three services and restrict egress to the VPC CIDR.
  - CKV_AWS_25
  - CKV_AWS_277
  - CKV_AWS_382

  # SG not attached to a resource — checkov cannot see attachments made inside
  # the ECS and RDS community modules. Both SGs are wired correctly.
  - CKV2_AWS_5

  # CloudWatch log groups: no KMS encryption, retention < 1 year.
  # ECS task logs in dev don't warrant KMS cost or 1-year retention.
  # Enable both in production for compliance.
  - CKV_AWS_158
  - CKV_AWS_338

  # Liquibase container read-only filesystem — Liquibase writes temp files
  # during migration and cannot run with a read-only root filesystem.
  - CKV_AWS_336

  # IAM * resources — EC2 Describe, ECS Register/Describe, and ECR
  # GetAuthorizationToken have no resource-level scope in the AWS API.
  # Each usage is documented inline in main.tf.
  - CKV_AWS_356
  - CKV_AWS_111
  - CKV_AWS_107

  # Module version constraints vs commit hashes — terraform-aws-modules
  # publishes to the Terraform Registry with semantic versioning. The registry
  # version pin (~> x.y) is the documented best practice for registry modules.
  # Commit hash pinning applies to git-sourced modules only.
  - CKV_TF_1
