schema_version: "1"
runtime_target: aws-ecs
owner: platform-runtime
description: >
  Reusable AWS runtime-target building blocks for bounded external dependency
  access. These entries describe reviewable platform-edge patterns; workload
  identity remains in platform/workloads.json and provider wiring remains in
  runtime-owned infrastructure or secret/config systems.
entries:
  - id: bounded-identity-provider
    type: dependency-boundary
    provides:
      - inbound identity-provider access through platform-owned edge controls
      - runtime-injected issuer and credential material
      - reviewable token validation evidence
    consumes_contract:
      - bounded dependency kind identity-provider
      - declared config names
      - declared secret names
      - dependency owner and evidence expectation
    implementation:
      - infra/app/edge.tf
      - infra/app/workload_inventory.tf
      - platform/concerns/security
    adoption_steps:
      - declare the dependency as bounded workload intent before runtime wiring
      - keep tenant and client identifiers in operator-owned configuration
      - prove token validation without adding provider details to app metadata

  - id: bounded-dns-provider
    type: dependency-boundary
    provides:
      - DNS provider coordination through platform-owned edge ownership
      - declared hostname or delegation evidence
      - runtime-owned publication and rollback notes
    consumes_contract:
      - bounded dependency kind dns-provider
      - declared config names
      - dependency owner and evidence expectation
      - workload exposure intent when the workload is externally routed
    implementation:
      - infra/platform/outputs.tf
      - infra/app/edge.tf
      - docs/runbooks/app-infra-ownership.md
    adoption_steps:
      - keep hosted zone identifiers and provider records out of workload metadata
      - record ownership and delegation evidence before cloud admission
      - keep DNS publication as platform-edge realization

  - id: bounded-external-api
    type: dependency-boundary
    provides:
      - outbound external-api or saas-api access through declared runtime config
      - runtime-injected credentials
      - synthetic or operator-visible dependency evidence
    consumes_contract:
      - bounded dependency kind external-api
      - bounded dependency kind saas-api
      - declared config names
      - declared secret names
      - dependency owner and evidence expectation
    implementation:
      - infra/app/workload_inventory.tf
      - packages/infrastructure
      - scripts/platform/admission_check.py
    adoption_steps:
      - keep endpoint URLs and credential values in operator-owned configuration
      - keep SDK calls in infrastructure adapters when code needs them
      - prove dependency reachability through workload evidence or operator checks

  - id: bounded-external-database
    type: dependency-boundary
    provides:
      - externally owned database access through declared runtime config
      - runtime-injected credentials
      - connectivity, migration ownership, and rollback evidence
    consumes_contract:
      - bounded dependency kind external-database
      - declared config names
      - declared secret names
      - dependency owner and evidence expectation
    implementation:
      - infra/app/workload_inventory.tf
      - packages/infrastructure
      - docs/deployment-options.md
    adoption_steps:
      - keep endpoint, pooler, allowlist, and provider details out of workload metadata
      - prove network path and restore owner before runtime admission
      - keep application code on portable database semantics where possible

  - id: bounded-partner-system
    type: dependency-boundary
    provides:
      - partner-system access through declared runtime config
      - runtime-injected credentials
      - explicit owner and operator-visible evidence
    consumes_contract:
      - bounded dependency kind partner-system
      - declared config names
      - declared secret names
      - dependency owner and evidence expectation
    implementation:
      - infra/app/workload_inventory.tf
      - packages/infrastructure
      - scripts/platform/admission_check.py
    adoption_steps:
      - keep partner endpoints and credentials in operator-owned configuration
      - keep partner protocol adapters outside domain and application packages
      - prove reachability or handoff evidence before cloud admission
