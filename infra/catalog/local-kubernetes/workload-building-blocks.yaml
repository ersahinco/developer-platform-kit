schema_version: "1"
runtime_target: local-kubernetes
owner: platform-toolkit
description: >
  Reusable local Kubernetes runtime-target building blocks for proving workload
  network, storage, compute, probe, job, service identity, config, and secret
  boundaries with standard Kubernetes resources.
entries:
  - id: local-kubernetes-service
    type: service-runtime
    provides:
      - local OCI image execution in a kind cluster
      - Kubernetes Service routing
      - liveness and readiness probe proof
    consumes_contract:
      - workload kind
      - workload image repository
      - service port
      - health and readiness endpoints
      - config and secret names
    implementation:
      - infra/local-kubernetes
      - platform/workload.Dockerfile
      - platform/workloads.json
    adoption_steps:
      - add the workload to runtime.supported only after a local Kubernetes manifest exists
      - use Kubernetes Service and probe names that match the workload contract
      - keep provider-specific ingress, identity, and storage choices out of this local proof runtime

  - id: local-kubernetes-job
    type: job-runtime
    provides:
      - local Kubernetes Job execution
      - meaningful process exit status
      - structured success event proof
    consumes_contract:
      - job operational class
      - idempotency statement
      - config and secret names
      - operator evidence expectations
    implementation:
      - infra/local-kubernetes
      - platform/workload.Dockerfile
    adoption_steps:
      - use a Kubernetes Job only for workloads that already declare job semantics
      - keep job output under a configured storage path
      - verify completion and structured success logs in the smoke target

  - id: local-kubernetes-config-secret-boundary
    type: config-runtime
    provides:
      - ConfigMap-backed workload configuration
      - Secret-backed local-only placeholders
      - explicit runtime injection surface
    consumes_contract:
      - config.env names
      - config.secrets names
    implementation:
      - infra/local-kubernetes/runtime-db.yaml
      - platform/workloads.json
    adoption_steps:
      - inject only declared config and secret names
      - keep secret values local placeholders
      - do not encode provider secret managers in local Kubernetes manifests

  - id: local-kubernetes-storage-proof
    type: storage-runtime
    provides:
      - PersistentVolumeClaim-backed local artifact output
      - repeatable local inspection
      - job evidence preservation
    consumes_contract:
      - output config names
      - job success evidence
      - idempotent output behavior
    implementation:
      - infra/local-kubernetes/runtime-db.yaml
      - infra/local-kubernetes/workload-jobs.yaml
    adoption_steps:
      - mount storage only where the workload contract needs output evidence
      - keep cloud storage choices at the runtime edge
      - verify job logs and artifact paths through smoke checks
