---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-components
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
data:
  async-events-pubsub.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: async-events-pubsub
    spec:
      type: pubsub.redis
      version: v1
      metadata:
        - name: redisHost
          value: redis:6379
        - name: enableTLS
          value: "false"
  resiliency.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Resiliency
    metadata:
      name: async-eventing-resiliency
    scopes:
      - event-consumer
    spec:
      policies:
        timeouts:
          asyncEventsPubsub: 10s
        retries:
          asyncEventsPubsub:
            policy: constant
            duration: 1s
            maxRetries: 2
        circuitBreakers:
          asyncEventsPubsub:
            maxRequests: 1
            interval: 30s
            timeout: 30s
            trip: consecutiveFailures > 5
      targets:
        components:
          async-events-pubsub:
            outbound:
              timeout: asyncEventsPubsub
              retry: asyncEventsPubsub
              circuitBreaker: asyncEventsPubsub
            inbound:
              timeout: asyncEventsPubsub
              retry: asyncEventsPubsub
              circuitBreaker: asyncEventsPubsub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-config
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
data:
  config.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Configuration
    metadata:
      name: async-eventing-config
    spec:
      tracing:
        samplingRate: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: redis
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.2.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-tmp
              mountPath: /tmp
      volumes:
        - name: redis-data
          emptyDir: {}
        - name: redis-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
