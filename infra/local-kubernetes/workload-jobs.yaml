---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-export-job
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: data-export-job
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-export-job
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: data_export_job
    spec:
      restartPolicy: Never
      serviceAccountName: workload-runtime
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-pgbouncer
          image: postgres:18.3
          command: ["sh", "-c", "until pg_isready -h pgbouncer -U postgres -d aws_sdlc_containers; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
        - name: wait-for-schema
          image: postgres:18.3
          command:
            - sh
            - -c
            - until psql -h pgbouncer -U postgres -d aws_sdlc_containers -tAc "SELECT to_regclass('public.order_contact_email')" | grep -q order_contact_email; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
      containers:
        - name: data-export-job
          image: aws-sdlc-containers-data-export-job:local-kubernetes
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          envFrom:
            - configMapRef:
                name: workload-config
            - secretRef:
                name: workload-secrets
          volumeMounts:
            - name: data-exports
              mountPath: /exports
      volumes:
        - name: data-exports
          persistentVolumeClaim:
            claimName: data-exports
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-worker
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: backfill-worker
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backfill-worker
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: backfill_worker
    spec:
      restartPolicy: Never
      serviceAccountName: workload-runtime
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-schema
          image: postgres:18.3
          command:
            - sh
            - -c
            - until psql -h db -U postgres -d aws_sdlc_containers -tAc "SELECT to_regclass('public.order_contact_email')" | grep -q order_contact_email; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
      containers:
        - name: backfill-worker
          image: aws-sdlc-containers-backfill-worker:local-kubernetes
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@db:5432/aws_sdlc_containers
            - name: DB_HOST
              value: db
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
            - name: BACKFILL_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: BACKFILL_BATCH_SIZE
            - name: BACKFILL_SLEEP_MS
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: BACKFILL_SLEEP_MS
            - name: BACKFILL_MAX_BATCHES
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: BACKFILL_MAX_BATCHES
---
