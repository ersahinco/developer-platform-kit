apiVersion: batch/v1
kind: Job
metadata:
  name: integration-check-job
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: integration-check-job
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integration-check-job
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: integration_check_job
    spec:
      restartPolicy: Never
      serviceAccountName: workload-runtime
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.17.0
          command: ["sh", "-c", "until curl --fail --silent http://api:8000/health; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
      containers:
        - name: integration-check-job
          image: aws-sdlc-containers-integration-check-job:local-kubernetes
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: INTEGRATION_CHECK_TARGETS
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: INTEGRATION_CHECK_TARGETS
            - name: INTEGRATION_CHECK_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: INTEGRATION_CHECK_TIMEOUT_SECONDS
            - name: INTEGRATION_CHECK_RUN_ID
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: INTEGRATION_CHECK_RUN_ID
            - name: INTEGRATION_CHECK_OUTPUT_DIR
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: INTEGRATION_CHECK_OUTPUT_DIR
          volumeMounts:
            - name: data-exports
              mountPath: /exports
      volumes:
        - name: data-exports
          persistentVolumeClaim:
            claimName: data-exports
