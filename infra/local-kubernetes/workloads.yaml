apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
  annotations:
    workload.metrics.path: /metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: api
    spec:
      serviceAccountName: workload-runtime
      initContainers:
        - name: wait-for-pgbouncer
          image: postgres:18.3
          command: ["sh", "-c", "until pg_isready -h pgbouncer -U postgres -d aws_sdlc_containers; do sleep 2; done"]
      containers:
        - name: api
          image: aws-sdlc-containers-api:local-kubernetes
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DATABASE_URL
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
            - name: PRIMARY_EDGE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: PRIMARY_EDGE_AUTH_TOKEN
            - name: OTEL_TRACES_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OTEL_TRACES_ENABLED
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OTEL_SERVICE_NAME
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OTEL_DEPLOYMENT_ENVIRONMENT
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-export-job
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: data-export-job
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-export-job
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: data_export_job
    spec:
      restartPolicy: Never
      serviceAccountName: workload-runtime
      initContainers:
        - name: wait-for-pgbouncer
          image: postgres:18.3
          command: ["sh", "-c", "until pg_isready -h pgbouncer -U postgres -d aws_sdlc_containers; do sleep 2; done"]
      containers:
        - name: data-export-job
          image: aws-sdlc-containers-data-export-job:local-kubernetes
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: workload-config
            - secretRef:
                name: workload-secrets
          volumeMounts:
            - name: data-exports
              mountPath: /exports
      volumes:
        - name: data-exports
          persistentVolumeClaim:
            claimName: data-exports
---
apiVersion: batch/v1
kind: Job
metadata:
  name: integration-check-job
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: integration-check-job
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integration-check-job
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: integration_check_job
    spec:
      restartPolicy: Never
      serviceAccountName: workload-runtime
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.17.0
          command: ["sh", "-c", "until curl --fail --silent http://api:8000/health; do sleep 2; done"]
      containers:
        - name: integration-check-job
          image: aws-sdlc-containers-integration-check-job:local-kubernetes
          imagePullPolicy: IfNotPresent
          env:
            - name: INTEGRATION_CHECK_TARGETS
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: INTEGRATION_CHECK_TARGETS
            - name: INTEGRATION_CHECK_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: INTEGRATION_CHECK_TIMEOUT_SECONDS
            - name: INTEGRATION_CHECK_RUN_ID
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: INTEGRATION_CHECK_RUN_ID
            - name: INTEGRATION_CHECK_OUTPUT_DIR
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: INTEGRATION_CHECK_OUTPUT_DIR
          volumeMounts:
            - name: data-exports
              mountPath: /exports
      volumes:
        - name: data-exports
          persistentVolumeClaim:
            claimName: data-exports
