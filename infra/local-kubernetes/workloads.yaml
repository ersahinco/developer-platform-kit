apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
  annotations:
    workload.metrics.path: /metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: api
    spec:
      serviceAccountName: workload-runtime
      initContainers:
        - name: wait-for-pgbouncer
          image: postgres:18.3
          command: ["sh", "-c", "until pg_isready -h pgbouncer -U postgres -d aws_sdlc_containers; do sleep 2; done"]
      containers:
        - name: api
          image: aws-sdlc-containers-api:local-kubernetes
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DATABASE_URL
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
            - name: PRIMARY_EDGE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: PRIMARY_EDGE_AUTH_TOKEN
            - name: OTEL_TRACES_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OTEL_TRACES_ENABLED
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OTEL_SERVICE_NAME
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OTEL_DEPLOYMENT_ENVIRONMENT
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-export-job
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: data-export-job
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-export-job
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: data_export_job
    spec:
      restartPolicy: Never
      serviceAccountName: workload-runtime
      initContainers:
        - name: wait-for-pgbouncer
          image: postgres:18.3
          command: ["sh", "-c", "until pg_isready -h pgbouncer -U postgres -d aws_sdlc_containers; do sleep 2; done"]
        - name: wait-for-schema
          image: postgres:18.3
          command:
            - sh
            - -c
            - until psql -h pgbouncer -U postgres -d aws_sdlc_containers -tAc "SELECT to_regclass('public.order_contact_email')" | grep -q order_contact_email; do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
      containers:
        - name: data-export-job
          image: aws-sdlc-containers-data-export-job:local-kubernetes
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: workload-config
            - secretRef:
                name: workload-secrets
          volumeMounts:
            - name: data-exports
              mountPath: /exports
      volumes:
        - name: data-exports
          persistentVolumeClaim:
            claimName: data-exports
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-consumer
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: event-consumer
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
  annotations:
    workload.metrics.path: /metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-consumer
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: event_consumer
    spec:
      serviceAccountName: workload-runtime
      initContainers:
        - name: wait-for-db
          image: postgres:18.3
          command: ["sh", "-c", "until pg_isready -h db -U postgres -d aws_sdlc_containers; do sleep 2; done"]
        - name: wait-for-redis
          image: redis:8.2.1
          command: ["sh", "-c", "until redis-cli -h redis ping | grep -q PONG; do sleep 2; done"]
      containers:
        - name: event-consumer
          image: aws-sdlc-containers-event-consumer:local-kubernetes
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@db:5432/aws_sdlc_containers
            - name: DB_HOST
              value: db
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
            - name: DAPR_HTTP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DAPR_HTTP_ENDPOINT
            - name: DAPR_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DAPR_HTTP_PORT
            - name: ASYNC_EVENT_WORKER_MODE
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: ASYNC_EVENT_WORKER_MODE
            - name: ASYNC_EVENT_WORKER_RUN_ONCE
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: ASYNC_EVENT_WORKER_RUN_ONCE
            - name: DAPR_PUBSUB_NAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DAPR_PUBSUB_NAME
            - name: DAPR_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DAPR_TOPIC
            - name: DAPR_SUBSCRIPTION_ROUTE
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DAPR_SUBSCRIPTION_ROUTE
            - name: OUTBOX_RELAY_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OUTBOX_RELAY_BATCH_SIZE
            - name: OUTBOX_RELAY_IDLE_SLEEP_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: OUTBOX_RELAY_IDLE_SLEEP_SECONDS
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
        - name: daprd
          image: daprio/daprd:1.17.0
          imagePullPolicy: IfNotPresent
          command: ["./daprd"]
          args:
            - --app-id
            - event-consumer
            - --app-port
            - "8081"
            - --dapr-http-port
            - "3500"
            - --resources-path
            - /dapr/components
            - --config
            - /dapr/config/config.yaml
            - --log-level
            - warn
          ports:
            - name: dapr-http
              containerPort: 3500
          volumeMounts:
            - name: dapr-components
              mountPath: /dapr/components
              readOnly: true
            - name: dapr-config
              mountPath: /dapr/config
              readOnly: true
      volumes:
        - name: dapr-components
          configMap:
            name: dapr-components
        - name: dapr-config
          configMap:
            name: dapr-config
---
apiVersion: v1
kind: Service
