apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-runtime
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-config
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
data:
  DB_HOST: pgbouncer
  DB_PORT: "5432"
  DB_USER: postgres
  DB_NAME: aws_sdlc_containers
  DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/aws_sdlc_containers
  DATA_EXPORT_OUTPUT_DIR: /exports
  DATA_EXPORT_RUN_ID: local-kubernetes
  DATA_EXPORT_DATE: "2026-06-06"
  DATA_EXPORT_S3_BUCKET: local-kubernetes-artifacts
  INTEGRATION_CHECK_TARGETS: api=http://api:8000/health
  INTEGRATION_CHECK_TIMEOUT_SECONDS: "5"
  INTEGRATION_CHECK_RUN_ID: local-kubernetes
  INTEGRATION_CHECK_OUTPUT_DIR: /exports/integration-checks
  OTEL_TRACES_ENABLED: "false"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
  OTEL_SERVICE_NAME: aws-sdlc-containers-api
  OTEL_DEPLOYMENT_ENVIRONMENT: local-kubernetes
---
apiVersion: v1
kind: Secret
metadata:
  name: workload-secrets
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
type: Opaque
stringData:
  DB_PASSWORD: postgres
  PRIMARY_EDGE_AUTH_TOKEN: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-exports
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: db
    spec:
      containers:
        - name: postgres
          image: postgres:18.3
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "aws_sdlc_containers"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "aws_sdlc_containers"]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.1-p0
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
            - name: POOL_MODE
              value: transaction
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: MAX_CLIENT_CONN
              value: "200"
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: STATS_PERIOD
              value: "3600"
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  selector:
    app.kubernetes.io/name: pgbouncer
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: batch/v1
kind: Job
metadata:
  name: liquibase
  namespace: aws-sdlc-local
  labels:
    app.kubernetes.io/name: liquibase
    app.kubernetes.io/part-of: aws-sdlc-containers
    runtime.target: local-kubernetes
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: liquibase
        app.kubernetes.io/part-of: aws-sdlc-containers
        runtime.target: local-kubernetes
        workload: liquibase
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:18.3
          command: ["sh", "-c", "until pg_isready -h db -U postgres -d aws_sdlc_containers; do sleep 2; done"]
      containers:
        - name: liquibase
          image: aws-sdlc-containers-liquibase:local-kubernetes
          imagePullPolicy: IfNotPresent
          env:
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: changelog/db.changelog-master.yaml
            - name: LIQUIBASE_SEARCH_PATH
              value: /liquibase/db
            - name: LIQUIBASE_COMMAND_URL
              value: jdbc:postgresql://db:5432/aws_sdlc_containers
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: workload-config
                  key: DB_USER
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: DB_PASSWORD
