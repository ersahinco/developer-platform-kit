[project]
name = "__WORKLOAD_NAME__"
version = "0.1.0"
description = "__WORKLOAD_NAME__, owned by __OWNER__"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120.0",
    "prometheus-client>=0.23.0",
    "uvicorn>=0.38.0",
