apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: platform-session
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-session
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Generate once, as in the pinned CNOE password resources.
  refreshInterval: "0"
  target:
    name: platform-session
    # Adopt the previous bootstrap secret and retain it if this resource is removed.
    # First adoption replaces its value; existing browser sessions must sign in again.
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        SESSION_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: platform-session
