apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: async-events-pubsub
scopes:
  - event-consumer
spec:
  type: pubsub.aws.snssqs
  version: v1
  metadata:
    # Terraform injects runtime-owned SNS/SQS names before publishing this file.
    - name: region
      value: "${aws_region}"
    - name: consumerID
      value: "${subscriber_queue_name}"
    - name: fifo
      value: "true"
    - name: fifoMessageGroupID
      value: "async-events"
    - name: concurrencyMode
      value: "single"
    - name: messageReceiveLimit
      value: "5"
    - name: sqsDeadLettersQueueName
      value: "${dlq_name}"
    - name: disableEntityManagement
      value: "true"
    # Credentials are provided via ECS task IAM role — no static keys.
