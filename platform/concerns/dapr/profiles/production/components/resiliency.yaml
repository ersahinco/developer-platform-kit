apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: async-eventing-resiliency
scopes:
  - event-consumer
spec:
  # Production-tuned policies — higher timeouts and retry budget than local dev.
  # The authoritative rendered version is infra/app/templates/dapr/resiliency.yaml.tftpl.
  policies:
    timeouts:
      asyncEventsPubsub: 30s
    retries:
      asyncEventsPubsub:
        policy: constant
        duration: 5s
        maxRetries: 3
    circuitBreakers:
      asyncEventsPubsub:
        maxRequests: 1
        interval: 60s
        timeout: 60s
        trip: consecutiveFailures > 5
  targets:
    components:
      async-events-pubsub:
        outbound:
          timeout: asyncEventsPubsub
          retry: asyncEventsPubsub
          circuitBreaker: asyncEventsPubsub
        inbound:
          timeout: asyncEventsPubsub
          retry: asyncEventsPubsub
          circuitBreaker: asyncEventsPubsub
