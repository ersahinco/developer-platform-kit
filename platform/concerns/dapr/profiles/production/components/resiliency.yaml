apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: order-events-resiliency
scopes:
  - order-event-consumer
spec:
  # Production-tuned policies — higher timeouts and retry budget than local dev.
  # The authoritative rendered version is infra/app/templates/dapr/resiliency.yaml.tftpl.
  policies:
    timeouts:
      orderEventsPubsub: 30s
    retries:
      orderEventsPubsub:
        policy: constant
        duration: 5s
        maxRetries: 3
    circuitBreakers:
      orderEventsPubsub:
        maxRequests: 1
        interval: 60s
        timeout: 60s
        trip: consecutiveFailures > 5
  targets:
    components:
      order-events-pubsub:
        outbound:
          timeout: orderEventsPubsub
          retry: orderEventsPubsub
          circuitBreaker: orderEventsPubsub
        inbound:
          timeout: orderEventsPubsub
          retry: orderEventsPubsub
          circuitBreaker: orderEventsPubsub
