apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: async-eventing-resiliency
scopes:
  - event-consumer
spec:
  policies:
    timeouts:
      asyncEventsPubsub: 10s
    retries:
      asyncEventsPubsub:
        policy: constant
        duration: 1s
        maxRetries: 2
    circuitBreakers:
      asyncEventsPubsub:
        maxRequests: 1
        interval: 30s
        timeout: 30s
        trip: consecutiveFailures > 5
  targets:
    components:
      async-events-pubsub:
        outbound:
          timeout: asyncEventsPubsub
          retry: asyncEventsPubsub
          circuitBreaker: asyncEventsPubsub
        inbound:
          timeout: asyncEventsPubsub
          retry: asyncEventsPubsub
          circuitBreaker: asyncEventsPubsub
