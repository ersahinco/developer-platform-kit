name: App No-Data Rollback Drill

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable app image tag to deploy for the drill, for example sha-<commit>."
        required: true
        type: string
      fault_mode:
        description: "Fault behavior to inject into /ready for the drill."
        required: true
        default: error
        type: choice
        options:
          - error
          - latency
      confirm_drill:
        description: "Type rollback-drill to confirm this app-only drill."
        required: true
        type: string
      dry_run:
        description: "Run non-destructive rollback-drill readiness checks only."
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
  PRIMARY_EDGE_TOKEN_SECRET: ${{ vars.PRIMARY_EDGE_TOKEN_SECRET || format('{0}/edge-token', vars.STACK_NAME || github.event.repository.name) }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  APP_ROLLBACK_ERROR_SLO_SECONDS: "600"
  APP_ROLLBACK_LATENCY_SLO_SECONDS: "900"
  APP_ROLLBACK_VERIFY_SLO_SECONDS: "120"

concurrency:
  group: app-rollback-drill-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: App Rollback Drill
    if: >
      (inputs.dry_run || inputs.confirm_drill == 'rollback-drill') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve root domain
        run: scripts/ci/ci_resolve_root_domain.sh

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --frozen --group scripts

      - name: Validate image tag
        env:
          CI_REQUIRE_ROOT_DOMAIN: "true"
        run: scripts/ci/ci_validate_image_tag.sh "$IMAGE_TAG" "${{ github.event.repository.default_branch }}"

      - name: Summarize dry run
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### App rollback drill dry run"
            echo ""
            echo "- Mode: non-destructive readiness check"
            echo "- Rollback task definition is rendered and fault-injection config is prepared"
            echo "- No ECS deployment or rollback is triggered"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS image registry
        id: aws-context
        run: scripts/ci/ci_resolve_aws_context.sh

      - name: Resolve primary edge service
        id: primary-service
        run: |
          IFS=$'\t' read -r workload_name service hostname_label < <(python3 -m scripts.platform.workload_metadata primary-edge)
          {
            echo "service=${service}"
            echo "workload_name=${workload_name}"
            echo "hostname_label=${hostname_label}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify drill images exist
        if: ${{ !inputs.dry_run }}
        run: |
          aws ecr describe-images \
            --repository-name "${STACK_NAME}/${{ steps.primary-service.outputs.service }}" \
            --image-ids "imageTag=${IMAGE_TAG}"

      - name: Capture current app task definition
        id: current
        run: |
          service_json=$(aws ecs describe-services \
            --cluster "${{ env.STACK_NAME }}" \
            --services "${{ steps.primary-service.outputs.service }}" \
            --output json)
          current_task_definition=$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition')
          primary_rollout_state=$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState')
          if [[ -z "$current_task_definition" || "$current_task_definition" == "None" ]]; then
            echo "Could not resolve current app task definition." >&2
            exit 1
          fi
          if [[ "$primary_rollout_state" != "COMPLETED" ]]; then
            echo "Current app primary deployment must be COMPLETED before rollback drill; got ${primary_rollout_state}." >&2
            exit 1
          fi
          echo "task_definition=$current_task_definition" >> "$GITHUB_OUTPUT"
          echo "Current completed task definition: $current_task_definition"

      - name: Validate rollback alarms are clear
        run: |
          mapfile -t alarm_names < <(python3 -m scripts.observability.platform_inventory edge-symptom-alarms "${STACK_NAME}")
          if [[ "${#alarm_names[@]}" -ne 2 ]]; then
            echo "Expected 2 edge symptom alarms, found ${#alarm_names[@]}." >&2
            exit 1
          fi
          alarm_count=$(aws cloudwatch describe-alarms \
            --alarm-names "${alarm_names[@]}" \
            --query "length(MetricAlarms)" \
            --output text)
          if [[ "$alarm_count" != "2" ]]; then
            echo "Expected 2 rollback alarms, found ${alarm_count}." >&2
            exit 1
          fi
          alarming=$(aws cloudwatch describe-alarms \
            --alarm-names "${alarm_names[@]}" \
            --query "MetricAlarms[?StateValue==\`ALARM\`].AlarmName" \
            --output text)
          if [[ -n "$alarming" ]]; then
            echo "Rollback alarms must be clear before starting the drill; in ALARM: ${alarming}" >&2
            exit 1
          fi

      - name: Render drill app task definition
        run: |
          scripts/ci/ci_render_ecs_task_definition.sh \
            "${STACK_NAME}" \
            "${{ steps.primary-service.outputs.service }}" \
            "${{ steps.aws-context.outputs.ecr_registry }}/${STACK_NAME}/${{ steps.primary-service.outputs.service }}:${IMAGE_TAG}" \
            /tmp/primary-edge-drill-task-definition.json

      - name: Configure drill fault injection
        run: |
          tmp_path="$(mktemp)"
          jq --arg fault_mode "${{ inputs.fault_mode }}" --arg container_name "${{ steps.primary-service.outputs.service }}" '
            .containerDefinitions |= map(
              if .name == $container_name then
                .environment = (
                  ((.environment // [])
                    | map({(.name): .value})
                    | add
                    | . + {
                        "ROLLOUT_DRILL_FAULT_MODE": $fault_mode,
                        "ROLLOUT_DRILL_FAULT_PATHS": "/ready",
                        "ROLLOUT_DRILL_FAULT_DELAY_SECONDS": "3",
                        "ROLLOUT_DRILL_FAULT_STATUS_CODE": "503"
                      }
                    | to_entries
                    | map({name: .key, value: .value})
                    | sort_by(.name)
                )
              else
                .
              end
            )
          ' /tmp/primary-edge-drill-task-definition.json > "$tmp_path"
          mv "$tmp_path" /tmp/primary-edge-drill-task-definition.json

      - name: Deploy drill app revision
        if: ${{ !inputs.dry_run }}
        id: deploy_drill
        env:
          ECS_DEPLOY_WAIT_FOR_STABLE: "false"
        run: |
          echo "deploy_started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          scripts/ci/ci_deploy_ecs_service.sh "${STACK_NAME}" "${{ steps.primary-service.outputs.service }}" /tmp/primary-edge-drill-task-definition.json

      - name: Wait for ECS automatic rollback
        if: ${{ !inputs.dry_run }}
        id: wait_rollback
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
          FAULT_MODE: ${{ inputs.fault_mode }}
          DEPLOY_STARTED_EPOCH: ${{ steps.deploy_drill.outputs.deploy_started_epoch }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.current.outputs.task_definition }}
          DRILL_TASK_DEFINITION: ${{ steps.deploy_drill.outputs.task_def_arn }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
            --region ${{ env.AWS_REGION }} \
            --query SecretString \
            --output text)
          if [[ -z "$DRILL_TASK_DEFINITION" ]]; then
            echo "Could not resolve registered drill task definition." >&2
            exit 1
          fi
          rollback_slo_seconds="$APP_ROLLBACK_LATENCY_SLO_SECONDS"
          if [[ "$FAULT_MODE" == "error" ]]; then
            rollback_slo_seconds="$APP_ROLLBACK_ERROR_SLO_SECONDS"
          fi
          traffic_deadline=$((SECONDS + 720))
          while (( SECONDS < traffic_deadline )); do
            curl --silent --show-error --output /dev/null \
              --header "Authorization: Bearer ${TOKEN}" \
              "${BASE_URL}/ready" || true
            sleep 2
          done &
          traffic_pid=$!
          trap 'kill "$traffic_pid" 2>/dev/null || true' EXIT

          rollback_deadline=$((SECONDS + 1200))
          while (( SECONDS < rollback_deadline )); do
            service_json=$(aws ecs describe-services \
              --cluster "${{ env.STACK_NAME }}" \
              --services "${{ steps.primary-service.outputs.service }}" \
              --output json)
            primary_task_definition=$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition')
            primary_rollout_state=$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState')
            echo "Primary task definition: ${primary_task_definition}; rolloutState=${primary_rollout_state}"

            if [[ "$primary_task_definition" == "$PREVIOUS_TASK_DEFINITION" && "$primary_rollout_state" == "COMPLETED" ]]; then
              rollback_seconds=$(($(date +%s) - DEPLOY_STARTED_EPOCH))
              echo "rollback_seconds=${rollback_seconds}" >> "$GITHUB_OUTPUT"
              {
                echo "### Rollback drill SLO evidence"
                echo ""
                echo "- Fault mode: ${FAULT_MODE}"
                echo "- Rollback observed in: ${rollback_seconds}s"
                echo "- Rollback SLO: ${rollback_slo_seconds}s"
                echo "- Bad task definition: ${DRILL_TASK_DEFINITION}"
                echo "- Restored task definition: ${PREVIOUS_TASK_DEFINITION}"
              } >> "$GITHUB_STEP_SUMMARY"
              if (( rollback_seconds > rollback_slo_seconds )); then
                echo "ECS rollback exceeded ${FAULT_MODE} SLO: ${rollback_seconds}s > ${rollback_slo_seconds}s." >&2
                exit 1
              fi
              echo "ECS automatically rolled back to ${PREVIOUS_TASK_DEFINITION}."
              kill "$traffic_pid" 2>/dev/null || true
              wait "$traffic_pid" 2>/dev/null || true
              exit 0
            fi

            if [[ "$primary_task_definition" == "$DRILL_TASK_DEFINITION" && "$primary_rollout_state" == "COMPLETED" ]]; then
              echo "Bad drill revision completed instead of being rolled back: ${DRILL_TASK_DEFINITION}" >&2
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for ECS automatic rollback to ${PREVIOUS_TASK_DEFINITION}." >&2
          exit 1

      - name: Verify restored app revision
        if: ${{ !inputs.dry_run }}
        id: verify-restored
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
          ECS_CLUSTER: ${{ env.STACK_NAME }}
          ECS_SERVICE: ${{ steps.primary-service.outputs.service }}
          EXPECTED_TASK_FAMILY: ${{ env.STACK_NAME }}
          WORKLOAD_CONTAINER_NAME: ${{ steps.primary-service.outputs.service }}
        run: |
          verify_started_epoch=$(date +%s)
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
            --region ${{ env.AWS_REGION }} \
            --query SecretString \
            --output text)
          TOKEN="$TOKEN" uv run python -m scripts.release.verify_post_deploy
          verify_seconds=$(($(date +%s) - verify_started_epoch))
          echo "verify_seconds=${verify_seconds}" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### Restored app verification SLO evidence"
            echo ""
            echo "- Verification completed in: ${verify_seconds}s"
            echo "- Verification SLO: ${APP_ROLLBACK_VERIFY_SLO_SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( verify_seconds > APP_ROLLBACK_VERIFY_SLO_SECONDS )); then
            echo "Restored app verification exceeded SLO: ${verify_seconds}s > ${APP_ROLLBACK_VERIFY_SLO_SECONDS}s." >&2
            exit 1
          fi

      - name: Summarize dry-run rollback readiness
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo ""
            echo "- Current completed task definition: ${{ steps.current.outputs.task_definition }}"
            echo "- Fault mode preview: ${{ inputs.fault_mode }}"
            echo "- Drill task definition rendered to: /tmp/primary-edge-drill-task-definition.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write app rollback drill evidence
        if: ${{ always() && !inputs.dry_run }}
        env:
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL || vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          python3 -m scripts.observability.release_event \
            --event-type app_rollback_drill \
            --status "${{ job.status }}" \
            --summary "App rollback drill completed with status ${{ job.status }}" \
            --service-name "${{ steps.primary-service.outputs.service }}" \
            --workload-id "${{ steps.primary-service.outputs.workload_name }}" \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --task-definition "${{ steps.current.outputs.task_definition }}" \
            --previous-task-definition "${{ steps.current.outputs.task_definition }}" \
            --drill-task-definition "${{ steps.deploy_drill.outputs.task_def_arn }}" \
            --fault-mode "${{ inputs.fault_mode }}" \
            --rollback-category app_image \
            --rollback-seconds "${{ steps.wait_rollback.outputs.rollback_seconds }}" \
            --rollback-slo-seconds "${{ inputs.fault_mode == 'error' && env.APP_ROLLBACK_ERROR_SLO_SECONDS || env.APP_ROLLBACK_LATENCY_SLO_SECONDS }}" \
            --verify-seconds "${{ steps.verify-restored.outputs.verify_seconds }}" \
            --verify-slo-seconds "${{ env.APP_ROLLBACK_VERIFY_SLO_SECONDS }}" \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/app-rollback-drill
          cat /tmp/release-evidence/app-rollback-drill/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app rollback drill evidence
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-app-rollback-drill-${{ github.run_id }}
          path: /tmp/release-evidence/app-rollback-drill
          retention-days: 30
