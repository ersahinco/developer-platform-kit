name: Infra Apply

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Workflow run ID from the Infra Plan run to apply."
        required: true
        type: string
      confirm_apply:
        description: "Type apply to confirm Terraform apply against platform and app roots."
        required: true
        type: string

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.15.0
  TF_PLATFORM_STATE_KEY: aws-sdlc-containers/platform.tfstate
  TF_APP_STATE_KEY: aws-sdlc-containers/app.tfstate
  PLAN_RUN_ID: ${{ inputs.plan_run_id }}

concurrency:
  group: infra-apply-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply Reviewed Plans
    if: >
      inputs.confirm_apply == 'apply' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Resolve plan run
        id: plan
        uses: actions/github-script@v9
        with:
          script: |
            const run_id = Number(process.env.PLAN_RUN_ID);
            if (!Number.isSafeInteger(run_id)) {
              core.setFailed('plan_run_id must be a numeric workflow run ID.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id,
            });

            if (run.name !== 'Infra Plan') {
              core.setFailed(`Expected an Infra Plan workflow run, got ${run.name}.`);
              return;
            }
            if (!['push', 'workflow_dispatch'].includes(run.event)) {
              core.setFailed(`Plan run ${run_id} came from ${run.event}; apply only accepts main-branch push or manual plan runs.`);
              return;
            }
            if (run.head_branch !== defaultBranch) {
              core.setFailed(`Plan run ${run_id} was for ${run.head_branch}; expected ${defaultBranch}.`);
              return;
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`Plan run ${run_id} is ${run.status}/${run.conclusion}.`);
              return;
            }

            const { data: branch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: defaultBranch,
            });
            if (run.head_sha !== branch.commit.sha) {
              core.setFailed(`Plan run ${run_id} is for ${run.head_sha}; current ${defaultBranch} is ${branch.commit.sha}. Re-run Infra Plan before applying.`);
              return;
            }

            core.setOutput('run_id', String(run_id));
            core.setOutput('head_sha', run.head_sha);

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.plan.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: terraform-plan-${{ steps.plan.outputs.run_id }}
          run-id: ${{ steps.plan.outputs.run_id }}
          github-token: ${{ github.token }}
          path: infra

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init platform
        run: |
          terraform init \
            -backend-config="key=${{ env.TF_PLATFORM_STATE_KEY }}" \
            -reconfigure
        working-directory: infra/platform

      - name: terraform apply platform reviewed plan
        run: terraform apply -auto-approve platform.tfplan
        working-directory: infra/platform

      - name: terraform init app
        run: |
          terraform init \
            -backend-config="key=${{ env.TF_APP_STATE_KEY }}" \
            -reconfigure
        working-directory: infra/app

      - name: terraform apply app reviewed plan
        run: terraform apply -auto-approve app.tfplan
        working-directory: infra/app
