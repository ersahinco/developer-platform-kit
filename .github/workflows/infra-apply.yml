name: Infra Apply

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Workflow run ID from the Infra Plan run to apply."
        required: true
        type: string
      confirm_apply:
        description: "Type apply to confirm Terraform apply against platform and app roots."
        required: true
        type: string
      allow_ecs_task_definition_changes:
        description: "Optional. Type allow-ecs-task-definition-changes only for a reviewed infra change that intentionally updates ECS task definitions."
        required: false
        type: string

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.15.0
  TF_PLATFORM_STATE_KEY: aws-sdlc-containers/platform.tfstate
  TF_APP_STATE_KEY: aws-sdlc-containers/app.tfstate
  PLAN_RUN_ID: ${{ inputs.plan_run_id }}

concurrency:
  group: infra-apply-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply Reviewed Plans
    if: >
      inputs.confirm_apply == 'apply' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Resolve plan run
        id: plan
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const run_id = Number(process.env.PLAN_RUN_ID);
            if (!Number.isSafeInteger(run_id)) {
              core.setFailed('plan_run_id must be a numeric workflow run ID.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id,
            });

            if (run.name !== 'Infra Plan') {
              core.setFailed(`Expected an Infra Plan workflow run, got ${run.name}.`);
              return;
            }
            if (!['push', 'workflow_dispatch'].includes(run.event)) {
              core.setFailed(`Plan run ${run_id} came from ${run.event}; apply only accepts main-branch push or manual plan runs.`);
              return;
            }
            if (run.head_branch !== defaultBranch) {
              core.setFailed(`Plan run ${run_id} was for ${run.head_branch}; expected ${defaultBranch}.`);
              return;
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`Plan run ${run_id} is ${run.status}/${run.conclusion}.`);
              return;
            }

            const { data: branch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: defaultBranch,
            });
            if (run.head_sha !== branch.commit.sha) {
              core.setFailed(`Plan run ${run_id} is for ${run.head_sha}; current ${defaultBranch} is ${branch.commit.sha}. Re-run Infra Plan before applying.`);
              return;
            }

            core.setOutput('run_id', String(run_id));
            core.setOutput('head_sha', run.head_sha);

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.plan.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8
        with:
          name: terraform-plan-${{ steps.plan.outputs.run_id }}
          run-id: ${{ steps.plan.outputs.run_id }}
          github-token: ${{ github.token }}
          path: infra

      - name: Guard reviewed plan blast radius
        env:
          ALLOW_ECS_TASK_DEFINITION_CHANGES: ${{ inputs.allow_ecs_task_definition_changes }}
        run: scripts/ci/ci_guard_infra_plan_blast_radius.sh infra/app/app_plan_output.txt

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init platform
        run: |
          terraform init \
            -backend-config="key=${{ env.TF_PLATFORM_STATE_KEY }}" \
            -reconfigure
        working-directory: infra/platform

      - name: terraform apply platform reviewed plan
        run: terraform apply -auto-approve platform.tfplan
        working-directory: infra/platform

      - name: terraform init app
        run: |
          terraform init \
            -backend-config="key=${{ env.TF_APP_STATE_KEY }}" \
            -reconfigure
        working-directory: infra/app

      - name: terraform apply app reviewed plan
        run: terraform apply -auto-approve app.tfplan
        working-directory: infra/app

  evidence:
    name: Evidence
    needs: apply
    if: >
      always() &&
      inputs.confirm_apply == 'apply' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write infra apply evidence
        env:
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL || vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          python3 scripts/observability/release_event.py \
            --event-type infra_apply \
            --status "${{ needs.apply.result }}" \
            --summary "Infra apply workflow completed with apply=${{ needs.apply.result }}" \
            --service-name infra \
            --plan-run-id "${{ env.PLAN_RUN_ID }}" \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/infra-apply
          cat /tmp/release-evidence/infra-apply/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload infra apply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-infra-apply-${{ github.run_id }}
          path: /tmp/release-evidence/infra-apply
          retention-days: 30
