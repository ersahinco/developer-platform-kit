name: Infra

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/infra.yml"
      - "infra/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/infra.yml"
      - "infra/**"

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.11.1
  TFLINT_VERSION: v0.55.0
  TF_STATE_KEY: aws-sdlc-containers/stack.tfstate
  TF_VARS_FILE: stack.tfvars

# Both PR plans and main applies target the same Terraform state key for the
# single stack. There is no environment promotion layer in this repo.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        run: |
          tflint --init
          tflint --format compact
        working-directory: infra

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          config_file: infra/.checkov.yaml

  plan:
    name: Plan
    needs: lint-and-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -reconfigure
        working-directory: infra

      - name: terraform plan
        id: plan
        run: |
          terraform plan -var-file=${{ env.TF_VARS_FILE }} -no-color -out=stack.tfplan 2>&1 \
            | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        working-directory: infra
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  apply:
    name: Apply
    needs: lint-and-validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -reconfigure
        working-directory: infra

      - name: terraform apply
        run: terraform apply -var-file=${{ env.TF_VARS_FILE }} -auto-approve
        working-directory: infra
