name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'data-ai/db-migration-example/**'

defaults:
  run:
    working-directory: data-ai/db-migration-example

# ---------------------------------------------------------------------------
# Pipeline overview
#
# validate-and-test
#   Runs on every push. Spins up a clean Postgres, applies all migrations,
#   seeds minimal data, starts the app, runs the full test suite.
#
# build-and-push
#   Builds the app Docker image and pushes it to ECR.
#   The image tag is the Git SHA — immutable, traceable.
#
# dev-migrate → dev-deploy
#   Runs Liquibase against the dev RDS instance as a one-shot ECS task
#   (same VPC as RDS, no public exposure). Then updates the ECS service
#   to the new image via a rolling deploy.
#
# qa-migrate → qa-seed → qa-deploy          [requires approval]
#   Same pattern as dev. qa-seed only inserts data if the DB is empty.
#
# prod-migrate → prod-deploy                [requires approval]
#   Applies the Expand changeset to prod RDS. The Contract changeset is
#   blocked by its sqlCheck precondition (READ_MODE != new) and is skipped.
#   The ECS service is updated with WRITE_MODE=dual (dual-write phase).
#   The backfill worker runs as a separate ECS task after this step.
#
# prod-contract                             [requires approval]
#   Runs after the backfill is complete and verify_contract_ready.py exits 0.
#   Applies the Contract changeset (drops orders.billing_email).
#   Requires a separate manual approval to enforce the pre-flight check gate.
# ---------------------------------------------------------------------------

jobs:
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: migration_example
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_example
      READ_MODE: legacy
      WRITE_MODE: dual
      APP_PORT: 8000
      BASE_URL: http://localhost:8000
      SEED_NUM_CUSTOMERS: 200
      SEED_NUM_ORDERS: 1000

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.16"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Init DB
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d migration_example -f db/sql/bootstrap.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d migration_example -f db/sql/observability.sql

      - name: Run migrations
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/data-ai/db-migration-example/db:/liquibase/db" \
            -e LIQUIBASE_SEARCH_PATH=/liquibase/db \
            liquibase/liquibase:4.27 \
            --changelog-file=changelog/db.changelog-master.yaml \
            --url=jdbc:postgresql://localhost:5432/migration_example \
            --username=postgres \
            --password=$POSTGRES_PASSWORD \
            update

      - name: Seed data
        run: uv run python scripts/seed_data.py

      - name: Start app
        run: |
          cd app/src
          uv run --directory ../.. uvicorn adapters.api.main:app --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-delay 1 --retry-connrefused -sf http://localhost:8000/health

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Stop app
        if: always()
        run: pkill -f "uvicorn adapters.api.main" || true

  build-and-push:
    name: Build & Push to ECR
    needs: validate-and-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # In a real deployment:
      #   aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
      #   docker build -t $ECR_REGISTRY/db-migration-example:${{ github.sha }} app/
      #   docker push $ECR_REGISTRY/db-migration-example:${{ github.sha }}
      - name: Build and push (placeholder)
        run: echo "Would push image tag ${{ steps.meta.outputs.tag }} to ECR"

  dev-migrate:
    name: Dev — Migrate
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4
      # Runs Liquibase as a one-shot ECS task in the same VPC as the dev RDS.
      # The task uses the same liquibase/liquibase:4.27 image, with DATABASE_URL
      # injected from AWS Secrets Manager via ECS task definition secrets.
      #
      # aws ecs run-task \
      #   --cluster dev-cluster \
      #   --task-definition liquibase-migrate \
      #   --overrides '{"containerOverrides":[{"name":"liquibase","command":["update"]}]}'
      - name: Run Liquibase on dev RDS (placeholder)
        run: echo "Would run liquibase update against dev RDS"

  dev-deploy:
    name: Dev — Deploy App
    needs: dev-migrate
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # Registers a new ECS task definition revision with the new image tag,
      # then updates the service — ECS handles the rolling deploy.
      #
      # aws ecs register-task-definition --family app --image $ECR_REGISTRY/db-migration-example:$IMAGE_TAG
      # aws ecs update-service --cluster dev-cluster --service app --task-definition app
      - name: Update ECS service on dev (placeholder)
        run: echo "Would deploy image ${{ needs.build-and-push.outputs.image_tag }} to dev ECS"

  qa-migrate:
    name: QA — Migrate
    needs: dev-deploy
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - uses: actions/checkout@v4
      - name: Run Liquibase on QA RDS (placeholder)
        run: echo "Would run liquibase update against QA RDS"

  qa-seed:
    name: QA — Seed (if empty)
    needs: qa-migrate
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - uses: actions/checkout@v4
      # Seed only runs if the DB is empty — seed_data.py is idempotent and
      # skips insertion if rows already exist.
      # DATABASE_URL points to QA RDS via Secrets Manager / env injection.
      # SEED_NUM_CUSTOMERS and SEED_NUM_ORDERS are set in the QA environment.
      - name: Seed QA data (placeholder)
        run: echo "Would run seed_data.py against QA RDS if empty"

  qa-deploy:
    name: QA — Deploy App
    needs: qa-seed
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Update ECS service on QA (placeholder)
        run: echo "Would deploy image ${{ needs.build-and-push.outputs.image_tag }} to QA ECS"

  prod-migrate:
    name: Prod — Migrate (Expand)
    needs: qa-deploy
    runs-on: ubuntu-latest
    environment: production-migrate
    # Applies Expand + Switch changesets. The Contract changeset is blocked
    # by its sqlCheck precondition (READ_MODE = legacy) and is skipped.

    steps:
      - uses: actions/checkout@v4
      - name: Run Liquibase on prod RDS (placeholder)
        run: echo "Would run liquibase update against prod RDS (Contract changeset skipped by precondition)"

  prod-deploy:
    name: Prod — Deploy App (dual-write)
    needs: prod-migrate
    runs-on: ubuntu-latest
    environment: production-deploy
    # Deploys the app with WRITE_MODE=dual. New orders write to both tables.
    # After this step: run the backfill worker as a one-shot ECS task, then
    # run verify_contract_ready.py before approving prod-contract.

    steps:
      - name: Update ECS service on prod (placeholder)
        run: echo "Would deploy image ${{ needs.build-and-push.outputs.image_tag }} to prod ECS with WRITE_MODE=dual"

  prod-contract:
    name: Prod — Contract Migration (drop column)
    needs: prod-deploy
    runs-on: ubuntu-latest
    environment: production-contract
    # Gate: approve only after backfill is complete and verify_contract_ready.py exits 0.
    # The sqlCheck precondition (READ_MODE = new) must pass or Liquibase halts.

    steps:
      - uses: actions/checkout@v4
      - name: Run Contract changeset on prod RDS (placeholder)
        run: echo "Would run liquibase update against prod RDS (Contract changeset drops orders.billing_email)"
