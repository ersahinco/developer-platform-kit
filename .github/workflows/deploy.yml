name: Deploy

on:
  pull_request:
    paths:
      - "app/**"
      - "db/**"
      - "tests/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "db/**"
      - "tests/**"
      - "scripts/**"

# ---------------------------------------------------------------------------
# Pipeline overview
#
# Triggers on changes to app/**, db/**, tests/**, scripts/**
# (infra changes are handled by infra.yml — separate pipeline)
#
# On pull_request: validate-and-test only — fast feedback before merge
# On push to main: full pipeline — test → build → migrate → deploy
#
# validate-and-test — hermetic: Postgres + pgbouncer service containers, full test suite
# build-and-push    — builds app + worker + liquibase images, trivy CRITICAL scan, pushes to ECR
# dev-migrate       — Liquibase update on dev RDS (one-off ECS task, waits for exit code)
# dev-deploy        — rolling ECS update to new image tag
# prod-migrate      — Liquibase update on prod RDS (manual approval)
# prod-deploy       — rolling ECS update + backfill worker (manual approval)
#
# Environments (configure in GitHub → Settings → Environments):
#   dev                  — no approval required
#   production-migrate   — requires approval
#   production-deploy    — requires approval
#
# Required GitHub secrets (set per environment or at repo level):
#   AWS_ROLE_ARN              — IAM role ARN for OIDC federation (no long-lived keys)
#   ECR_REGISTRY              — registry hostname: 691627364817.dkr.ecr.eu-central-1.amazonaws.com
#   ECS_CLUSTER               — ECS cluster name (from terraform output ecs_cluster_name)
#   APP_SERVICE_NAME          — ECS service name (from terraform output app_service_name)
#   APP_TASK_FAMILY           — ECS task definition family for the app
#   LIQUIBASE_TASK_DEF_ARN    — Liquibase task definition ARN (from terraform output liquibase_task_definition_arn)
#   PRIVATE_SUBNET_ID         — One private subnet ID for run-task (migrate + worker tasks)
#   APP_SG_ID                 — App security group ID for run-task
#   DB_SECRET_ARN             — Secrets Manager ARN for DB credentials
#   WORKER_TASK_DEF_ARN       — Worker task definition ARN (from terraform output worker_task_definition_arn)
# ---------------------------------------------------------------------------

env:
  AWS_REGION:                 eu-central-1
  APP_IMAGE_NAME_DEV:         db-migration-example-dev/app
  APP_IMAGE_NAME_PROD:        db-migration-example-prod/app
  WORKER_IMAGE_NAME_DEV:      db-migration-example-dev/worker
  WORKER_IMAGE_NAME_PROD:     db-migration-example-prod/worker
  LIQUIBASE_IMAGE_NAME_DEV:   db-migration-example-dev/liquibase
  LIQUIBASE_IMAGE_NAME_PROD:  db-migration-example-prod/liquibase

jobs:
  # ── 1. Test ──────────────────────────────────────────────────────────────
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: migration_example
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      # PgBouncer service container — app connects here, not to Postgres directly.
      # transaction mode mirrors the production ECS sidecar configuration.
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: migration_example
          DB_USER: postgres
          DB_PASSWORD: postgres
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 20
          MAX_CLIENT_CONN: 200
          AUTH_TYPE: trust
        ports:
          - 6432:5432

    env:
      # App and tests connect via pgbouncer — same topology as production.
      DATABASE_URL: postgresql://postgres:postgres@localhost:6432/migration_example
      BASE_URL:     http://localhost:8000
      SEED_NUM_CUSTOMERS: 200
      SEED_NUM_ORDERS:    1000

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.16"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Init DB schema (bootstrap SQL)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d migration_example \
            -f db/sql/bootstrap.sql

      - name: Run Liquibase migrations
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/db:/liquibase/db" \
            liquibase/liquibase:4.27 \
              --changelog-file=changelog/db.changelog-master.yaml \
              --search-path=/liquibase/db \
              --url=jdbc:postgresql://localhost:5432/migration_example \
              --username=postgres \
              --password=postgres \
              update

      - name: Seed data
        run: uv run python scripts/seed_data.py

      - name: Start app
        run: |
          uv run --directory app uvicorn src.adapters.api.main:app \
            --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-delay 1 --retry-connrefused -sf \
            http://localhost:8000/health

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Stop app
        if: always()
        run: pkill -f "uvicorn" || true

  # ── 2. Build & Push ───────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    needs: validate-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build app image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: docker build -t $REGISTRY/${{ env.APP_IMAGE_NAME_DEV }}:$TAG app/

      - name: Build worker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: docker build -t $REGISTRY/${{ env.WORKER_IMAGE_NAME_DEV }}:$TAG worker/

      # Liquibase image: FROM liquibase/liquibase:4.27 with db/changelog/ baked in.
      # Built from db/Dockerfile — changelogs are versioned with the same SHA as
      # the app so migrate and deploy always use matching code and schema.
      - name: Build liquibase image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: docker build -t $REGISTRY/${{ env.LIQUIBASE_IMAGE_NAME_DEV }}:$TAG db/

      # Scan before push — a CRITICAL CVE fails the pipeline before the image lands in ECR.
      - name: Scan app image for vulnerabilities
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --no-progress \
            $REGISTRY/${{ env.APP_IMAGE_NAME_DEV }}:$TAG

      - name: Scan worker image for vulnerabilities
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --no-progress \
            $REGISTRY/${{ env.WORKER_IMAGE_NAME_DEV }}:$TAG

      - name: Scan liquibase image for vulnerabilities
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --no-progress \
            $REGISTRY/${{ env.LIQUIBASE_IMAGE_NAME_DEV }}:$TAG

      - name: Push app image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: |
          docker push $REGISTRY/${{ env.APP_IMAGE_NAME_DEV }}:$TAG
          docker tag  $REGISTRY/${{ env.APP_IMAGE_NAME_DEV }}:$TAG \
                      $REGISTRY/${{ env.APP_IMAGE_NAME_PROD }}:$TAG
          docker push $REGISTRY/${{ env.APP_IMAGE_NAME_PROD }}:$TAG

      - name: Push worker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: |
          docker push $REGISTRY/${{ env.WORKER_IMAGE_NAME_DEV }}:$TAG
          docker tag  $REGISTRY/${{ env.WORKER_IMAGE_NAME_DEV }}:$TAG \
                      $REGISTRY/${{ env.WORKER_IMAGE_NAME_PROD }}:$TAG
          docker push $REGISTRY/${{ env.WORKER_IMAGE_NAME_PROD }}:$TAG

      - name: Push liquibase image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      sha-${{ github.sha }}
        run: |
          docker push $REGISTRY/${{ env.LIQUIBASE_IMAGE_NAME_DEV }}:$TAG
          docker tag  $REGISTRY/${{ env.LIQUIBASE_IMAGE_NAME_DEV }}:$TAG \
                      $REGISTRY/${{ env.LIQUIBASE_IMAGE_NAME_PROD }}:$TAG
          docker push $REGISTRY/${{ env.LIQUIBASE_IMAGE_NAME_PROD }}:$TAG

  # ── 3. Dev migrate ────────────────────────────────────────────────────────
  dev-migrate:
    name: Dev — Migrate (Liquibase)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      # Liquibase runs as a one-off ECS task inside the VPC — no public DB exposure.
      # The liquibase image has changelogs baked in (see db/Dockerfile), so no
      # command override is needed. Connects directly to RDS — DDL requires a
      # session connection, not pgbouncer's transaction-mode pool.
      - name: Run Liquibase on dev RDS
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --task-definition "${{ secrets.LIQUIBASE_TASK_DEF_ARN }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ secrets.PRIVATE_SUBNET_ID }}],
              securityGroups=[${{ secrets.APP_SG_ID }}],
              assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster "${{ secrets.ECS_CLUSTER }}" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$EXIT_CODE" = "0" ] || { echo "Liquibase failed (exit $EXIT_CODE)"; exit 1; }

  # ── 4. Dev deploy ─────────────────────────────────────────────────────────
  dev-deploy:
    name: Dev — Deploy App
    needs: dev-migrate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ secrets.APP_TASK_FAMILY }}
          container-name:         app
          image: >-
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_IMAGE_NAME_DEV }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:  ${{ steps.render-task-def.outputs.task-definition }}
          service:          ${{ secrets.APP_SERVICE_NAME }}
          cluster:          ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ── 5. Prod migrate ───────────────────────────────────────────────────────
  prod-migrate:
    name: Prod — Migrate (Liquibase)
    needs: dev-deploy
    runs-on: ubuntu-latest
    environment: production-migrate
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Run Liquibase on prod RDS
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --task-definition "${{ secrets.LIQUIBASE_TASK_DEF_ARN }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ secrets.PRIVATE_SUBNET_ID }}],
              securityGroups=[${{ secrets.APP_SG_ID }}],
              assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster "${{ secrets.ECS_CLUSTER }}" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$EXIT_CODE" = "0" ] || { echo "Liquibase failed (exit $EXIT_CODE)"; exit 1; }

  # ── 6. Prod deploy ────────────────────────────────────────────────────────
  prod-deploy:
    name: Prod — Deploy App
    needs: prod-migrate
    runs-on: ubuntu-latest
    environment: production-deploy
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ secrets.APP_TASK_FAMILY }}
          container-name:         app
          image: >-
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_IMAGE_NAME_PROD }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:  ${{ steps.render-task-def.outputs.task-definition }}
          service:          ${{ secrets.APP_SERVICE_NAME }}
          cluster:          ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      # Run the backfill worker as a one-off Fargate task. The worker is idempotent
      # (ON CONFLICT DO NOTHING) and exits immediately when there are no rows left,
      # so it is safe to run on every deploy. We wait for it to finish and check
      # the exit code so a backfill failure surfaces as a pipeline failure rather
      # than silent data loss.
      - name: Run backfill worker
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --task-definition "${{ secrets.WORKER_TASK_DEF_ARN }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ secrets.PRIVATE_SUBNET_ID }}],
              securityGroups=[${{ secrets.APP_SG_ID }}],
              assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Backfill task: $TASK_ARN"
          echo "Monitor: CloudWatch Logs /ecs/db-migration-example-prod/worker"

          aws ecs wait tasks-stopped --cluster "${{ secrets.ECS_CLUSTER }}" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$EXIT_CODE" = "0" ] || { echo "Backfill worker failed (exit $EXIT_CODE)"; exit 1; }
