name: Main Readiness

on:
  workflow_run:
    workflows:
      - App Build
      - Infra Plan
    types:
      - completed

concurrency:
  group: main-readiness-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Readiness Context
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      branch: ${{ steps.resolve.outputs.branch }}
      plan_run_id: ${{ steps.resolve.outputs.plan_run_id }}

    steps:
      - name: Resolve matching App Build and Infra Plan runs
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const branch = context.payload.workflow_run.head_branch;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch,
              status: "completed",
              per_page: 100,
            });
            const matchingRuns = data.workflow_runs.filter(
              (run) => run.head_sha === headSha,
            );
            const appBuild = matchingRuns.find(
              (run) => run.name === "App Build" && run.conclusion === "success",
            );
            const infraPlan = matchingRuns.find(
              (run) => run.name === "Infra Plan" && run.conclusion === "success",
            );

            core.setOutput("head_sha", headSha);
            core.setOutput("branch", branch);

            if (!appBuild || !infraPlan) {
              core.setOutput("ready", "false");
              core.summary
                .addHeading("Main readiness deferred", 3)
                .addRaw(`- Head SHA: ${headSha}\n`)
                .addRaw(`- App Build success found: ${appBuild ? "yes" : "no"}\n`)
                .addRaw(`- Infra Plan success found: ${infraPlan ? "yes" : "no"}\n`);
              await core.summary.write();
              return;
            }

            core.setOutput("ready", "true");
            core.setOutput("plan_run_id", String(infraPlan.id));
            core.summary
              .addHeading("Main readiness starting", 3)
              .addRaw(`- Head SHA: ${headSha}\n`)
              .addRaw(`- App Build run: ${appBuild.id}\n`)
              .addRaw(`- Infra Plan run: ${infraPlan.id}\n`);
            await core.summary.write();

  app_deploy:
    name: App Deploy Dry Run
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/app-deploy.yml
    secrets: inherit
    with:
      image_tag: sha-${{ needs.resolve.outputs.head_sha }}
      confirm_deploy: dry-run
      dry_run: true

  data_support_deploy:
    name: Data Support Deploy Dry Run
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/data-support-deploy.yml
    secrets: inherit
    with:
      image_tag: sha-${{ needs.resolve.outputs.head_sha }}
      target_workload: all
      confirm_data_support_deploy: dry-run
      dry_run: true

  data_schema_apply:
    name: Data Schema Apply Dry Run
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/data-schema-apply.yml
    secrets: inherit
    with:
      image_tag: sha-${{ needs.resolve.outputs.head_sha }}
      schema_phase: expand
      confirm_schema_apply: dry-run
      dry_run: true

  data_runtime_switch:
    name: Data Runtime Switch Dry Run
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/data-runtime-switch.yml
    secrets: inherit
    with:
      switch_step: auto-detect
      confirm_switch: dry-run
      dry_run: true

  data_backfill:
    name: Data Backfill Dry Run
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/data-backfill.yml
    secrets: inherit
    with:
      image_tag: sha-${{ needs.resolve.outputs.head_sha }}
      confirm_backfill: dry-run
      dry_run: true

  infra_apply:
    name: Infra Apply Dry Run
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/infra-apply.yml
    secrets: inherit
    with:
      plan_run_id: ${{ needs.resolve.outputs.plan_run_id }}
      confirm_apply: dry-run
      dry_run: true

  app_rollback_drill:
    name: App Rollback Drill Dry Run
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/app-rollback-drill.yml
    secrets: inherit
    with:
      image_tag: sha-${{ needs.resolve.outputs.head_sha }}
      fault_mode: error
      confirm_drill: dry-run
      dry_run: true

  data_runtime_rollback_drill:
    name: Data Runtime Rollback Drill Dry Run
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/data-runtime-rollback-drill.yml
    secrets: inherit
    with:
      confirm_drill: dry-run
      dry_run: true

  summarize:
    name: Summarize Readiness Result
    needs:
      - resolve
      - app_deploy
      - data_support_deploy
      - data_schema_apply
      - data_runtime_switch
      - data_backfill
      - infra_apply
      - app_rollback_drill
      - data_runtime_rollback_drill
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarize readiness result
        run: |
          {
            echo "### Main readiness complete"
            echo ""
            echo "- App, data, infra, and rollback manual workflows all passed in dry-run mode"
            echo "- Head SHA: ${{ needs.resolve.outputs.head_sha }}"
            echo "- Reviewed Infra Plan run: ${{ needs.resolve.outputs.plan_run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
