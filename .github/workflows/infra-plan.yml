name: Infra Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/app-build.yml"
      - ".github/workflows/app-deploy.yml"
      - ".github/workflows/data-backfill.yml"
      - ".github/workflows/data-runtime-switch.yml"
      - ".github/workflows/data-schema-apply.yml"
      - ".github/workflows/data-support-deploy.yml"
      - ".github/workflows/infra-apply.yml"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/operational-snapshot.yml"
      - "infra/**"
      - "platform/concerns/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-build.yml"
      - ".github/workflows/app-deploy.yml"
      - ".github/workflows/data-backfill.yml"
      - ".github/workflows/data-runtime-switch.yml"
      - ".github/workflows/data-schema-apply.yml"
      - ".github/workflows/data-support-deploy.yml"
      - ".github/workflows/infra-apply.yml"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/operational-snapshot.yml"
      - "infra/**"
      - "platform/concerns/**"

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VERSION: 1.15.0
  TFLINT_VERSION: v0.62.0
  TF_PLATFORM_STATE_KEY: ${{ vars.TF_PLATFORM_STATE_KEY || format('{0}/platform.tfstate', vars.STACK_NAME || github.event.repository.name) }}
  TF_APP_STATE_KEY: ${{ vars.TF_APP_STATE_KEY || format('{0}/app.tfstate', vars.STACK_NAME || github.event.repository.name) }}
  TF_VARS_FILE: stack.tfvars

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: terraform validate platform
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/platform

      - name: terraform validate app
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/app

      - name: terraform validate hybrid roots
        run: |
          for root in data compute dns; do
            terraform -chdir="infra/hybrid-reference/${root}" init -backend=false
            terraform -chdir="infra/hybrid-reference/${root}" validate
          done

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint platform
        run: |
          tflint --init
          tflint --format compact
        working-directory: infra/platform

      - name: tflint app
        run: |
          tflint --init
          tflint --format compact
        working-directory: infra/app

      - name: tflint hybrid roots
        run: |
          for root in data compute dns; do
            (cd "infra/hybrid-reference/${root}" && tflint --init && tflint --format compact)
          done

      - name: checkov
        uses: bridgecrewio/checkov-action@5659ddea96102e16d8f221b3d8402453c0b1c150 # v12.3121.0
        with:
          directory: infra
          framework: terraform
          config_file: infra/.checkov.yaml

  opentofu-compatibility:
    name: Terraform / OpenTofu Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.4
          tofu_wrapper: false

      - name: Compare mocked non-production plans
        run: make infra-compatibility

  plan:
    name: Plan
    needs: [lint-and-validate, opentofu-compatibility]
    if: >
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Terraform backend
        id: backend
        run: |
          state_bucket="${TF_STATE_BUCKET}"
          if [[ -z "$state_bucket" ]]; then
            account_id=$(aws sts get-caller-identity --query Account --output text)
            state_bucket="${STACK_NAME}-tfstate-${account_id}"
          fi
          echo "state_bucket=${state_bucket}" >> "$GITHUB_OUTPUT"

      - name: terraform init platform
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.state_bucket }}" \
            -backend-config="key=${{ env.TF_PLATFORM_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -reconfigure
        working-directory: infra/platform

      - name: terraform plan platform
        id: platform-plan
        run: |
          set +e
          terraform plan -var-file="${{ env.TF_VARS_FILE }}" -no-color -out=platform.tfplan 2>&1 \
            | tee platform_plan_output.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exitcode=${status}" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: infra/platform

      - name: terraform init app
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.state_bucket }}" \
            -backend-config="key=${{ env.TF_APP_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -reconfigure
        working-directory: infra/app

      - name: terraform plan app
        id: app-plan
        run: |
          set +e
          terraform plan \
            -var-file="${{ env.TF_VARS_FILE }}" \
            -var="platform_state_bucket=${{ steps.backend.outputs.state_bucket }}" \
            -var="platform_state_key=${{ env.TF_PLATFORM_STATE_KEY }}" \
            -no-color \
            -out=app.tfplan 2>&1 \
            | tee app_plan_output.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exitcode=${status}" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: infra/app

      - name: Publish plan summary
        run: |
          {
            echo "### Terraform platform plan"
            echo ""
            echo "Workflow run: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo '```'
            sed -n '1,350p' infra/platform/platform_plan_output.txt
            echo '```'
            echo ""
            echo "### Terraform app plan"
            echo ""
            echo '```'
            sed -n '1,350p' infra/app/app_plan_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            infra/platform/platform.tfplan
            infra/platform/platform_plan_output.txt
            infra/app/app.tfplan
            infra/app/app_plan_output.txt
          retention-days: 14

      - name: Fail if platform plan failed
        if: steps.platform-plan.outputs.exitcode != '0'
        run: exit 1

      - name: Fail if app plan failed
        if: steps.app-plan.outputs.exitcode != '0'
        run: exit 1
