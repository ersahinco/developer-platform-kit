name: Infra App Task Definition Ownership Migration

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "Type app-task-definition-ownership to remove the legacy app task-definition state address and apply IAM state moves."
        required: true
        type: string

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.15.0
  TF_APP_STATE_KEY: aws-sdlc-containers/app.tfstate
  STACK_NAME: aws-sdlc-containers
  TF_VARS_FILE: stack.tfvars

concurrency:
  group: infra-apply-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate App Task Definition Ownership
    if: >
      inputs.confirm_migration == 'app-task-definition-ownership' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init app
        run: |
          terraform init \
            -backend-config="key=${{ env.TF_APP_STATE_KEY }}" \
            -reconfigure
        working-directory: infra/app

      - name: Verify app service is stable
        run: |
          service_json="$(aws ecs describe-services \
            --cluster "$STACK_NAME" \
            --services app \
            --output json)"
          primary_rollout_state="$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState')"

          if [[ "$primary_rollout_state" != "COMPLETED" ]]; then
            echo "App service primary deployment must be COMPLETED before task-definition ownership migration; got ${primary_rollout_state}." >&2
            exit 1
          fi

      - name: Forget legacy app task definition state
        id: state-rm
        run: |
          state_address='module.ecs.module.service["app"].aws_ecs_task_definition.this[0]'

          if terraform state list | grep -Fxq "$state_address"; then
            terraform state show "$state_address" > /tmp/app-task-definition-state.txt
            if ! grep -Eq '^[[:space:]]*family[[:space:]]*=[[:space:]]*"aws-sdlc-containers"' /tmp/app-task-definition-state.txt; then
              echo "Refusing to remove unexpected task definition state address; expected family aws-sdlc-containers." >&2
              sed -n '1,80p' /tmp/app-task-definition-state.txt >&2
              exit 1
            fi

            terraform state rm "$state_address"
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Legacy app task definition state address already absent."
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: infra/app

      - name: terraform plan app ownership migration
        run: |
          set -o pipefail
          terraform plan \
            -var-file="${{ env.TF_VARS_FILE }}" \
            -out=app-task-definition-ownership.tfplan \
            -no-color \
            | tee app_task_definition_ownership_plan_output.txt
        working-directory: infra/app

      - name: Guard app task definition blast radius
        run: scripts/ci/ci_guard_infra_plan_blast_radius.sh infra/app/app_task_definition_ownership_plan_output.txt

      - name: terraform apply app ownership migration
        run: terraform apply -auto-approve app-task-definition-ownership.tfplan
        working-directory: infra/app

      - name: Migration summary
        run: |
          {
            echo "### App task-definition ownership migration"
            echo ""
            echo "- Legacy task-definition state removed: ${{ steps.state-rm.outputs.removed }}"
            echo "- App task-definition revisions are now app pipeline-owned after bootstrap."
            echo "- App task IAM role state is root Terraform-owned via moved blocks."
          } >> "$GITHUB_STEP_SUMMARY"
