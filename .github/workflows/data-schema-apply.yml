name: Data Schema Apply

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Approved immutable image tag from the App build run, for example sha-<commit>."
        required: true
        type: string
      schema_phase:
        description: "Current schema phase for this reviewed migration."
        required: true
        type: choice
        options:
          - expand
          - contract
      confirm_contract_ready:
        description: "Required only for contract phase. Type contract-ready after confirming READ_MODE=new and WRITE_MODE=new."
        required: false
        type: string
      confirm_schema_apply:
        description: "Type apply-schema to confirm this reviewed schema apply."
        required: true
        type: string
      dry_run:
        description: "Run non-destructive schema readiness checks only."
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
  PRIMARY_EDGE_TOKEN_SECRET: ${{ vars.PRIMARY_EDGE_TOKEN_SECRET || format('{0}/edge-token', vars.STACK_NAME || github.event.repository.name) }}
  IMAGE_TAG: ${{ inputs.image_tag }}

concurrency:
  group: data-schema-apply-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply_schema:
    name: Apply Schema
    if: >
      (inputs.dry_run || inputs.confirm_schema_apply == 'apply-schema') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws
    permissions:
      contents: read
      id-token: write
    outputs:
      task_definition: ${{ steps.register-liquibase.outputs.task_def_arn }}
      read_mode: ${{ steps.current.outputs.read_mode }}
      write_mode: ${{ steps.current.outputs.write_mode }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve root domain
        run: scripts/ci/ci_resolve_root_domain.sh

      - name: Validate image tag
        run: scripts/ci/ci_validate_image_tag.sh "$IMAGE_TAG" "${{ github.event.repository.default_branch }}"

      - name: Summarize dry run
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Data schema dry run"
            echo ""
            echo "- Mode: non-destructive readiness check"
            echo "- Liquibase task definition is rendered but not registered or executed"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS image registry
        id: aws-context
        run: scripts/ci/ci_resolve_aws_context.sh

      - name: Resolve primary edge contract
        id: primary-service
        run: |
          primary_edge_contract=$(python3 -m scripts.platform.workload_metadata primary-edge-contract)
          {
            echo "service=$(jq -r '.repository' <<< "${primary_edge_contract}")"
            echo "workload_name=$(jq -r '.name' <<< "${primary_edge_contract}")"
            echo "hostname_label=$(jq -r '.hostname_label' <<< "${primary_edge_contract}")"
          } >> "$GITHUB_OUTPUT"

      - name: Require stable primary edge service
        run: |
          service_json=$(aws ecs describe-services \
            --cluster "${{ env.STACK_NAME }}" \
            --services "${{ steps.primary-service.outputs.service }}" \
            --output json)
          primary_rollout_state=$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState')
          if [[ "$primary_rollout_state" != "COMPLETED" ]]; then
            echo "Primary edge service must be stable before schema apply; got ${primary_rollout_state}." >&2
            exit 1
          fi

      - name: Capture current runtime modes
        id: current
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          read_mode=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL}/admin/read-mode" | jq -r '.mode')
          write_mode=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL}/admin/write-mode" | jq -r '.mode')

          {
            echo "read_mode=${read_mode}"
            echo "write_mode=${write_mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Guard contract-phase preconditions
        if: inputs.schema_phase == 'contract'
        run: |
          if [[ "${{ inputs.confirm_contract_ready }}" != "contract-ready" ]]; then
            echo "Contract phase requires confirm_contract_ready=contract-ready." >&2
            exit 1
          fi
          if [[ "${{ steps.current.outputs.read_mode }}" != "new" || "${{ steps.current.outputs.write_mode }}" != "new" ]]; then
            echo "Contract phase requires READ_MODE=new and WRITE_MODE=new." >&2
            echo "Current modes: READ_MODE=${{ steps.current.outputs.read_mode }}, WRITE_MODE=${{ steps.current.outputs.write_mode }}" >&2
            exit 1
          fi

      - name: Verify approved Liquibase image exists
        if: ${{ !inputs.dry_run }}
        run: |
          aws ecr describe-images \
            --repository-name "${STACK_NAME}/liquibase" \
            --image-ids "imageTag=${IMAGE_TAG}"

      - name: Resolve network config
        id: net
        run: scripts/ci/ci_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Render liquibase task definition
        run: |
          scripts/ci/ci_render_ecs_task_definition.sh \
            "${STACK_NAME}-liquibase" \
            liquibase \
            "${{ steps.aws-context.outputs.ecr_registry }}/${STACK_NAME}/liquibase:${IMAGE_TAG}" \
            /tmp/liquibase-task-definition.json

      - name: Register liquibase task definition
        if: ${{ !inputs.dry_run }}
        id: register-liquibase
        run: |
          task_def_arn=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/liquibase-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          if [[ -z "$task_def_arn" || "$task_def_arn" == "None" ]]; then
            echo "Failed to register Liquibase task definition." >&2
            exit 1
          fi
          echo "task_def_arn=${task_def_arn}" >> "$GITHUB_OUTPUT"

      - name: Run Liquibase
        if: ${{ !inputs.dry_run }}
        env:
          ECS_RUN_TASK_WAIT_FOR_STOPPED: "true"
          ECS_RUN_TASK_ASSERT_SUCCESS: "true"
          ECS_RUN_TASK_LABEL: "Liquibase"
        run: |
          TASK_ARN=$(scripts/ci/ci_run_ecs_task.sh \
            "${STACK_NAME}" \
            "${{ steps.register-liquibase.outputs.task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          echo "Liquibase task: $TASK_ARN"
          {
            echo "### Data schema apply"
            echo ""
            echo "- Schema phase: ${{ inputs.schema_phase }}"
            echo "- Current READ_MODE: ${{ steps.current.outputs.read_mode }}"
            echo "- Current WRITE_MODE: ${{ steps.current.outputs.write_mode }}"
            echo "- Liquibase task definition: ${{ steps.register-liquibase.outputs.task_def_arn }}"
            echo "- Liquibase task: ${TASK_ARN}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize dry-run schema readiness
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo ""
            echo "- Schema phase: ${{ inputs.schema_phase }}"
            echo "- Current READ_MODE: ${{ steps.current.outputs.read_mode }}"
            echo "- Current WRITE_MODE: ${{ steps.current.outputs.write_mode }}"
            echo "- Liquibase task definition rendered to: /tmp/liquibase-task-definition.json"
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Evidence
    needs:
      - apply_schema
    if: >
      always() &&
      !inputs.dry_run &&
      inputs.confirm_schema_apply == 'apply-schema' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write data schema apply evidence
        env:
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL || vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          python3 -m scripts.observability.release_event \
            --event-type data_schema_apply \
            --status "${{ needs.apply_schema.result }}" \
            --summary "Data schema apply completed for phase ${{ inputs.schema_phase }} with status ${{ needs.apply_schema.result }}" \
            --service-name liquibase \
            --workload-id liquibase \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --task-definition "${{ needs.apply_schema.outputs.task_definition }}" \
            --read-mode "${{ needs.apply_schema.outputs.read_mode }}" \
            --write-mode "${{ needs.apply_schema.outputs.write_mode }}" \
            --rollback-category schema_phase \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/data-schema-apply
          cat /tmp/release-evidence/data-schema-apply/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data schema apply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-data-schema-apply-${{ github.run_id }}
          path: /tmp/release-evidence/data-schema-apply
          retention-days: 30
