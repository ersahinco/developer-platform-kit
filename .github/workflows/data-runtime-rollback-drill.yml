name: Data Runtime Rollback Drill

on:
  workflow_dispatch:
    inputs:
      confirm_drill:
        description: "Type data-rollback-drill to confirm this runtime-config drill."
        required: true
        type: string

env:
  AWS_REGION: eu-central-1
  STACK_NAME: aws-sdlc-containers
  ROOT_DOMAIN: ersahinco-sandbox.eu
  DATA_RUNTIME_ROLLBACK_SLO_SECONDS: "120"
  DATA_RUNTIME_VERIFY_SLO_SECONDS: "120"

concurrency:
  group: data-runtime-rollback-drill-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: Data Runtime Rollback Drill
    if: >
      inputs.confirm_drill == 'data-rollback-drill' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --frozen

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Require stable app service
        run: |
          service_json=$(aws ecs describe-services \
            --cluster "${{ env.STACK_NAME }}" \
            --services app \
            --output json)
          primary_rollout_state=$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState')
          if [[ "$primary_rollout_state" != "COMPLETED" ]]; then
            echo "App service must be stable before runtime-config rollback drill; got ${primary_rollout_state}." >&2
            exit 1
          fi

      - name: Capture current runtime modes
        id: current
        env:
          BASE_URL: https://api.${{ env.ROOT_DOMAIN }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id aws-sdlc-containers/api-token \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          read_mode=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL}/admin/read-mode" | jq -r '.mode')
          write_mode=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL}/admin/write-mode" | jq -r '.mode')

          if [[ "$read_mode" != "legacy" || "$write_mode" != "legacy" ]]; then
            echo "This controlled drill expects READ_MODE=legacy and WRITE_MODE=legacy before flipping WRITE_MODE to dual." >&2
            echo "Current modes: READ_MODE=${read_mode}, WRITE_MODE=${write_mode}" >&2
            exit 1
          fi

          {
            echo "read_mode=${read_mode}"
            echo "write_mode=${write_mode}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Runtime config rollback drill"
            echo ""
            echo "- Captured READ_MODE: ${read_mode}"
            echo "- Captured WRITE_MODE: ${write_mode}"
            echo "- Forward drill mode: dual"
            echo "- Rollback target mode: ${write_mode}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Move write mode forward to dual
        env:
          BASE_URL: https://api.${{ env.ROOT_DOMAIN }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id aws-sdlc-containers/api-token \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          curl --fail --show-error --silent \
            -X POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"mode":"dual"}' \
            "${BASE_URL}/admin/write-mode" >/dev/null

          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            observed=$(curl --fail --show-error --silent \
              --header "Authorization: Bearer ${TOKEN}" \
              "${BASE_URL}/admin/write-mode" | jq -r '.mode')
            echo "Observed WRITE_MODE=${observed}"
            if [[ "$observed" == "dual" ]]; then
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for WRITE_MODE=dual." >&2
          exit 1

      - name: Roll back to captured write mode
        id: rollback
        env:
          BASE_URL: https://api.${{ env.ROOT_DOMAIN }}
          PREVIOUS_WRITE_MODE: ${{ steps.current.outputs.write_mode }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id aws-sdlc-containers/api-token \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          rollback_started_epoch=$(date +%s)
          curl --fail --show-error --silent \
            -X POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"mode\":\"${PREVIOUS_WRITE_MODE}\"}" \
            "${BASE_URL}/admin/write-mode" >/dev/null

          deadline=$((SECONDS + DATA_RUNTIME_ROLLBACK_SLO_SECONDS))
          while (( SECONDS < deadline )); do
            observed=$(curl --fail --show-error --silent \
              --header "Authorization: Bearer ${TOKEN}" \
              "${BASE_URL}/admin/write-mode" | jq -r '.mode')
            echo "Observed WRITE_MODE=${observed}"
            if [[ "$observed" == "$PREVIOUS_WRITE_MODE" ]]; then
              rollback_seconds=$(($(date +%s) - rollback_started_epoch))
              echo "rollback_seconds=${rollback_seconds}" >> "$GITHUB_OUTPUT"
              {
                echo ""
                echo "### Runtime config rollback SLO evidence"
                echo ""
                echo "- Rollback observed in: ${rollback_seconds}s"
                echo "- Rollback SLO: ${DATA_RUNTIME_ROLLBACK_SLO_SECONDS}s"
                echo "- Restored WRITE_MODE: ${PREVIOUS_WRITE_MODE}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "Runtime config rollback exceeded SLO: WRITE_MODE did not return to ${PREVIOUS_WRITE_MODE} within ${DATA_RUNTIME_ROLLBACK_SLO_SECONDS}s." >&2
          exit 1

      - name: Restore captured write mode if needed
        if: ${{ always() && steps.current.outputs.write_mode != '' }}
        env:
          BASE_URL: https://api.${{ env.ROOT_DOMAIN }}
          PREVIOUS_WRITE_MODE: ${{ steps.current.outputs.write_mode }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id aws-sdlc-containers/api-token \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          curl --fail --show-error --silent \
            -X POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"mode\":\"${PREVIOUS_WRITE_MODE}\"}" \
            "${BASE_URL}/admin/write-mode" >/dev/null

      - name: Verify restored runtime modes
        id: verify-restored
        env:
          BASE_URL: https://api.${{ env.ROOT_DOMAIN }}
          ECS_CLUSTER: ${{ env.STACK_NAME }}
          ECS_SERVICE: app
          EXPECTED_TASK_FAMILY: aws-sdlc-containers
          EXPECTED_READ_MODE: ${{ steps.current.outputs.read_mode }}
          EXPECTED_WRITE_MODE: ${{ steps.current.outputs.write_mode }}
        run: |
          verify_started_epoch=$(date +%s)
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id aws-sdlc-containers/api-token \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)
          TOKEN="$TOKEN" uv run python scripts/release/verify_post_deploy.py
          verify_seconds=$(($(date +%s) - verify_started_epoch))
          echo "verify_seconds=${verify_seconds}" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### Runtime config verification SLO evidence"
            echo ""
            echo "- Verification completed in: ${verify_seconds}s"
            echo "- Verification SLO: ${DATA_RUNTIME_VERIFY_SLO_SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( verify_seconds > DATA_RUNTIME_VERIFY_SLO_SECONDS )); then
            echo "Restored runtime verification exceeded SLO: ${verify_seconds}s > ${DATA_RUNTIME_VERIFY_SLO_SECONDS}s." >&2
            exit 1
          fi

      - name: Write data runtime rollback evidence
        if: ${{ always() }}
        env:
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          python3 scripts/observability/release_event.py \
            --event-type data_runtime_rollback_drill \
            --status "${{ job.status }}" \
            --summary "Data runtime rollback drill completed with status ${{ job.status }}" \
            --service-name app \
            --read-mode "${{ steps.current.outputs.read_mode }}" \
            --write-mode "${{ steps.current.outputs.write_mode }}" \
            --rollback-seconds "${{ steps.rollback.outputs.rollback_seconds }}" \
            --rollback-slo-seconds "${{ env.DATA_RUNTIME_ROLLBACK_SLO_SECONDS }}" \
            --verify-seconds "${{ steps.verify-restored.outputs.verify_seconds }}" \
            --verify-slo-seconds "${{ env.DATA_RUNTIME_VERIFY_SLO_SECONDS }}" \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/data-runtime-rollback-drill
          cat /tmp/release-evidence/data-runtime-rollback-drill/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data runtime rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-data-runtime-rollback-drill-${{ github.run_id }}
          path: /tmp/release-evidence/data-runtime-rollback-drill
          retention-days: 30
