name: Data Runtime Switch

on:
  workflow_dispatch:
    inputs:
      switch_step:
        description: "Reviewed runtime mode transition to apply."
        required: true
        default: write-legacy-to-dual
        type: choice
        options:
          - write-legacy-to-dual
          - read-legacy-to-new
          - write-dual-to-new
      confirm_switch:
        description: "Type switch-runtime to confirm this reviewed runtime transition."
        required: true
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
  PRIMARY_EDGE_TOKEN_SECRET: ${{ vars.PRIMARY_EDGE_TOKEN_SECRET || format('{0}/edge-token', vars.STACK_NAME || github.event.repository.name) }}
  DATA_RUNTIME_SWITCH_VERIFY_SLO_SECONDS: "120"

concurrency:
  group: data-runtime-switch-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  switch_runtime:
    name: Switch Runtime Modes
    if: >
      inputs.confirm_switch == 'switch-runtime' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws
    permissions:
      contents: read
      id-token: write
    outputs:
      read_mode: ${{ steps.verify.outputs.read_mode }}
      write_mode: ${{ steps.verify.outputs.write_mode }}
      verify_seconds: ${{ steps.verify.outputs.verify_seconds }}
      target_label: ${{ steps.plan.outputs.target_label }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --frozen --group scripts

      - name: Resolve root domain
        run: scripts/ci/ci_resolve_root_domain.sh

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve primary edge contract
        id: primary-service
        run: |
          primary_edge_contract=$(python3 -m scripts.platform.workload_metadata primary-edge-contract)
          {
            echo "service=$(jq -r '.repository' <<< "${primary_edge_contract}")"
            echo "workload_name=$(jq -r '.name' <<< "${primary_edge_contract}")"
            echo "hostname_label=$(jq -r '.hostname_label' <<< "${primary_edge_contract}")"
          } >> "$GITHUB_OUTPUT"

      - name: Require stable primary edge service
        run: |
          service_json=$(aws ecs describe-services \
            --cluster "${{ env.STACK_NAME }}" \
            --services "${{ steps.primary-service.outputs.service }}" \
            --output json)
          primary_rollout_state=$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState')
          if [[ "$primary_rollout_state" != "COMPLETED" ]]; then
            echo "Primary edge service must be stable before runtime switch; got ${primary_rollout_state}." >&2
            exit 1
          fi

      - name: Resolve reviewed transition
        id: plan
        run: |
          case "${{ inputs.switch_step }}" in
            write-legacy-to-dual)
              echo "target_endpoint=write" >> "$GITHUB_OUTPUT"
              echo "target_mode=dual" >> "$GITHUB_OUTPUT"
              echo "expected_read_mode=legacy" >> "$GITHUB_OUTPUT"
              echo "expected_write_mode=legacy" >> "$GITHUB_OUTPUT"
              echo "final_read_mode=legacy" >> "$GITHUB_OUTPUT"
              echo "final_write_mode=dual" >> "$GITHUB_OUTPUT"
              echo "target_label=dual-write" >> "$GITHUB_OUTPUT"
              ;;
            read-legacy-to-new)
              echo "target_endpoint=read" >> "$GITHUB_OUTPUT"
              echo "target_mode=new" >> "$GITHUB_OUTPUT"
              echo "expected_read_mode=legacy" >> "$GITHUB_OUTPUT"
              echo "expected_write_mode=dual" >> "$GITHUB_OUTPUT"
              echo "final_read_mode=new" >> "$GITHUB_OUTPUT"
              echo "final_write_mode=dual" >> "$GITHUB_OUTPUT"
              echo "target_label=read-switch" >> "$GITHUB_OUTPUT"
              ;;
            write-dual-to-new)
              echo "target_endpoint=write" >> "$GITHUB_OUTPUT"
              echo "target_mode=new" >> "$GITHUB_OUTPUT"
              echo "expected_read_mode=new" >> "$GITHUB_OUTPUT"
              echo "expected_write_mode=dual" >> "$GITHUB_OUTPUT"
              echo "final_read_mode=new" >> "$GITHUB_OUTPUT"
              echo "final_write_mode=new" >> "$GITHUB_OUTPUT"
              echo "target_label=write-cutover" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported switch step: ${{ inputs.switch_step }}" >&2
              exit 1
              ;;
          esac

      - name: Capture current runtime modes
        id: current
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          read_mode=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL}/admin/read-mode" | jq -r '.mode')
          write_mode=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL}/admin/write-mode" | jq -r '.mode')

          {
            echo "read_mode=${read_mode}"
            echo "write_mode=${write_mode}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${read_mode}" != "${{ steps.plan.outputs.expected_read_mode }}" || "${write_mode}" != "${{ steps.plan.outputs.expected_write_mode }}" ]]; then
            echo "Runtime switch precondition failed for ${{ inputs.switch_step }}." >&2
            echo "Expected READ_MODE=${{ steps.plan.outputs.expected_read_mode }}, WRITE_MODE=${{ steps.plan.outputs.expected_write_mode }}." >&2
            echo "Current READ_MODE=${read_mode}, WRITE_MODE=${write_mode}." >&2
            exit 1
          fi

      - name: Apply runtime switch
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
          TARGET_ENDPOINT: ${{ steps.plan.outputs.target_endpoint }}
          TARGET_MODE: ${{ steps.plan.outputs.target_mode }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          curl --fail --show-error --silent \
            -X POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"mode\":\"${TARGET_MODE}\"}" \
            "${BASE_URL}/admin/${TARGET_ENDPOINT}-mode" >/dev/null

      - name: Verify switched runtime modes
        id: verify
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
          ECS_CLUSTER: ${{ env.STACK_NAME }}
          ECS_SERVICE: ${{ steps.primary-service.outputs.service }}
          EXPECTED_TASK_FAMILY: ${{ env.STACK_NAME }}
          EXPECTED_READ_MODE: ${{ steps.plan.outputs.final_read_mode }}
          EXPECTED_WRITE_MODE: ${{ steps.plan.outputs.final_write_mode }}
          WORKLOAD_CONTAINER_NAME: ${{ steps.primary-service.outputs.service }}
        run: |
          verify_started_epoch=$(date +%s)
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)
          TOKEN="$TOKEN" uv run python -m scripts.release.verify_post_deploy
          verify_seconds=$(($(date +%s) - verify_started_epoch))
          if (( verify_seconds > DATA_RUNTIME_SWITCH_VERIFY_SLO_SECONDS )); then
            echo "Runtime switch verification exceeded SLO: ${verify_seconds}s > ${DATA_RUNTIME_SWITCH_VERIFY_SLO_SECONDS}s." >&2
            exit 1
          fi
          {
            echo "read_mode=${{ steps.plan.outputs.final_read_mode }}"
            echo "write_mode=${{ steps.plan.outputs.final_write_mode }}"
            echo "verify_seconds=${verify_seconds}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Data runtime switch"
            echo ""
            echo "- Switch step: ${{ inputs.switch_step }}"
            echo "- Previous READ_MODE: ${{ steps.current.outputs.read_mode }}"
            echo "- Previous WRITE_MODE: ${{ steps.current.outputs.write_mode }}"
            echo "- Final READ_MODE: ${{ steps.plan.outputs.final_read_mode }}"
            echo "- Final WRITE_MODE: ${{ steps.plan.outputs.final_write_mode }}"
            echo "- Verification SLO: ${DATA_RUNTIME_SWITCH_VERIFY_SLO_SECONDS}s"
            echo "- Verification time: ${verify_seconds}s"
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Evidence
    needs:
      - switch_runtime
    if: >
      always() &&
      inputs.confirm_switch == 'switch-runtime' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write data runtime switch evidence
        env:
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL || vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          python3 -m scripts.observability.release_event \
            --event-type data_runtime_switch \
            --status "${{ needs.switch_runtime.result }}" \
            --summary "Data runtime switch completed for ${{ inputs.switch_step }} with status ${{ needs.switch_runtime.result }}" \
            --service-name runtime-config \
            --workload-id "${{ needs.switch_runtime.outputs.target_label }}" \
            --read-mode "${{ needs.switch_runtime.outputs.read_mode }}" \
            --write-mode "${{ needs.switch_runtime.outputs.write_mode }}" \
            --rollback-category runtime_data_phase \
            --verify-seconds "${{ needs.switch_runtime.outputs.verify_seconds }}" \
            --verify-slo-seconds "${{ env.DATA_RUNTIME_SWITCH_VERIFY_SLO_SECONDS }}" \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/data-runtime-switch
          cat /tmp/release-evidence/data-runtime-switch/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data runtime switch evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-data-runtime-switch-${{ github.run_id }}
          path: /tmp/release-evidence/data-runtime-switch
          retention-days: 30
