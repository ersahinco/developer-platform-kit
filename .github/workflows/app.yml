name: App

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "app/**"
      - "db/**"
      - "tests/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "db/**"
      - "tests/**"
      - "scripts/**"

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 691627364817.dkr.ecr.eu-central-1.amazonaws.com
  STACK_NAME: aws-sdlc-containers

# PRs validate the reference workload locally.
# Pushes to main roll the same stack forward in place: migrate the current DB,
# deploy the existing service, then run one-off support tasks.
jobs:
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aws_sdlc_containers
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aws_sdlc_containers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      pgbouncer:
        image: edoburu/pgbouncer:v1.25.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: aws_sdlc_containers
          DB_USER: postgres
          DB_PASSWORD: postgres
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 20
          MAX_CLIENT_CONN: 200
          AUTH_TYPE: scram-sha-256
        ports:
          - 6432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:6432/aws_sdlc_containers
      BASE_URL: http://localhost:8000
      SEED_NUM_CUSTOMERS: 200
      SEED_NUM_ORDERS: 1000

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.16"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Init DB schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d aws_sdlc_containers \
            -f db/sql/bootstrap.sql

      - name: Run Liquibase migrations
        run: |
          docker pull liquibase/liquibase:4.33.0
          docker run --rm --network host \
            -v "${{ github.workspace }}/db:/liquibase/db" \
            liquibase/liquibase:4.33.0 \
              --changelog-file=changelog/db.changelog-master.yaml \
              --search-path=/liquibase/db \
              --url=jdbc:postgresql://localhost:5432/aws_sdlc_containers \
              --username=postgres \
              --password=postgres \
              update

      - name: Seed data
        run: uv run python scripts/seed_data.py

      - name: Start app
        run: |
          PYTHONPATH="${{ github.workspace }}/app/src" uv run --directory app uvicorn adapters.api.main:app \
            --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-delay 1 --retry-connrefused -sf \
            http://localhost:8000/health

      - name: Advance to dual-write phase
        run: uv run python scripts/set_runtime_config.py write-mode dual

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Stop app
        if: always()
        run: pkill -f "uvicorn" || true

  build-and-push:
    name: Build & Push to ECR
    needs: validate-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build images
        env:
          TAG: sha-${{ github.sha }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:$TAG app/ &
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:$TAG worker/ &
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:$TAG db/ &
          wait

      - name: Mirror pgbouncer to ECR
        env:
          PGBOUNCER_TAG: v1.25.1-p0
        run: |
          if aws ecr describe-images \
            --repository-name ${{ env.STACK_NAME }}/pgbouncer \
            --image-ids imageTag=$PGBOUNCER_TAG 2>/dev/null; then
            echo "pgbouncer:$PGBOUNCER_TAG already in ECR — skipping"
          else
            docker pull edoburu/pgbouncer:$PGBOUNCER_TAG
            docker tag  edoburu/pgbouncer:$PGBOUNCER_TAG \
                        ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer:$PGBOUNCER_TAG
            docker push ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer:$PGBOUNCER_TAG
          fi

      - name: Scan images
        run: |
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy:0.69.3 image \
              --exit-code 1 --severity CRITICAL --no-progress "$1"
          }
          scan ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:sha-${{ github.sha }} &
          scan ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:sha-${{ github.sha }} &
          scan ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:sha-${{ github.sha }} &
          wait

      - name: Push images
        env:
          TAG: sha-${{ github.sha }}
        run: |
          for repo in app worker liquibase; do
            docker push ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/${repo}:$TAG &
          done
          wait

  migrate:
    name: Migrate
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve network config
        id: net
        run: scripts/gha_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Render liquibase task definition
        id: render-liquibase
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: aws-sdlc-containers-liquibase
          container-name: liquibase
          image: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:${{ needs.build-and-push.outputs.image_tag }}

      - name: Register liquibase task definition
        id: register-liquibase
        run: scripts/gha_register_task_definition.sh "${{ steps.render-liquibase.outputs.task-definition }}"

      - name: Run Liquibase
        # Schema changes are applied to the current database before the app deploy.
        run: |
          TASK_ARN=$(scripts/gha_run_ecs_task.sh \
            aws-sdlc-containers \
            "${{ steps.register-liquibase.outputs.task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          scripts/gha_wait_for_task_stopped.sh aws-sdlc-containers "$TASK_ARN"
          scripts/gha_assert_task_succeeded.sh aws-sdlc-containers "$TASK_ARN" Liquibase

  deploy:
    name: Deploy
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve network config
        id: net
        run: scripts/gha_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Render app task definition
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: aws-sdlc-containers
          container-name: app
          image: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:${{ needs.build-and-push.outputs.image_tag }}

      - name: Deploy app service
        run: scripts/gha_deploy_ecs_service.sh aws-sdlc-containers app "${{ steps.render-app.outputs.task-definition }}"

      - name: Render worker task definition
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: aws-sdlc-containers-worker
          container-name: worker
          image: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:${{ needs.build-and-push.outputs.image_tag }}

      - name: Register worker task definition
        id: register-worker
        run: scripts/gha_register_task_definition.sh "${{ steps.render-worker.outputs.task-definition }}"

      - name: Run backfill worker
        # The backfill stays a separate one-off task; it is not folded into the app service.
        run: |
          TASK_ARN=$(scripts/gha_run_ecs_task.sh \
            aws-sdlc-containers \
            "${{ steps.register-worker.outputs.task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          echo "Backfill task: $TASK_ARN"
          echo "Monitor: CloudWatch Logs /ecs/aws-sdlc-containers/worker"
          scripts/gha_poll_task_until_stopped.sh aws-sdlc-containers "$TASK_ARN" Worker
          scripts/gha_assert_task_succeeded.sh aws-sdlc-containers "$TASK_ARN" "Backfill worker"
