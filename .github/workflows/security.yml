name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --group test

      - name: Run secret scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact --no-banner

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: README.md 'docs/**/*.md'

      - name: Lint GitHub workflows
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Lint Dockerfiles
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            hadolint/hadolint:v2.14.0-debian@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2 \
            hadolint \
            db/Dockerfile db/pgbouncer/Dockerfile observability/firelens/Dockerfile apps/api/Dockerfile apps/backfill_worker/Dockerfile apps/data_export_job/Dockerfile apps/order_event_consumer/Dockerfile

      - name: Run Python dependency audit
        run: |
          tmpfile="$(mktemp)"
          trap 'rm -f "$tmpfile"' EXIT
          uv --quiet export \
            --format requirements.txt \
            --all-packages \
            --all-groups \
            --no-emit-project \
            --no-emit-workspace \
            --frozen \
            --output-file "$tmpfile"
          uv run pip-audit \
            -r "$tmpfile" \
            --disable-pip \
            --require-hashes \
            --progress-spinner off \
            --desc off \
            --aliases off
