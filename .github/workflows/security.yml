name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.8"
          enable-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --group scripts --group test

      - name: Run secret scan
        run: make secret-scan

      - name: Check Markdown links
        run: make lint-docs

      - name: Run policy checks
        run: make lint-policy

      - name: Lint GitHub workflows
        run: make lint-workflows

      - name: Lint Dockerfiles
        run: make lint-dockerfiles

      - name: Run Python dependency audit
        run: make dependency-audit
