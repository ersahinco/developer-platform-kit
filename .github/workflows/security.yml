name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.16"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --group test

      - name: Run secret scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest dir /repo --redact --no-banner

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: README.md 'docs/**/*.md' 'ops/**/*.md'

      - name: Lint GitHub workflows
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            rhysd/actionlint:latest

      - name: Lint Dockerfiles
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            hadolint/hadolint:latest-debian \
            db/Dockerfile apps/api/Dockerfile apps/backfill-worker/Dockerfile apps/data-export-job/Dockerfile

      - name: Run Python dependency audit
        run: |
          tmpfile="$(mktemp)"
          trap 'rm -f "$tmpfile"' EXIT
          uv --quiet export \
            --format requirements.txt \
            --all-packages \
            --all-groups \
            --no-emit-project \
            --no-emit-workspace \
            --frozen \
            --output-file "$tmpfile"
          uv run pip-audit \
            -r "$tmpfile" \
            --disable-pip \
            --require-hashes \
            --progress-spinner off \
            --desc off \
            --aliases off
