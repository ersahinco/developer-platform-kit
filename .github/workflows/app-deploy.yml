name: App Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Approved immutable image tag from the App build run, for example sha-<commit>."
        required: true
        type: string
      confirm_deploy:
        description: "Type deploy to confirm migration, deployment, verification, and worker run."
        required: true
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
  API_TOKEN_SECRET: ${{ vars.API_TOKEN_SECRET || format('{0}/api-token', vars.STACK_NAME || github.event.repository.name) }}
  PGBOUNCER_TAG: ${{ vars.PGBOUNCER_TAG || 'v1.25.1-p0' }}
  IMAGE_TAG: ${{ inputs.image_tag }}

concurrency:
  group: app-deploy-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate
    if: >
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate image tag
        run: |
          if [[ -z "${ROOT_DOMAIN}" ]]; then
            echo "Set ROOT_DOMAIN as a GitHub repository or environment variable before deploying." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "image_tag must be sha- followed by a 40-character lowercase commit SHA." >&2
            exit 1
          fi
          image_sha="${IMAGE_TAG#sha-}"
          if ! git merge-base --is-ancestor "$image_sha" "origin/${{ github.event.repository.default_branch }}"; then
            echo "image_tag must reference a commit reachable from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS image registry
        id: aws-context
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "ecr_registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Verify approved images exist
        run: |
          for repo in app worker data-export-job order-event-consumer liquibase; do
            aws ecr describe-images \
              --repository-name "${STACK_NAME}/${repo}" \
              --image-ids "imageTag=${IMAGE_TAG}"
          done
          aws ecr describe-images \
            --repository-name "${STACK_NAME}/pgbouncer" \
            --image-ids "imageTag=${{ env.PGBOUNCER_TAG }}"

      - name: Resolve network config
        id: net
        run: scripts/ci/ci_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Render liquibase task definition
        run: |
          scripts/ci/ci_render_ecs_task_definition.sh \
            "${STACK_NAME}-liquibase" \
            liquibase \
            "${{ steps.aws-context.outputs.ecr_registry }}/${STACK_NAME}/liquibase:${IMAGE_TAG}" \
            /tmp/liquibase-task-definition.json
          python3 scripts/ci/ci_prepare_liquibase_task_definition.py \
            /tmp/liquibase-task-definition.json

      - name: Register liquibase task definition
        id: register-liquibase
        run: scripts/ci/ci_register_ecs_task_definition.sh /tmp/liquibase-task-definition.json

      - name: Run Liquibase
        run: |
          TASK_ARN=$(scripts/ci/ci_run_ecs_task.sh \
            "${STACK_NAME}" \
            "${{ steps.register-liquibase.outputs.task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          aws ecs wait tasks-stopped --cluster "${STACK_NAME}" --tasks "$TASK_ARN"
          scripts/ci/ci_assert_ecs_task_succeeded.sh "${STACK_NAME}" "$TASK_ARN" Liquibase

  deploy:
    name: Deploy
    needs: migrate
    if: >
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws
    permissions:
      contents: read
      id-token: write
    outputs:
      task_definition: ${{ steps.deploy-app.outputs.task_def_arn }}
      verify_seconds: ${{ steps.verify-app.outputs.verify_seconds }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --frozen

      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "image_tag must be sha- followed by a 40-character lowercase commit SHA." >&2
            exit 1
          fi
          image_sha="${IMAGE_TAG#sha-}"
          if ! git merge-base --is-ancestor "$image_sha" "origin/${{ github.event.repository.default_branch }}"; then
            echo "image_tag must reference a commit reachable from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS image registry
        id: aws-context
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "ecr_registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Resolve network config
        id: net
        run: scripts/ci/ci_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Render app task definition
        run: |
          scripts/ci/ci_render_ecs_task_definition.sh \
            "${STACK_NAME}" \
            app \
            "${{ steps.aws-context.outputs.ecr_registry }}/${STACK_NAME}/app:${IMAGE_TAG}" \
            /tmp/app-task-definition.json

      - name: Deploy app service
        id: deploy-app
        run: scripts/ci/ci_deploy_ecs_service.sh "${STACK_NAME}" app /tmp/app-task-definition.json

      - name: Verify deployed app
        id: verify-app
        env:
          BASE_URL: https://api.${{ env.ROOT_DOMAIN }}
          ECS_CLUSTER: ${{ env.STACK_NAME }}
          ECS_SERVICE: app
          EXPECTED_TASK_FAMILY: ${{ env.STACK_NAME }}
          EXPECTED_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          verify_started_epoch=$(date +%s)
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${API_TOKEN_SECRET}" \
            --region ${{ env.AWS_REGION }} \
            --query SecretString \
            --output text)
          TOKEN="$TOKEN" uv run python scripts/release/verify_post_deploy.py
          verify_seconds=$(($(date +%s) - verify_started_epoch))
          echo "verify_seconds=${verify_seconds}" >> "$GITHUB_OUTPUT"

      - name: Register support task definitions
        id: support-tasks
        env:
          ECR_REGISTRY: ${{ steps.aws-context.outputs.ecr_registry }}
        run: |
          declare -A task_families=(
            [worker]="${STACK_NAME}-worker"
            [data_export_job]="${STACK_NAME}-data-export-job"
          )
          declare -A containers=(
            [worker]="worker"
            [data_export_job]="data-export-job"
          )
          for key in worker data_export_job; do
            container="${containers[$key]}"
            task_definition="/tmp/${container}-task-definition.json"
            scripts/ci/ci_render_ecs_task_definition.sh \
              "${task_families[$key]}" \
              "$container" \
              "${ECR_REGISTRY}/${STACK_NAME}/${container}:${IMAGE_TAG}" \
              "$task_definition"
            task_def_arn=$(scripts/ci/ci_register_ecs_task_definition.sh "$task_definition")
            echo "${key}_task_def_arn=${task_def_arn}" >> "$GITHUB_OUTPUT"
          done

      - name: Deploy service task definitions
        env:
          ECR_REGISTRY: ${{ steps.aws-context.outputs.ecr_registry }}
        run: |
          services=(order-event-consumer)
          for service in "${services[@]}"; do
            task_definition="/tmp/${service}-task-definition.json"
            scripts/ci/ci_render_ecs_task_definition.sh \
              "${STACK_NAME}-${service}" \
              "$service" \
              "${ECR_REGISTRY}/${STACK_NAME}/${service}:${IMAGE_TAG}" \
              "$task_definition"
            scripts/ci/ci_deploy_ecs_service.sh "${STACK_NAME}" "$service" "$task_definition"
          done

      - name: Run backfill worker
        run: |
          TASK_ARN=$(scripts/ci/ci_run_ecs_task.sh \
            "${STACK_NAME}" \
            "${{ steps.support-tasks.outputs.worker_task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          echo "Backfill task: $TASK_ARN"
          echo "Monitor: CloudWatch Logs /ecs/${STACK_NAME}/worker"
          scripts/ci/ci_poll_ecs_task_until_stopped.sh "${STACK_NAME}" "$TASK_ARN" Worker
          scripts/ci/ci_assert_ecs_task_succeeded.sh "${STACK_NAME}" "$TASK_ARN" "Backfill worker"

  evidence:
    name: Evidence
    needs:
      - migrate
      - deploy
    if: >
      always() &&
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write app deploy evidence
        env:
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL || vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          status="${{ needs.deploy.result }}"
          if [[ "${{ needs.migrate.result }}" != "success" ]]; then
            status="${{ needs.migrate.result }}"
          fi
          summary="App deploy workflow completed with migrate=${{ needs.migrate.result }}, deploy=${{ needs.deploy.result }}"
          python3 scripts/observability/release_event.py \
            --event-type app_deploy \
            --status "${status}" \
            --summary "${summary}" \
            --service-name app \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --task-definition "${{ needs.deploy.outputs.task_definition }}" \
            --verify-seconds "${{ needs.deploy.outputs.verify_seconds }}" \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/app-deploy
          cat /tmp/release-evidence/app-deploy/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app deploy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-app-deploy-${{ github.run_id }}
          path: /tmp/release-evidence/app-deploy
          retention-days: 30
