name: App Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Approved immutable image tag from the App build run, for example sha-<commit>."
        required: true
        type: string
      confirm_deploy:
        description: "Type deploy to confirm image rollout and post-deploy verification."
        required: true
        type: string
      dry_run:
        description: "Run non-destructive deploy readiness checks only."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      image_tag:
        description: "Approved immutable image tag from the App build run, for example sha-<commit>."
        required: true
        type: string
      confirm_deploy:
        description: "Type deploy to confirm image rollout and post-deploy verification."
        required: true
        type: string
      dry_run:
        description: "Run non-destructive deploy readiness checks only."
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
  PRIMARY_EDGE_TOKEN_SECRET: ${{ vars.PRIMARY_EDGE_TOKEN_SECRET || format('{0}/edge-token', vars.STACK_NAME || github.event.repository.name) }}
  PGBOUNCER_TAG: ${{ vars.PGBOUNCER_TAG || 'v1.25.1-p0' }}
  IMAGE_TAG: ${{ inputs.image_tag }}

concurrency:
  group: app-deploy-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: >
      (inputs.dry_run || inputs.confirm_deploy == 'deploy') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws
    permissions:
      contents: read
      id-token: write
    outputs:
      primary_service: ${{ steps.primary-service.outputs.service }}
      primary_workload: ${{ steps.primary-service.outputs.workload_name }}
      app_host_workloads: ${{ steps.app-host-workloads.outputs.workloads }}
      task_definition: ${{ steps.deploy-app.outputs.task_def_arn || '' }}
      image_digest: ${{ steps.primary-image.outputs.digest }}
      rollout_seconds: ${{ steps.deploy-app.outputs.rollout_seconds || '' }}
      verify_seconds: ${{ steps.verify-app.outputs.verify_seconds || steps.verify-current.outputs.verify_seconds }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require root domain
        run: test -n "${ROOT_DOMAIN}"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --frozen --group scripts

      - name: Validate image tag
        run: scripts/ci/ci_validate_image_tag.sh "$IMAGE_TAG" "${{ github.event.repository.default_branch }}"

      - name: Summarize dry run
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### App deploy dry run"
            echo ""
            echo "- Mode: non-destructive readiness check"
            echo "- Image tag syntax, branch reachability, and ECR image availability are still validated"
            echo "- AWS state mutation steps are skipped"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS image registry
        id: aws-context
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          {
            echo "account_id=${account_id}"
            echo "ecr_registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve primary edge contract
        id: primary-service
        run: |
          IFS=$'\t' read -r workload_name service hostname_label auth_mode verification_profile < <(
            python3 -m scripts.platform.workload_metadata primary-edge-contract \
              | jq -r '[.name, .repository, .hostname_label, .auth_mode, .verification_profile] | @tsv'
          )
          {
            echo "service=${service}"
            echo "workload_name=${workload_name}"
            echo "hostname_label=${hostname_label}"
            echo "auth_mode=${auth_mode}"
            echo "verification_profile=${verification_profile}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve internal service inventory
        id: internal-services
        run: |
          python3 -m scripts.platform.workload_metadata internal-services > "$RUNNER_TEMP/internal-services.tsv"
          internal_workloads=$(cut -f1 "$RUNNER_TEMP/internal-services.tsv" | paste -sd, -)
          echo "internal_workloads=${internal_workloads}" >> "$GITHUB_OUTPUT"

      - name: Resolve app host evidence set
        id: app-host-workloads
        run: |
          workloads="${{ steps.primary-service.outputs.workload_name }}"
          if [[ -n "${{ steps.internal-services.outputs.internal_workloads }}" ]]; then
            workloads="${workloads},${{ steps.internal-services.outputs.internal_workloads }}"
          fi
          echo "workloads=${workloads}" >> "$GITHUB_OUTPUT"

      - name: Verify approved primary edge image exists
        id: primary-image
        run: |
          digest=$(aws ecr describe-images \
            --repository-name "${STACK_NAME}/${{ steps.primary-service.outputs.service }}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify approved internal service images exist
        run: |
          while IFS=$'\t' read -r _workload_name service; do
            [[ -z "$service" ]] && continue
            aws ecr describe-images \
              --repository-name "${STACK_NAME}/${service}" \
              --image-ids "imageTag=${IMAGE_TAG}"
          done < "$RUNNER_TEMP/internal-services.tsv"

      - name: Verify approved sidecar image exists
        run: |
          aws ecr describe-images \
            --repository-name "${STACK_NAME}/pgbouncer" \
            --image-ids "imageTag=${{ env.PGBOUNCER_TAG }}"

      - name: Render primary edge task definition
        env:
          PRIMARY_EDGE_TASK_ROLE_ARN: "arn:aws:iam::${{ steps.aws-context.outputs.account_id }}:role/${{ env.STACK_NAME }}-primary-edge-task"
        run: |
          python3 scripts/ci/render_ecs_task_definition.py \
            "${STACK_NAME}" \
            "${{ steps.primary-service.outputs.service }}" \
            "${{ steps.aws-context.outputs.ecr_registry }}/${STACK_NAME}/${{ steps.primary-service.outputs.service }}:${IMAGE_TAG}" \
            /tmp/primary-edge-task-definition.json

      - name: Deploy primary edge service
        if: ${{ !inputs.dry_run }}
        id: deploy-app
        run: scripts/ci/ci_deploy_ecs_service.sh "${STACK_NAME}" "${{ steps.primary-service.outputs.service }}" /tmp/primary-edge-task-definition.json 1

      - name: Deploy service task definitions
        if: ${{ !inputs.dry_run }}
        env:
          ECR_REGISTRY: ${{ steps.aws-context.outputs.ecr_registry }}
        run: |
          while IFS=$'\t' read -r _workload_name service; do
            task_definition="/tmp/${service}-task-definition.json"
            python3 scripts/ci/render_ecs_task_definition.py \
              "${STACK_NAME}-${service}" \
              "$service" \
              "${ECR_REGISTRY}/${STACK_NAME}/${service}:${IMAGE_TAG}" \
              "$task_definition"
            scripts/ci/ci_deploy_ecs_service.sh "${STACK_NAME}" "$service" "$task_definition" 1
          done < "$RUNNER_TEMP/internal-services.tsv"

      - name: Verify deployed edge service
        if: ${{ !inputs.dry_run }}
        id: verify-app
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
          ECS_CLUSTER: ${{ env.STACK_NAME }}
          ECS_SERVICE: ${{ steps.primary-service.outputs.service }}
          EXPECTED_TASK_FAMILY: ${{ env.STACK_NAME }}
          EXPECTED_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          WORKLOAD_CONTAINER_NAME: ${{ steps.primary-service.outputs.service }}
        run: |
          verify_started_epoch=$(date +%s)
          if [[ "${{ steps.primary-service.outputs.auth_mode }}" == "static-bearer-token" ]]; then
            TOKEN=$(aws secretsmanager get-secret-value \
              --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
              --region ${{ env.AWS_REGION }} \
              --query SecretString \
              --output text)
            TOKEN="$TOKEN" uv run python -m scripts.release.verify_post_deploy
          else
            uv run python -m scripts.release.verify_post_deploy
          fi
          verify_seconds=$(($(date +%s) - verify_started_epoch))
          echo "verify_seconds=${verify_seconds}" >> "$GITHUB_OUTPUT"

      - name: Verify current deployed edge service
        if: ${{ inputs.dry_run }}
        id: verify-current
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
          ECS_CLUSTER: ${{ env.STACK_NAME }}
          ECS_SERVICE: ${{ steps.primary-service.outputs.service }}
          EXPECTED_TASK_FAMILY: ${{ env.STACK_NAME }}
          WORKLOAD_CONTAINER_NAME: ${{ steps.primary-service.outputs.service }}
        run: |
          verify_started_epoch=$(date +%s)
          if [[ "${{ steps.primary-service.outputs.auth_mode }}" == "static-bearer-token" ]]; then
            TOKEN=$(aws secretsmanager get-secret-value \
              --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
              --region ${{ env.AWS_REGION }} \
              --query SecretString \
              --output text)
            TOKEN="$TOKEN" uv run python -m scripts.release.verify_post_deploy
          else
            uv run python -m scripts.release.verify_post_deploy
          fi
          verify_seconds=$(($(date +%s) - verify_started_epoch))
          echo "verify_seconds=${verify_seconds}" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "- Verified currently deployed primary edge service without applying a new revision"
            echo "- Verification time: ${verify_seconds}s"
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Evidence
    needs:
      - deploy
    if: >
      always() &&
      !inputs.dry_run &&
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write app deploy evidence
        env:
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL || vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          status="${{ needs.deploy.result }}"
          summary="App deploy workflow completed with deploy=${{ needs.deploy.result }}"
          related_workload_args=()
          IFS=',' read -ra related_workload_ids <<< "${{ needs.deploy.outputs.app_host_workloads }}"
          for workload_id in "${related_workload_ids[@]}"; do
            [[ -z "$workload_id" ]] && continue
            related_workload_args+=(--related-workload-id "$workload_id")
          done
          python3 -m scripts.observability.release_event \
            "${related_workload_args[@]}" \
            --event-type app_deploy \
            --status "${status}" \
            --summary "${summary}" \
            --service-name "${{ needs.deploy.outputs.primary_service }}" \
            --workload-id "${{ needs.deploy.outputs.primary_workload }}" \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --image-digest "${{ needs.deploy.outputs.image_digest }}" \
            --task-definition "${{ needs.deploy.outputs.task_definition }}" \
            --rollout-seconds "${{ needs.deploy.outputs.rollout_seconds }}" \
            --rollback-category app_image \
            --capability-realization-id compute.aws-ecs \
            --capability-realization-id dns.aws-route53 \
            --capability-realization-id database.aws-rds-postgresql \
            --capability-realization-id storage.aws-s3 \
            --capability-realization-id eventing.dapr-aws-snssqs \
            --verify-seconds "${{ needs.deploy.outputs.verify_seconds }}" \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/app-deploy
          cat /tmp/release-evidence/app-deploy/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app deploy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-app-deploy-${{ github.run_id }}
          path: /tmp/release-evidence/app-deploy
          retention-days: 30
