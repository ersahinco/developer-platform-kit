name: App Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Approved immutable image tag from the App build run, for example sha-<commit>."
        required: true
        type: string
      confirm_deploy:
        description: "Type deploy to confirm migration, deployment, verification, and backfill run."
        required: true
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
  PRIMARY_EDGE_TOKEN_SECRET: ${{ vars.PRIMARY_EDGE_TOKEN_SECRET || format('{0}/edge-token', vars.STACK_NAME || github.event.repository.name) }}
  PGBOUNCER_TAG: ${{ vars.PGBOUNCER_TAG || 'v1.25.1-p0' }}
  IMAGE_TAG: ${{ inputs.image_tag }}

concurrency:
  group: app-deploy-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate
    if: >
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve root domain
        run: scripts/ci/ci_resolve_root_domain.sh

      - name: Validate image tag
        env:
          CI_REQUIRE_ROOT_DOMAIN: "true"
        run: scripts/ci/ci_validate_image_tag.sh "$IMAGE_TAG" "${{ github.event.repository.default_branch }}"

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS image registry
        id: aws-context
        run: scripts/ci/ci_resolve_aws_context.sh

      - name: Verify approved images exist
        run: |
          for repo in $(python3 -m scripts.platform.workload_metadata repositories); do
            aws ecr describe-images \
              --repository-name "${STACK_NAME}/${repo}" \
              --image-ids "imageTag=${IMAGE_TAG}"
          done
          aws ecr describe-images \
            --repository-name "${STACK_NAME}/pgbouncer" \
            --image-ids "imageTag=${{ env.PGBOUNCER_TAG }}"

      - name: Resolve network config
        id: net
        run: scripts/ci/ci_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Render liquibase task definition
        run: |
          scripts/ci/ci_render_ecs_task_definition.sh \
            "${STACK_NAME}-liquibase" \
            liquibase \
            "${{ steps.aws-context.outputs.ecr_registry }}/${STACK_NAME}/liquibase:${IMAGE_TAG}" \
            /tmp/liquibase-task-definition.json
          tmp_path="$(mktemp)"
          jq '
            .containerDefinitions |= map(
              if .name == "liquibase" then
                .workingDirectory = "/liquibase"
                | .command = [
                    "--search-path=/liquibase",
                    "--changelog-file=changelog/db.changelog-master.yaml",
                    "update"
                  ]
              else
                .
              end
            )
          ' /tmp/liquibase-task-definition.json > "$tmp_path"
          mv "$tmp_path" /tmp/liquibase-task-definition.json

      - name: Register liquibase task definition
        id: register-liquibase
        run: |
          task_def_arn=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/liquibase-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          if [[ -z "$task_def_arn" || "$task_def_arn" == "None" ]]; then
            echo "Failed to register Liquibase task definition." >&2
            exit 1
          fi
          echo "task_def_arn=${task_def_arn}" >> "$GITHUB_OUTPUT"

      - name: Run Liquibase
        env:
          ECS_RUN_TASK_WAIT_FOR_STOPPED: "true"
          ECS_RUN_TASK_ASSERT_SUCCESS: "true"
          ECS_RUN_TASK_LABEL: "Liquibase"
        run: |
          TASK_ARN=$(scripts/ci/ci_run_ecs_task.sh \
            "${STACK_NAME}" \
            "${{ steps.register-liquibase.outputs.task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          echo "Liquibase task: $TASK_ARN"

  deploy:
    name: Deploy
    needs: migrate
    if: >
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws
    permissions:
      contents: read
      id-token: write
    outputs:
      primary_service: ${{ steps.primary-service.outputs.service }}
      task_definition: ${{ steps.deploy-app.outputs.task_def_arn }}
      verify_seconds: ${{ steps.verify-app.outputs.verify_seconds }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve root domain
        run: scripts/ci/ci_resolve_root_domain.sh

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --frozen --group scripts

      - name: Validate image tag
        run: scripts/ci/ci_validate_image_tag.sh "$IMAGE_TAG" "${{ github.event.repository.default_branch }}"

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS image registry
        id: aws-context
        run: scripts/ci/ci_resolve_aws_context.sh

      - name: Resolve network config
        id: net
        run: scripts/ci/ci_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Resolve primary edge contract
        id: primary-service
        run: |
          primary_edge_contract=$(python3 -m scripts.platform.workload_metadata primary-edge-contract)
          {
            echo "service=$(jq -r '.repository' <<< "${primary_edge_contract}")"
            echo "workload_name=$(jq -r '.name' <<< "${primary_edge_contract}")"
            echo "hostname_label=$(jq -r '.hostname_label' <<< "${primary_edge_contract}")"
            echo "auth_mode=$(jq -r '.auth_mode' <<< "${primary_edge_contract}")"
            echo "verification_profile=$(jq -r '.verification_profile' <<< "${primary_edge_contract}")"
          } >> "$GITHUB_OUTPUT"

      - name: Render primary edge task definition
        run: |
          scripts/ci/ci_render_ecs_task_definition.sh \
            "${STACK_NAME}" \
            "${{ steps.primary-service.outputs.service }}" \
            "${{ steps.aws-context.outputs.ecr_registry }}/${STACK_NAME}/${{ steps.primary-service.outputs.service }}:${IMAGE_TAG}" \
            /tmp/primary-edge-task-definition.json

      - name: Deploy primary edge service
        id: deploy-app
        run: scripts/ci/ci_deploy_ecs_service.sh "${STACK_NAME}" "${{ steps.primary-service.outputs.service }}" /tmp/primary-edge-task-definition.json 1

      - name: Verify deployed edge service
        id: verify-app
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
          ECS_CLUSTER: ${{ env.STACK_NAME }}
          ECS_SERVICE: ${{ steps.primary-service.outputs.service }}
          EXPECTED_TASK_FAMILY: ${{ env.STACK_NAME }}
          EXPECTED_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          WORKLOAD_CONTAINER_NAME: ${{ steps.primary-service.outputs.service }}
        run: |
          verify_started_epoch=$(date +%s)
          if [[ "${{ steps.primary-service.outputs.auth_mode }}" == "static-bearer-token" ]]; then
            TOKEN=$(aws secretsmanager get-secret-value \
              --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
              --region ${{ env.AWS_REGION }} \
              --query SecretString \
              --output text)
            TOKEN="$TOKEN" uv run python -m scripts.release.verify_post_deploy
          else
            uv run python -m scripts.release.verify_post_deploy
          fi
          verify_seconds=$(($(date +%s) - verify_started_epoch))
          echo "verify_seconds=${verify_seconds}" >> "$GITHUB_OUTPUT"

      - name: Register support task definitions
        id: support-tasks
        env:
          ECR_REGISTRY: ${{ steps.aws-context.outputs.ecr_registry }}
        run: |
          python3 -m scripts.platform.workload_metadata support-task-workloads | while IFS=$'\t' read -r workload_name container; do
            task_definition="/tmp/${container}-task-definition.json"
            scripts/ci/ci_render_ecs_task_definition.sh \
              "${STACK_NAME}-${container}" \
              "$container" \
              "${ECR_REGISTRY}/${STACK_NAME}/${container}:${IMAGE_TAG}" \
              "$task_definition"
            task_def_arn=$(aws ecs register-task-definition \
              --cli-input-json "file://${task_definition}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)
            if [[ -z "$task_def_arn" || "$task_def_arn" == "None" ]]; then
              echo "Failed to register task definition for ${container}." >&2
              exit 1
            fi
            echo "${workload_name}_task_def_arn=${task_def_arn}" >> "$GITHUB_OUTPUT"
          done

      - name: Deploy service task definitions
        env:
          ECR_REGISTRY: ${{ steps.aws-context.outputs.ecr_registry }}
        run: |
          python3 -m scripts.platform.workload_metadata internal-services | while IFS=$'\t' read -r _workload_name service; do
            task_definition="/tmp/${service}-task-definition.json"
            scripts/ci/ci_render_ecs_task_definition.sh \
              "${STACK_NAME}-${service}" \
              "$service" \
              "${ECR_REGISTRY}/${STACK_NAME}/${service}:${IMAGE_TAG}" \
              "$task_definition"
            scripts/ci/ci_deploy_ecs_service.sh "${STACK_NAME}" "$service" "$task_definition" 1
          done

      - name: Run backfill worker
        env:
          ECS_RUN_TASK_WAIT_FOR_STOPPED: "true"
          ECS_RUN_TASK_ASSERT_SUCCESS: "true"
          ECS_RUN_TASK_LABEL: "Backfill worker"
        run: |
          TASK_ARN=$(scripts/ci/ci_run_ecs_task.sh \
            "${STACK_NAME}" \
            "${{ steps.support-tasks.outputs.backfill_worker_task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          echo "Backfill task: $TASK_ARN"
          echo "Monitor: CloudWatch Logs /ecs/${STACK_NAME}/backfill-worker"

  evidence:
    name: Evidence
    needs:
      - migrate
      - deploy
    if: >
      always() &&
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write app deploy evidence
        env:
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL || vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          status="${{ needs.deploy.result }}"
          if [[ "${{ needs.migrate.result }}" != "success" ]]; then
            status="${{ needs.migrate.result }}"
          fi
          summary="App deploy workflow completed with migrate=${{ needs.migrate.result }}, deploy=${{ needs.deploy.result }}"
          python3 -m scripts.observability.release_event \
            --event-type app_deploy \
            --status "${status}" \
            --summary "${summary}" \
            --service-name "${{ needs.deploy.outputs.primary_service }}" \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --task-definition "${{ needs.deploy.outputs.task_definition }}" \
            --verify-seconds "${{ needs.deploy.outputs.verify_seconds }}" \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/app-deploy
          cat /tmp/release-evidence/app-deploy/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app deploy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-app-deploy-${{ github.run_id }}
          path: /tmp/release-evidence/app-deploy
          retention-days: 30
