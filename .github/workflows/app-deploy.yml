name: App Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Approved immutable image tag from the App build run, for example sha-<commit>."
        required: true
        type: string
      confirm_deploy:
        description: "Type deploy to confirm migration, deployment, verification, and worker run."
        required: true
        type: string

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 691627364817.dkr.ecr.eu-central-1.amazonaws.com
  STACK_NAME: aws-sdlc-containers
  ROOT_DOMAIN: ersahinco-sandbox.eu
  PGBOUNCER_TAG: v1.25.1-p0
  IMAGE_TAG: ${{ inputs.image_tag }}

concurrency:
  group: app-deploy-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate
    if: >
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "image_tag must be sha- followed by a 40-character lowercase commit SHA." >&2
            exit 1
          fi
          image_sha="${IMAGE_TAG#sha-}"
          if ! git merge-base --is-ancestor "$image_sha" "origin/${{ github.event.repository.default_branch }}"; then
            echo "image_tag must reference a commit reachable from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify approved images exist
        run: |
          for repo in app worker data-export-job order-event-consumer liquibase firelens; do
            aws ecr describe-images \
              --repository-name "${{ env.STACK_NAME }}/${repo}" \
              --image-ids "imageTag=${IMAGE_TAG}"
          done
          aws ecr describe-images \
            --repository-name "${{ env.STACK_NAME }}/pgbouncer" \
            --image-ids "imageTag=${{ env.PGBOUNCER_TAG }}"

      - name: Resolve network config
        id: net
        run: scripts/ci/ci_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Render liquibase task definition
        id: render-liquibase
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1.8.4
        with:
          task-definition-family: aws-sdlc-containers-liquibase
          container-name: liquibase
          image: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:${{ env.IMAGE_TAG }}

      - name: Normalize liquibase command
        run: |
          python3 scripts/ci/ci_prepare_liquibase_task_definition.py \
            "${{ steps.render-liquibase.outputs.task-definition }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens:${{ env.IMAGE_TAG }}"

      - name: Register liquibase task definition
        id: register-liquibase
        run: scripts/ci/ci_register_ecs_task_definition.sh "${{ steps.render-liquibase.outputs.task-definition }}"

      - name: Run Liquibase
        run: |
          TASK_ARN=$(scripts/ci/ci_run_ecs_task.sh \
            aws-sdlc-containers \
            "${{ steps.register-liquibase.outputs.task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          aws ecs wait tasks-stopped --cluster aws-sdlc-containers --tasks "$TASK_ARN"
          scripts/ci/ci_assert_ecs_task_succeeded.sh aws-sdlc-containers "$TASK_ARN" Liquibase

  deploy:
    name: Deploy
    needs: migrate
    if: >
      inputs.confirm_deploy == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --frozen

      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "image_tag must be sha- followed by a 40-character lowercase commit SHA." >&2
            exit 1
          fi
          image_sha="${IMAGE_TAG#sha-}"
          if ! git merge-base --is-ancestor "$image_sha" "origin/${{ github.event.repository.default_branch }}"; then
            echo "image_tag must reference a commit reachable from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve network config
        id: net
        run: scripts/ci/ci_resolve_ecs_network.sh "${{ env.STACK_NAME }}"

      - name: Render app task definition
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1.8.4
        with:
          task-definition-family: aws-sdlc-containers
          container-name: app
          image: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:${{ env.IMAGE_TAG }}

      - name: Render app FireLens image
        run: |
          python3 scripts/ci/ci_set_task_container_image.py \
            "${{ steps.render-app.outputs.task-definition }}" \
            log-router \
            "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens:${IMAGE_TAG}"

      - name: Deploy app service
        id: deploy-app
        run: scripts/ci/ci_deploy_ecs_service.sh aws-sdlc-containers app "${{ steps.render-app.outputs.task-definition }}"

      - name: Verify deployed app
        id: verify-app
        env:
          BASE_URL: https://api.${{ env.ROOT_DOMAIN }}
          ECS_CLUSTER: aws-sdlc-containers
          ECS_SERVICE: app
          EXPECTED_TASK_FAMILY: aws-sdlc-containers
          EXPECTED_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          verify_started_epoch=$(date +%s)
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id aws-sdlc-containers/api-token \
            --region ${{ env.AWS_REGION }} \
            --query SecretString \
            --output text)
          TOKEN="$TOKEN" uv run python scripts/release/verify_post_deploy.py
          verify_seconds=$(($(date +%s) - verify_started_epoch))
          echo "verify_seconds=${verify_seconds}" >> "$GITHUB_OUTPUT"

      - name: Render worker task definition
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1.8.4
        with:
          task-definition-family: aws-sdlc-containers-worker
          container-name: worker
          image: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:${{ env.IMAGE_TAG }}

      - name: Register worker task definition
        id: register-worker
        run: |
          python3 scripts/ci/ci_set_task_container_image.py \
            "${{ steps.render-worker.outputs.task-definition }}" \
            log-router \
            "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens:${IMAGE_TAG}"
          scripts/ci/ci_register_ecs_task_definition.sh "${{ steps.render-worker.outputs.task-definition }}"

      - name: Render data export task definition
        id: render-data-export
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1.8.4
        with:
          task-definition-family: aws-sdlc-containers-data-export-job
          container-name: data-export-job
          image: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/data-export-job:${{ env.IMAGE_TAG }}

      - name: Register data export task definition
        run: |
          python3 scripts/ci/ci_set_task_container_image.py \
            "${{ steps.render-data-export.outputs.task-definition }}" \
            log-router \
            "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens:${IMAGE_TAG}"
          scripts/ci/ci_register_ecs_task_definition.sh "${{ steps.render-data-export.outputs.task-definition }}"

      - name: Render order event consumer task definition
        id: render-order-event-consumer
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1.8.4
        with:
          task-definition-family: aws-sdlc-containers-order-event-consumer
          container-name: order-event-consumer
          image: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/order-event-consumer:${{ env.IMAGE_TAG }}

      - name: Deploy order event consumer service
        run: |
          python3 scripts/ci/ci_set_task_container_image.py \
            "${{ steps.render-order-event-consumer.outputs.task-definition }}" \
            log-router \
            "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens:${IMAGE_TAG}"
          scripts/ci/ci_deploy_ecs_service.sh aws-sdlc-containers order-event-consumer "${{ steps.render-order-event-consumer.outputs.task-definition }}"

      - name: Run backfill worker
        run: |
          TASK_ARN=$(scripts/ci/ci_run_ecs_task.sh \
            aws-sdlc-containers \
            "${{ steps.register-worker.outputs.task_def_arn }}" \
            "${{ steps.net.outputs.subnet_id }}" \
            "${{ steps.net.outputs.sg_id }}")
          echo "Backfill task: $TASK_ARN"
          echo "Monitor: CloudWatch Logs /ecs/aws-sdlc-containers/worker"
          scripts/ci/ci_poll_ecs_task_until_stopped.sh aws-sdlc-containers "$TASK_ARN" Worker
          scripts/ci/ci_assert_ecs_task_succeeded.sh aws-sdlc-containers "$TASK_ARN" "Backfill worker"

      - name: Write app deploy evidence
        if: ${{ always() }}
        run: |
          python3 scripts/observability/release_event.py \
            --event-type app_deploy \
            --status "${{ job.status }}" \
            --summary "App deploy workflow completed with status ${{ job.status }}" \
            --service-name app \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --task-definition "${{ steps.deploy-app.outputs.task_def_arn }}" \
            --verify-seconds "${{ steps.verify-app.outputs.verify_seconds }}" \
            --output-dir /tmp/release-evidence/app-deploy
          cat /tmp/release-evidence/app-deploy/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app deploy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-app-deploy-${{ github.run_id }}
          path: /tmp/release-evidence/app-deploy
          retention-days: 30
