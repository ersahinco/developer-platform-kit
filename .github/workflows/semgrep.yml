name: Semgrep CE

on:
  pull_request:
    paths:
      - ".github/workflows/semgrep.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/semgrep.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  scan:
    name: Semgrep CE Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.160.0

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep Community Edition
        run: semgrep scan --config auto apps/ packages/ scripts/
