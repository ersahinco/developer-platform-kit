name: Data Backfill

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Approved immutable image tag from the App build run, for example sha-<commit>."
        required: true
        type: string
      confirm_backfill:
        description: "Type run-backfill to confirm this reviewed backfill run."
        required: true
        type: string
      dry_run:
        description: "Run non-destructive backfill readiness checks only."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      image_tag:
        description: "Approved immutable image tag from the App build run, for example sha-<commit>."
        required: true
        type: string
      confirm_backfill:
        description: "Type run-backfill to confirm this reviewed backfill run."
        required: true
        type: string
      dry_run:
        description: "Run non-destructive backfill readiness checks only."
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
  PRIMARY_EDGE_TOKEN_SECRET: ${{ vars.PRIMARY_EDGE_TOKEN_SECRET || format('{0}/edge-token', vars.STACK_NAME || github.event.repository.name) }}
  IMAGE_TAG: ${{ inputs.image_tag }}

concurrency:
  group: data-backfill-aws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run_backfill:
    name: Run Backfill
    if: >
      (inputs.dry_run || inputs.confirm_backfill == 'run-backfill') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws
    permissions:
      contents: read
      id-token: write
    outputs:
      task_definition: ${{ steps.register-backfill.outputs.task_def_arn }}
      task_arn: ${{ steps.run-backfill.outputs.task_arn }}
      read_mode: ${{ steps.current.outputs.read_mode }}
      write_mode: ${{ steps.current.outputs.write_mode }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require root domain
        run: test -n "${ROOT_DOMAIN}"

      - name: Validate image tag
        run: scripts/ci/ci_validate_image_tag.sh "$IMAGE_TAG" "${{ github.event.repository.default_branch }}"

      - name: Summarize dry run
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Data backfill dry run"
            echo ""
            echo "- Mode: non-destructive readiness check"
            echo "- Backfill image availability and task definition rendering are checked"
            echo "- Backfill task definition is not registered or executed"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS image registry
        id: aws-context
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          {
            echo "account_id=${account_id}"
            echo "ecr_registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve primary edge contract
        id: primary-service
        run: |
          IFS=$'\t' read -r workload_name service hostname_label read_mode_endpoint write_mode_endpoint < <(
            python3 -m scripts.platform.workload_metadata primary-edge-contract \
              | jq -r '[.name, .repository, .hostname_label, .runtime_mode_endpoints.read, .runtime_mode_endpoints.write] | @tsv'
          )
          {
            echo "service=${service}"
            echo "workload_name=${workload_name}"
            echo "hostname_label=${hostname_label}"
            echo "read_mode_endpoint=${read_mode_endpoint}"
            echo "write_mode_endpoint=${write_mode_endpoint}"
          } >> "$GITHUB_OUTPUT"

      - name: Require stable primary edge service
        run: |
          service_json=$(aws ecs describe-services \
            --cluster "${{ env.STACK_NAME }}" \
            --services "${{ steps.primary-service.outputs.service }}" \
            --output json)
          primary_rollout_state=$(echo "$service_json" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState')
          if [[ "$primary_rollout_state" != "COMPLETED" ]]; then
            echo "Primary edge service must be stable before backfill; got ${primary_rollout_state}." >&2
            exit 1
          fi

      - name: Capture current runtime modes
        id: current
        env:
          BASE_URL: https://${{ steps.primary-service.outputs.hostname_label }}.${{ env.ROOT_DOMAIN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${PRIMARY_EDGE_TOKEN_SECRET}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          read_mode=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL}${{ steps.primary-service.outputs.read_mode_endpoint }}" | jq -r '.mode')
          write_mode=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL}${{ steps.primary-service.outputs.write_mode_endpoint }}" | jq -r '.mode')

          eligible=true
          if [[ "$read_mode" != "legacy" || "$write_mode" != "dual" ]]; then
            eligible=false
          fi

          if [[ "$eligible" != "true" && "$DRY_RUN" != "true" ]]; then
            echo "Backfill expects READ_MODE=legacy and WRITE_MODE=dual so the dual-write phase is active before the switch." >&2
            echo "Current modes: READ_MODE=${read_mode}, WRITE_MODE=${write_mode}" >&2
            exit 1
          fi

          {
            echo "read_mode=${read_mode}"
            echo "write_mode=${write_mode}"
            echo "eligible=${eligible}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify approved backfill image exists
        run: |
          aws ecr describe-images \
            --repository-name "${STACK_NAME}/backfill-worker" \
            --image-ids "imageTag=${IMAGE_TAG}"

      - name: Resolve ECS task context
        id: ecs-context
        run: |
          python3 scripts/ci/resolve_ecs_task_context.py \
            --stack-name "${STACK_NAME}" \
            --repository backfill-worker \
            --verify-log-group >> "$GITHUB_OUTPUT"

      - name: Render backfill task definition
        run: |
          python3 scripts/ci/render_ecs_task_definition.py \
            "${STACK_NAME}-backfill-worker" \
            backfill-worker \
            "${{ steps.aws-context.outputs.ecr_registry }}/${STACK_NAME}/backfill-worker:${IMAGE_TAG}" \
            /tmp/backfill-worker-task-definition.json

      - name: Register backfill task definition
        if: ${{ !inputs.dry_run }}
        id: register-backfill
        run: |
          task_def_arn=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/backfill-worker-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          if [[ -z "$task_def_arn" || "$task_def_arn" == "None" ]]; then
            echo "Failed to register backfill task definition." >&2
            exit 1
          fi
          echo "task_def_arn=${task_def_arn}" >> "$GITHUB_OUTPUT"

      - name: Build backfill context
        if: ${{ !inputs.dry_run }}
        id: backfill-context
        run: |
          echo "started_at_ms=$(($(date +%s) * 1000))" >> "$GITHUB_OUTPUT"

      - name: Run backfill worker
        if: ${{ !inputs.dry_run }}
        id: run-backfill
        env:
          ECS_RUN_TASK_WAIT_FOR_STOPPED: "true"
          ECS_RUN_TASK_ASSERT_SUCCESS: "true"
          ECS_RUN_TASK_LABEL: "Backfill worker"
        run: |
          TASK_ARN=$(scripts/ci/ci_run_ecs_task.sh \
            "${STACK_NAME}" \
            "${{ steps.register-backfill.outputs.task_def_arn }}" \
            "${{ steps.ecs-context.outputs.subnet_id }}" \
            "${{ steps.ecs-context.outputs.sg_id }}")
          echo "Backfill task: ${TASK_ARN}"
          echo "task_arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"
          {
            echo "### Data backfill"
            echo ""
            echo "- Required READ_MODE: legacy"
            echo "- Required WRITE_MODE: dual"
            echo "- Backfill task definition: ${{ steps.register-backfill.outputs.task_def_arn }}"
            echo "- Backfill task: ${TASK_ARN}"
            echo "- Monitor: CloudWatch Logs ${{ steps.ecs-context.outputs.log_group }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture backfill terminal event
        if: ${{ !inputs.dry_run }}
        run: |
          aws logs filter-log-events \
            --log-group-name "${{ steps.ecs-context.outputs.log_group }}" \
            --start-time "${{ steps.backfill-context.outputs.started_at_ms }}" \
            --output json > /tmp/backfill-events.json
          mkdir -p /tmp/operator-evidence/data-backfill
          python3 scripts/ci/extract_operator_event.py \
            /tmp/backfill-events.json \
            --event-name backfill_complete \
            --event-name backfill_paused \
            --evidence-path /tmp/operator-evidence/data-backfill/operator-event.json \
            --workload-id backfill_worker \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --task-definition "${{ steps.register-backfill.outputs.task_def_arn }}" \
            --task-arn "${{ steps.run-backfill.outputs.task_arn }}" \
            > /tmp/operator-evidence/data-backfill/operator-event.tmp.json
          mv /tmp/operator-evidence/data-backfill/operator-event.tmp.json \
            /tmp/operator-evidence/data-backfill/operator-event.json
          cat /tmp/operator-evidence/data-backfill/operator-event.json
          python3 scripts/ci/extract_operator_event.py \
            /tmp/backfill-events.json \
            --event-name backfill_complete \
            --event-name backfill_paused \
            --evidence-path /tmp/operator-evidence/data-backfill/operator-event.json \
            --workload-id backfill_worker \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --task-definition "${{ steps.register-backfill.outputs.task_def_arn }}" \
            --task-arn "${{ steps.run-backfill.outputs.task_arn }}" \
            --summary backfill \
            | tee /tmp/operator-evidence/data-backfill/operator-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data backfill payload
        if: ${{ !inputs.dry_run && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operator-payload-data-backfill-${{ github.run_id }}
          path: /tmp/operator-evidence/data-backfill
          retention-days: 30

      - name: Summarize dry-run backfill readiness
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo ""
            echo "- Current READ_MODE: ${{ steps.current.outputs.read_mode }}"
            echo "- Current WRITE_MODE: ${{ steps.current.outputs.write_mode }}"
            echo "- Backfill-eligible now: ${{ steps.current.outputs.eligible }}"
            echo "- Backfill task definition rendered to: /tmp/backfill-worker-task-definition.json"
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Evidence
    needs:
      - run_backfill
    if: >
      always() &&
      !inputs.dry_run &&
      inputs.confirm_backfill == 'run-backfill' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aws
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write data backfill evidence
        env:
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL || vars.LOKI_PUSH_URL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
        run: |
          python3 -m scripts.observability.release_event \
            --event-type data_backfill \
            --status "${{ needs.run_backfill.result }}" \
            --summary "Data backfill completed with status ${{ needs.run_backfill.result }}" \
            --service-name backfill-worker \
            --workload-id backfill_worker \
            --image-tag "${{ env.IMAGE_TAG }}" \
            --task-definition "${{ needs.run_backfill.outputs.task_definition }}" \
            --deployment-id "${{ needs.run_backfill.outputs.task_arn }}" \
            --read-mode "${{ needs.run_backfill.outputs.read_mode }}" \
            --write-mode "${{ needs.run_backfill.outputs.write_mode }}" \
            --rollback-category runtime_data_phase \
            --include-alarms \
            --push-loki \
            --loki-push-best-effort \
            --output-dir /tmp/release-evidence/data-backfill
          cat /tmp/release-evidence/data-backfill/release-event.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data backfill evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-data-backfill-${{ github.run_id }}
          path: /tmp/release-evidence/data-backfill
          retention-days: 30
