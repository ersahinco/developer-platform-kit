name: App Build

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Type build to confirm build, scan, and push images for later deployment approval."
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/app-build.yml"
      - "apps/api/**"
      - "apps/backfill-worker/**"
      - "apps/data-export-job/**"
      - "packages/**"
      - "pyproject.toml"
      - "db/**"
      - "tests/**"
      - "scripts/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-build.yml"
      - "apps/api/**"
      - "apps/backfill-worker/**"
      - "apps/data-export-job/**"
      - "packages/**"
      - "pyproject.toml"
      - "db/**"
      - "tests/**"
      - "scripts/**"
      - "uv.lock"

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 691627364817.dkr.ecr.eu-central-1.amazonaws.com
  STACK_NAME: aws-sdlc-containers
  ROOT_DOMAIN: ersahinco-sandbox.eu

# PRs and pushes validate the reference workload locally. Manual runs build,
# scan, and push immutable images only; deployment is a separate approval step.
jobs:
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aws_sdlc_containers
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aws_sdlc_containers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      pgbouncer:
        image: edoburu/pgbouncer:v1.25.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: aws_sdlc_containers
          DB_USER: postgres
          DB_PASSWORD: postgres
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 20
          MAX_CLIENT_CONN: 200
          AUTH_TYPE: scram-sha-256
        ports:
          - 6432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:6432/aws_sdlc_containers
      BASE_URL: http://localhost:8000
      SEED_NUM_CUSTOMERS: 200
      SEED_NUM_ORDERS: 1000

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.16"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --group test

      - name: Run Python static checks
        run: |
          uv run ruff format --check apps/ packages/ tests/ scripts/
          uv run ruff check apps/ packages/ tests/ scripts/
          uv run pyright

      - name: Check shell script syntax
        run: bash -n scripts/*.sh

      - name: Init DB schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d aws_sdlc_containers \
            -f db/sql/bootstrap.sql

      - name: Run Liquibase migrations
        run: |
          docker pull liquibase/liquibase:4.33.0
          docker run --rm --network host \
            -v "${{ github.workspace }}/db:/liquibase/db" \
            liquibase/liquibase:4.33.0 \
              --changelog-file=changelog/db.changelog-master.yaml \
              --search-path=/liquibase/db \
              --url=jdbc:postgresql://localhost:5432/aws_sdlc_containers \
              --username=postgres \
              --password=postgres \
              update

      - name: Seed data
        run: uv run python scripts/seed_data.py

      - name: Start app
        run: |
          PYTHONPATH="${{ github.workspace }}/apps/api/src:${{ github.workspace }}/packages/core/src:${{ github.workspace }}/packages/adapters/src" uv run --directory apps/api uvicorn aws_sdlc_api.main:app \
            --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-delay 1 --retry-connrefused -sf \
            http://localhost:8000/health

      - name: Advance to dual-write phase
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mode":"dual"}' \
            http://localhost:8000/admin/write-mode

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Stop app
        if: always()
        run: pkill -f "uvicorn" || true

  wait-for-infra-plan:
    name: Wait For Infra Plan
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.info('Not a push event; no infra coordination needed.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'infra-plan.yml';
            const head_sha = context.sha;
            const changedPaths = new Set(
              (context.payload.commits || []).flatMap(commit => [
                ...(commit.added || []),
                ...(commit.modified || []),
                ...(commit.removed || []),
              ])
            );
            const requiresInfra = [...changedPaths].some(path =>
              path === '.github/workflows/infra-plan.yml' || path.startsWith('infra/')
            );

            if (!requiresInfra) {
              core.info('This push did not touch infra; no infra plan wait needed.');
              return;
            }

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'requested',
              'waiting',
              'pending',
              'action_required',
            ]);

            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                head_sha,
                per_page: 20,
              });

              const runs = data.workflow_runs.filter(run =>
                run.event === 'push' && run.head_sha === head_sha
              );

              const blocking = runs.filter(run => activeStatuses.has(run.status));
              if (blocking.length > 0) {
                core.info(`Waiting for Infra Plan workflow on ${head_sha} to finish...`);
                await sleep(30000);
                continue;
              }

              const completed = runs
                .filter(run => run.status === 'completed')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (completed.length === 0) {
                core.info(`Waiting for Infra Plan workflow on ${head_sha} to be created...`);
                await sleep(30000);
                continue;
              }

              const latest = completed[0];
              if (latest.conclusion !== 'success') {
                core.setFailed(
                  `Infra Plan workflow for ${head_sha} concluded with ${latest.conclusion}.`
                );
                return;
              }

              core.info('Infra Plan workflow completed successfully for this commit.');
              return;
            }

            core.setFailed('Timed out waiting for Infra Plan workflow to finish.');

  build-and-push:
    name: Build, Scan & Push to ECR
    needs: [validate-and-test, wait-for-infra-plan]
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_build == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build images
        env:
          TAG: sha-${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:${TAG}" . &
          docker build -f apps/backfill-worker/Dockerfile -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:${TAG}" . &
          docker build -f apps/data-export-job/Dockerfile -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/data-export-job:${TAG}" . &
          docker build -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:${TAG}" db/ &
          wait

      - name: Mirror pgbouncer to ECR
        env:
          PGBOUNCER_TAG: v1.25.1-p0
        run: |
          if aws ecr describe-images \
            --repository-name ${{ env.STACK_NAME }}/pgbouncer \
            --image-ids "imageTag=${PGBOUNCER_TAG}" 2>/dev/null; then
            echo "pgbouncer:${PGBOUNCER_TAG} already in ECR — skipping"
          else
            docker pull "edoburu/pgbouncer:${PGBOUNCER_TAG}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy:0.69.3 image \
              --exit-code 1 --severity CRITICAL --no-progress "edoburu/pgbouncer:${PGBOUNCER_TAG}"
            docker tag  "edoburu/pgbouncer:${PGBOUNCER_TAG}" \
                        "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer:${PGBOUNCER_TAG}"
            docker push "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer:${PGBOUNCER_TAG}"
          fi

      - name: Scan images
        run: |
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy:0.69.3 image \
              --exit-code 1 --severity CRITICAL --no-progress "$1"
          }
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/data-export-job:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:sha-${{ github.sha }}" &
          wait

      - name: Push images
        env:
          TAG: sha-${{ github.sha }}
        run: |
          for repo in app worker data-export-job liquibase; do
            docker push "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/${repo}:${TAG}" &
          done
          wait

      - name: Publish build summary
        env:
          TAG: sha-${{ github.sha }}
        run: |
          {
            echo "### App images ready for deployment approval"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo "Image tag: ${TAG}"
            echo ""
            echo "Run the App Deploy workflow with this image tag after review."
          } >> "$GITHUB_STEP_SUMMARY"
