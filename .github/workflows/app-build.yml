name: App Build

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Type build to confirm build, scan, and push images for later deployment approval."
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/app-build.yml"
      - "apps/api/**"
      - "apps/backfill-worker/**"
      - "apps/data-export-job/**"
      - "apps/order-event-consumer/**"
      - "compose.yaml"
      - "dapr/**"
      - "observability/firelens/**"
      - "packages/**"
      - "pyproject.toml"
      - "db/**"
      - "tests/**"
      - "scripts/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-build.yml"
      - "apps/api/**"
      - "apps/backfill-worker/**"
      - "apps/data-export-job/**"
      - "apps/order-event-consumer/**"
      - "compose.yaml"
      - "dapr/**"
      - "observability/firelens/**"
      - "packages/**"
      - "pyproject.toml"
      - "db/**"
      - "tests/**"
      - "scripts/**"
      - "uv.lock"

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 691627364817.dkr.ecr.eu-central-1.amazonaws.com
  STACK_NAME: aws-sdlc-containers
  ROOT_DOMAIN: ersahinco-sandbox.eu
  PGBOUNCER_TAG: v1.25.1-p0

# PRs and pushes validate the reference workload locally. Manual runs build,
# scan, and push immutable images only; deployment is a separate approval step.
jobs:
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.3@sha256:78481659c47e862334611ccdaf7c369c986b3046da9857112f3b309114a65fb4
        env:
          POSTGRES_DB: aws_sdlc_containers
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aws_sdlc_containers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      pgbouncer:
        image: edoburu/pgbouncer:v1.25.1-p0@sha256:c7bfcaa24de830e29588bb9ad1eb39cebaf07c27149e1974445899b695634bb4
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: aws_sdlc_containers
          DB_USER: postgres
          DB_PASSWORD: postgres
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 20
          MAX_CLIENT_CONN: 200
          AUTH_TYPE: scram-sha-256
        ports:
          - 6432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:6432/aws_sdlc_containers
      BASE_URL: http://localhost:8000
      SEED_NUM_CUSTOMERS: 200
      SEED_NUM_ORDERS: 1000

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --group test

      - name: Run Python static checks
        run: |
          uv run ruff format --check apps/ packages/ tests/ scripts/
          uv run ruff check apps/ packages/ tests/ scripts/
          uv run pyright

      - name: Check shell script syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 bash -n

      - name: Init DB schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d aws_sdlc_containers \
            -f db/sql/bootstrap.sql

      - name: Run Liquibase migrations
        run: |
          docker build -t aws-sdlc-containers-liquibase:test db/
          docker run --rm --network host \
            -v "${{ github.workspace }}/db:/liquibase/db" \
            aws-sdlc-containers-liquibase:test \
              --changelog-file=changelog/db.changelog-master.yaml \
              --search-path=/liquibase/db \
              --url=jdbc:postgresql://localhost:5432/aws_sdlc_containers \
              --username=postgres \
              --password=postgres \
              update

      - name: Seed data
        run: uv run python scripts/data/seed_data.py

      - name: Start app
        run: |
          PYTHONPATH="${{ github.workspace }}/apps/api/src:${{ github.workspace }}/packages/application/src:${{ github.workspace }}/packages/domain/src:${{ github.workspace }}/packages/infrastructure/src" uv run --directory apps/api uvicorn aws_sdlc_api.main:app \
            --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-delay 1 --retry-connrefused -sf \
            http://localhost:8000/health

      - name: Advance to dual-write phase
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mode":"dual"}' \
            http://localhost:8000/admin/write-mode

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Stop app
        if: always()
        run: pkill -f "uvicorn" || true

  build-and-push:
    name: Build, Scan & Push to ECR
    needs: validate-and-test
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_build == 'build' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws
    permissions:
      id-token: write
      contents: read
      attestations: write
    outputs:
      image_tag: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2

      - name: Build images
        env:
          TAG: sha-${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:${TAG}" . &
          docker build -f apps/backfill-worker/Dockerfile -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:${TAG}" . &
          docker build -f apps/data-export-job/Dockerfile -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/data-export-job:${TAG}" . &
          docker build -f apps/order-event-consumer/Dockerfile -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/order-event-consumer:${TAG}" . &
          docker build -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:${TAG}" db/ &
          docker build -f observability/firelens/Dockerfile -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens:${TAG}" observability/firelens &
          docker build -f db/pgbouncer/Dockerfile --build-arg "PGBOUNCER_TAG=${PGBOUNCER_TAG}" -t "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer:${PGBOUNCER_TAG}" db/pgbouncer &
          wait

      - name: Scan images
        run: |
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
              --exit-code 1 --severity CRITICAL --no-progress "$1"
          }
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/data-export-job:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/order-event-consumer:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens:sha-${{ github.sha }}" &
          scan "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer:${PGBOUNCER_TAG}" &
          wait

      - name: Push images
        env:
          TAG: sha-${{ github.sha }}
        run: |
          for repo in app worker data-export-job order-event-consumer liquibase firelens; do
            docker push "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/${repo}:${TAG}" &
          done
          docker push "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer:${PGBOUNCER_TAG}" &
          wait

      - name: Resolve pushed image digests
        id: image-digests
        env:
          TAG: sha-${{ github.sha }}
        run: |
          resolve_digest() {
            local output_name="$1"
            local image="$2"
            local digest
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')
            digest=${digest#\"}
            digest=${digest%\"}
            echo "${output_name}=${digest}" >> "$GITHUB_OUTPUT"
          }

          resolve_digest app "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app:${TAG}"
          resolve_digest worker "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker:${TAG}"
          resolve_digest data_export_job "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/data-export-job:${TAG}"
          resolve_digest order_event_consumer "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/order-event-consumer:${TAG}"
          resolve_digest liquibase "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase:${TAG}"
          resolve_digest firelens "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens:${TAG}"
          resolve_digest pgbouncer "${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer:${PGBOUNCER_TAG}"

      - name: Attest app image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/app
          subject-digest: ${{ steps.image-digests.outputs.app }}
          push-to-registry: true

      - name: Attest worker image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/worker
          subject-digest: ${{ steps.image-digests.outputs.worker }}
          push-to-registry: true

      - name: Attest data export image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/data-export-job
          subject-digest: ${{ steps.image-digests.outputs.data_export_job }}
          push-to-registry: true

      - name: Attest order event consumer image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/order-event-consumer
          subject-digest: ${{ steps.image-digests.outputs.order_event_consumer }}
          push-to-registry: true

      - name: Attest liquibase image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/liquibase
          subject-digest: ${{ steps.image-digests.outputs.liquibase }}
          push-to-registry: true

      - name: Attest FireLens image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/firelens
          subject-digest: ${{ steps.image-digests.outputs.firelens }}
          push-to-registry: true

      - name: Attest PgBouncer image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.STACK_NAME }}/pgbouncer
          subject-digest: ${{ steps.image-digests.outputs.pgbouncer }}
          push-to-registry: true

      - name: Publish build summary
        env:
          TAG: sha-${{ github.sha }}
        run: |
          {
            echo "### App images ready for deployment approval"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo "Image tag: ${TAG}"
            echo ""
            echo "Run the App Deploy workflow with this image tag after review."
          } >> "$GITHUB_STEP_SUMMARY"
