name: App Build

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Type build to confirm build, scan, and push images for later deployment approval."
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/app-build.yml"
      - ".github/workflows/app-deploy.yml"
      - ".github/workflows/data-backfill.yml"
      - ".github/workflows/data-runtime-switch.yml"
      - ".github/workflows/data-schema-apply.yml"
      - ".github/workflows/data-support-deploy.yml"
      - ".github/workflows/infra-apply.yml"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/operational-snapshot.yml"
      - "apps/**"
      - "compose.yaml"
      - "platform/**"
      - "infra/catalog/**"
      - "packages/**"
      - "pyproject.toml"
      - "db/**"
      - "tests/**"
      - "scripts/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-build.yml"
      - ".github/workflows/app-deploy.yml"
      - ".github/workflows/data-backfill.yml"
      - ".github/workflows/data-runtime-switch.yml"
      - ".github/workflows/data-schema-apply.yml"
      - ".github/workflows/data-support-deploy.yml"
      - ".github/workflows/infra-apply.yml"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/operational-snapshot.yml"
      - "apps/**"
      - "compose.yaml"
      - "platform/**"
      - "infra/catalog/**"
      - "packages/**"
      - "pyproject.toml"
      - "db/**"
      - "tests/**"
      - "scripts/**"
      - "uv.lock"

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || github.event.repository.name }}
  PGBOUNCER_TAG: ${{ vars.PGBOUNCER_TAG || 'v1.25.1-p0' }}

permissions:
  contents: read

# PRs and pushes validate workload hosts and local conformance. Manual runs
# build, scan, and push immutable images only; deployment is a separate
# approval step.
jobs:
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.3@sha256:78481659c47e862334611ccdaf7c369c986b3046da9857112f3b309114a65fb4
        env:
          POSTGRES_DB: aws_sdlc_containers
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aws_sdlc_containers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      pgbouncer:
        image: edoburu/pgbouncer:v1.25.1-p0@sha256:c7bfcaa24de830e29588bb9ad1eb39cebaf07c27149e1974445899b695634bb4
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: aws_sdlc_containers
          DB_USER: postgres
          DB_PASSWORD: postgres
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 20
          MAX_CLIENT_CONN: 200
          AUTH_TYPE: scram-sha-256
        ports:
          - 6432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:6432/aws_sdlc_containers
      BASE_URL: http://localhost:8000
      SEED_NUM_CUSTOMERS: 200
      SEED_NUM_ORDERS: 1000

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --group scripts --group test

      - name: Run Python static checks
        run: |
          uv run ruff format --check apps/ packages/ tests/ scripts/
          uv run ruff check apps/ packages/ tests/ scripts/
          uv run pyright

      - name: Check shell script syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 bash -n

      - name: Check workload paved-road readiness
        run: make workload-readiness-check

      - name: Check workload admission candidates
        run: make workload-admission-check

      - name: Write monorepo capability profile
        run: |
          mkdir -p "$RUNNER_TEMP/monorepo-capability-profile"
          make monorepo-capability-profile-check \
            > "$RUNNER_TEMP/monorepo-capability-profile/profile.json"
          make monorepo-capability-profile-md \
            > "$RUNNER_TEMP/monorepo-capability-profile/profile.md"

      - name: Upload monorepo capability profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monorepo-capability-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/monorepo-capability-profile
          retention-days: 30

      - name: Init DB schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d aws_sdlc_containers \
            -f db/sql/bootstrap.sql

      - name: Run Liquibase migrations
        run: |
          docker build -t "${STACK_NAME}-liquibase:test" db/
          docker run --rm --network host \
            -v "${{ github.workspace }}/db:/liquibase/db" \
            "${STACK_NAME}-liquibase:test" \
              --changelog-file=changelog/db.changelog-master.yaml \
              --search-path=/liquibase/db \
              --url=jdbc:postgresql://localhost:5432/aws_sdlc_containers \
              --username=postgres \
              --password=postgres \
              update

      - name: Seed data
        run: uv run python scripts/data/seed_data.py

      - name: Start app
        run: |
          PYTHONPATH="${{ github.workspace }}/apps:${{ github.workspace }}/packages" uv run --directory apps/api uvicorn api.main:app \
            --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-delay 1 --retry-connrefused -sf \
            http://localhost:8000/health

      - name: Advance to dual-write phase
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"mode":"dual"}' \
            http://localhost:8000/admin/write-mode

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run runtime conformance
        run: make runtime-conformance

      - name: Stop app
        if: always()
        run: pkill -f "uvicorn" || true

  image-matrix:
    name: Resolve Image Matrix
    needs: validate-and-test
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_build == 'build' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.images }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Build image matrix
        id: images
        env:
          TAG: sha-${{ github.sha }}
        run: |
          images=$(python3 -m scripts.platform.workload_metadata image-matrix "$TAG" "$PGBOUNCER_TAG")
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  build-scan-push:
    name: Build, Scan & Push (${{ matrix.image.name }})
    needs: image-matrix
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_build == 'build' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.image-matrix.outputs.images) }}
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000 # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2

      - name: Build image
        id: image
        run: |
          image="${{ steps.login-ecr.outputs.registry }}/${{ env.STACK_NAME }}/${{ matrix.image.repository }}:${{ matrix.image.tag }}"
          build_args=()
          while IFS='=' read -r key value; do
            [[ -z "$key" ]] && continue
            build_args+=(--build-arg "${key}=${value}")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< '${{ toJSON(matrix.image.build_args) }}')
          docker build \
            -f "${{ matrix.image.dockerfile }}" \
            "${build_args[@]}" \
            -t "$image" \
            "${{ matrix.image.context }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL --no-progress \
            "${{ steps.image.outputs.image }}"

      - name: Check existing immutable image tag
        id: existing-image
        if: matrix.image.publish_strategy == 'reuse-if-present'
        env:
          REPOSITORY: ${{ env.STACK_NAME }}/${{ matrix.image.repository }}
          IMAGE_TAG: ${{ matrix.image.tag }}
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Immutable image tag already exists in ECR; reusing the published artifact."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push image
        if: matrix.image.publish_strategy != 'reuse-if-present' || steps.existing-image.outputs.exists != 'true'
        run: docker push "${{ steps.image.outputs.image }}"

      - name: Resolve pushed image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${{ steps.image.outputs.image }}" --format '{{json .Manifest.Digest}}')
          digest=${digest#\"}
          digest=${digest%\"}
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ env.STACK_NAME }}/${{ matrix.image.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Publish build summary
        run: |
          {
            echo "### Image ready for deployment approval"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo "Image: ${{ steps.image.outputs.image }}"
            echo ""
            echo "Run the App Deploy workflow with image tag sha-${{ github.sha }} after review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write build evidence
        run: |
          python3 -m scripts.observability.release_event \
            --event-type app_build \
            --status success \
            --summary "Image built, scanned, and pushed for later deployment approval." \
            --service-name "${{ matrix.image.repository }}" \
            --workload-id "${{ matrix.image.name }}" \
            --image-tag "${{ matrix.image.tag }}" \
            --image-digest "${{ steps.digest.outputs.digest }}" \
            --deployment-id "${{ steps.digest.outputs.digest }}" \
            --output-dir "/tmp/release-evidence/${{ matrix.image.repository }}"
          cat "/tmp/release-evidence/${{ matrix.image.repository }}/release-event.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-app-build-${{ matrix.image.repository }}-${{ github.run_id }}
          path: /tmp/release-evidence/${{ matrix.image.repository }}
          retention-days: 30
