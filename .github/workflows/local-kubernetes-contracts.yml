name: Local Kubernetes Contracts

on:
  pull_request:
    paths:
      - ".github/workflows/local-kubernetes-contracts.yml"
      - "Makefile"
      - "infra/catalog/**"
      - "infra/local-kubernetes/**"
      - "platform/platform-inventory.json"
      - "platform/runtime-defaults.json"
      - "platform/workloads.json"
      - "scripts/platform/workload_metadata.py"
      - "tests/contracts/test_local_kubernetes_contract.py"
      - "tests/contracts/test_non_goal_boundary_contract.py"
      - "tests/contracts/test_runtime_defaults_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-kubernetes-contracts.yml"
      - "Makefile"
      - "infra/catalog/**"
      - "infra/local-kubernetes/**"
      - "platform/platform-inventory.json"
      - "platform/runtime-defaults.json"
      - "platform/workloads.json"
      - "scripts/platform/workload_metadata.py"
      - "tests/contracts/test_local_kubernetes_contract.py"
      - "tests/contracts/test_non_goal_boundary_contract.py"
      - "tests/contracts/test_runtime_defaults_contract.py"

permissions:
  contents: read

jobs:
  static-contracts:
    name: Static Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --group scripts --group test

      - name: Run static local Kubernetes contracts
        run: make local-kubernetes-contracts
