name: Workload or capability admission
description: Request a contract-governed workload or platform capability on existing infrastructure.
title: "[admission] <workload or capability>"
labels:
  - platform-admission
  - workload-contract
body:
  - type: markdown
    attributes:
      value: |
        Use this for self-service admission requests. Describe workload intent and
        required capabilities, not raw AWS resources. Provider names, ARNs,
        subnet IDs, queue URLs, task definitions, and bucket names belong in the
        runtime realization after the contract fits.

  - type: input
    id: owner
    attributes:
      label: Owning team
      description: Team that owns the workload operation and admission decision.
      placeholder: payments-platform
    validations:
      required: true

  - type: input
    id: workload
    attributes:
      label: Workload or capability name
      description: Use the intended workload id when known; use a short capability name otherwise.
      placeholder: payments_gateway
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      description: Pick the contract-level outcome you need.
      options:
        - Add local-first workload
        - Promote workload to local-kubernetes
        - Promote workload to aws-ecs
        - Add object artifact sink
        - Add operator job execution
        - Add scheduled job execution
        - Add Dapr pub/sub boundary
        - Grant bounded dependency access
    validations:
      required: true

  - type: dropdown
    id: operational_class
    attributes:
      label: Operational class
      description: Match platform/workloads.json.
      options:
        - edge-service
        - internal-service
        - operator-job
        - scheduled-job
        - Not a new workload
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: Workload intent and user value
      description: Explain what the app/job does and why the platform should admit this capability.
      placeholder: |
        This workload accepts partner order webhooks and publishes normalized order events.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Contract inputs
      description: List contract fields and app-facing names only. Do not include secret values.
      value: |
        - use_cases:
        - app_path:
        - image package and command:
        - service port, if a service:
        - job trigger and idempotency, if a job:
        - config env names:
        - secret names:
        - database need:
        - Dapr pub/sub need:
        - object output or artifact need:
    validations:
      required: true

  - type: textarea
    id: runtime
    attributes:
      label: Runtime target request
      description: Name the target and the evidence you already have.
      value: |
        - requested runtime.supported:
        - requested runtime.admitted:
        - local proof already run:
        - cloud readiness evidence:
        - runbook or operator notes:
    validations:
      required: true

  - type: textarea
    id: operations
    attributes:
      label: Operational expectations
      description: Describe health, readiness, metrics, logs, traces, rerun behavior, and evidence.
      value: |
        - health/readiness endpoints:
        - required Prometheus metrics:
        - structured log fields:
        - trace need:
        - operator evidence:
        - rollback or rerun expectation:
    validations:
      required: true

  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      description: Confirm the request stays inside the delivery toolkit boundary.
      options:
        - label: This request is for a workload or bounded capability, not arbitrary AWS resources.
          required: true
        - label: Provider resource names and IAM details can be owned by the runtime realization.
          required: true
        - label: The workload can start local-first unless cloud admission is already justified.
          required: true
        - label: The request does not require adding a new runtime target, portal, generator, Helm/CRD layer, or provider-neutral infrastructure module.
          required: true

  - type: textarea
    id: links
    attributes:
      label: Links and supporting context
      description: PRs, candidate JSON, design notes, service repo, runbook, or evidence artifacts.
      placeholder: |
        - Candidate workload JSON:
        - Application repo:
        - Local proof run:
