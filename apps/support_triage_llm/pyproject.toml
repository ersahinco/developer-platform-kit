[project]
name = "aws-sdlc-containers-support-triage-llm"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-sdlc-containers-infrastructure",
    "fastapi>=0.136.3,<0.136.4",
    "prometheus-client>=0.20.0",
    "uvicorn>=0.50.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["support_triage_llm"]
package-dir = { support_triage_llm = "." }
