[project]
name = "aws-sdlc-containers-event-consumer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-sdlc-containers-application",
    "aws-sdlc-containers-infrastructure",
    "fastapi>=0.139.2,<0.139.3",
    "prometheus-client>=0.20.0",
    "uvicorn>=0.50.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["event_consumer"]
package-dir = { event_consumer = "." }
