[project]
name = "aws-sdlc-containers-churn-model-train-job"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-sdlc-containers-infrastructure",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["churn_model_train_job"]
package-dir = { churn_model_train_job = "." }
