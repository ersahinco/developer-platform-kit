[project]
name = "aws-sdlc-containers-open-dataset-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-sdlc-containers-application",
    "aws-sdlc-containers-infrastructure",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["open_dataset_pipeline"]
package-dir = { open_dataset_pipeline = "." }
