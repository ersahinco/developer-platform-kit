[project]
name = "aws-sdlc-containers-order-event-consumer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-sdlc-containers-application",
    "aws-sdlc-containers-infrastructure",
    "fastapi>=0.111.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.29.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["order_event_consumer"]
package-dir = { order_event_consumer = "." }
