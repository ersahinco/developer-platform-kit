[project]
name = "aws-sdlc-containers-lake-orders-ingest-job"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-sdlc-containers-infrastructure",
    "duckdb>=1.4.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lake_orders_ingest_job"]
package-dir = { lake_orders_ingest_job = "." }
