[project]
name = "aws-sdlc-containers-integration-check-job"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-sdlc-containers-infrastructure",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["integration_check_job"]
package-dir = { integration_check_job = "." }
