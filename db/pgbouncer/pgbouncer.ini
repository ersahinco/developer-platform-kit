[databases]
# Forward all connections to the real Postgres instance.
# DB_HOST and DB_PORT are substituted at container startup via envsubst.
migration_example = host=${DB_HOST} port=${DB_PORT} dbname=migration_example

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

# transaction mode: connection returned to pool after each transaction.
# Required for correct behaviour with SQLAlchemy's autocommit=False sessions —
# each BEGIN/COMMIT pair occupies a server connection only for its duration.
# session mode would hold a server connection for the lifetime of the client
# connection, defeating the purpose of pooling.
pool_mode = transaction

# Server-side pool size — the number of real Postgres connections pgbouncer
# maintains. Set to ~80% of RDS max_connections to leave headroom for
# superuser/monitoring connections.
# db.t4g.small max_connections ≈ 97 → default_pool_size = 20 per database.
# Adjust upward if connection wait times appear in pgbouncer logs.
default_pool_size = 20

# Maximum client connections across all pools. With NullPool in SQLAlchemy,
# each request opens one pgbouncer client connection for the duration of its
# transaction. 10 tasks × ~20 concurrent requests = 200 is a safe ceiling.
max_client_conn = 200

# Log slow queries and connection events for observability.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Auth: scram-sha-256 matches Postgres 16's default auth method.
# PgBouncer must use the same method as the server to proxy credentials correctly.
# trust would cause "wrong password type" errors because Postgres 16 negotiates
# scram-sha-256 and pgbouncer cannot downgrade the handshake.
auth_type = scram-sha-256
