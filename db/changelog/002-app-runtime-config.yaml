databaseChangeLog:
  - changeSet:
      id: 002-create-app-runtime-config
      author: aws-sdlc-containers
      comment: "Expand: create app_runtime_config table for runtime feature flags (WRITE_MODE, READ_MODE)"
      changes:
        - createTable:
            tableName: app_runtime_config
            columns:
              - column:
                  name: key
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: value
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-seed-write-mode-legacy
      author: aws-sdlc-containers
      comment: "Expand: seed WRITE_MODE = legacy so the app writes only to orders.billing_email by default"
      changes:
        - insert:
            tableName: app_runtime_config
            columns:
              - column:
                  name: key
                  value: WRITE_MODE
              - column:
                  name: value
                  value: legacy

  - changeSet:
      id: 002-seed-read-mode-legacy
      author: aws-sdlc-containers
      comment: "Expand: seed READ_MODE = legacy so the app reads from orders.billing_email by default"
      changes:
        - insert:
            tableName: app_runtime_config
            columns:
              - column:
                  name: key
                  value: READ_MODE
              - column:
                  name: value
                  value: legacy
