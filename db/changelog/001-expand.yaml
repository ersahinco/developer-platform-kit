databaseChangeLog:
  - changeSet:
      id: 001-create-order-contact-email
      author: aws-sdlc-containers
      comment: "Expand: create order_contact_email table (new home for billing_email)"
      changes:
        - createTable:
            tableName: order_contact_email
            columns:
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_order_contact_email_order_id
                    references: orders(id)
              - column:
                  name: billing_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
