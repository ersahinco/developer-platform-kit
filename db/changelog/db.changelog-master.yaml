databaseChangeLog:
  # 000 — Bootstrap: creates the customers and orders tables with all columns, FK, and indexes.
  - include:
      file: changelog/000-bootstrap.yaml

  # 001 — Expand: creates order_contact_email table (new home for billing_email).
  #        orders.billing_email still exists; dual-write begins after this changeset.
  - include:
      file: changelog/001-expand.yaml

  # 002 — Expand: creates app_runtime_config table and seeds WRITE_MODE = legacy, READ_MODE = legacy.
  #        app_runtime_config is used for WRITE_MODE and READ_MODE runtime flags.
  - include:
      file: changelog/002-app-runtime-config.yaml

  # 003 — Backfill progress: moves backfill_progress table under Liquibase ownership.
  #        Previously in docker-entrypoint-initdb.d/observability.sql (init-only, not idempotent).
  - include:
      file: changelog/003-backfill-progress.yaml
