databaseChangeLog:
  - changeSet:
      id: 006-create-idempotency-keys
      author: aws-sdlc-containers
      comment: "Persist POST /orders idempotency responses and in-flight request state."
      changes:
        - sql:
            sql: |
              CREATE TABLE idempotency_keys (
                key VARCHAR(200) PRIMARY KEY,
                request_hash CHAR(64) NOT NULL,
                status VARCHAR(32) NOT NULL,
                response_status_code INTEGER,
                response_payload JSONB,
                processing_expires_at TIMESTAMPTZ NOT NULL,
                last_error TEXT,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                CONSTRAINT chk_idempotency_keys_status_known
                  CHECK (status IN ('processing', 'completed', 'failed')),
                CONSTRAINT chk_idempotency_keys_completed_has_response
                  CHECK (
                    status <> 'completed'
                    OR (response_status_code IS NOT NULL AND response_payload IS NOT NULL)
                  )
              );

              CREATE INDEX ix_idempotency_keys_status_expires
                ON idempotency_keys (status, processing_expires_at);
            splitStatements: false
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS idempotency_keys;
            splitStatements: false

  - changeSet:
      id: 006-create-order-event-receipts
      author: aws-sdlc-containers
      comment: "Record consumed order events for duplicate and late-arrival handling."
      changes:
        - sql:
            sql: |
              CREATE TABLE order_event_receipts (
                event_id VARCHAR(200) PRIMARY KEY,
                event_type VARCHAR(100) NOT NULL,
                aggregate_type VARCHAR(100) NOT NULL,
                aggregate_id BIGINT NOT NULL,
                idempotency_key VARCHAR(200) NOT NULL,
                occurred_at TIMESTAMPTZ NOT NULL,
                payload JSONB NOT NULL,
                status VARCHAR(32) NOT NULL,
                duplicate_count INTEGER NOT NULL DEFAULT 0,
                first_seen_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                last_seen_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                CONSTRAINT chk_order_event_receipts_status_known
                  CHECK (status IN ('processed', 'ignored_stale')),
                CONSTRAINT chk_order_event_receipts_duplicate_count_non_negative
                  CHECK (duplicate_count >= 0)
              );

              CREATE INDEX ix_order_event_receipts_aggregate
                ON order_event_receipts (aggregate_type, aggregate_id, event_type, occurred_at);
            splitStatements: false
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS order_event_receipts;
            splitStatements: false
