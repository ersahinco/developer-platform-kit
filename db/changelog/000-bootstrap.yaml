databaseChangeLog:
  - changeSet:
      id: 000-create-customers
      author: db-migration-example
      comment: "Bootstrap: create customers table"
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 000-create-orders
      author: db-migration-example
      comment: "Bootstrap: create orders table with billing_email (dropped in Contract phase)"
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_customer_id
                    references: customers(id)
              - column:
                  name: total_amount
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: submitted_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: billing_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 000-index-orders-customer-id
      author: db-migration-example
      comment: "Bootstrap: index on orders.customer_id for FK lookups"
      changes:
        - createIndex:
            indexName: idx_orders_customer_id
            tableName: orders
            columns:
              - column:
                  name: customer_id

  - changeSet:
      id: 000-index-orders-status
      author: db-migration-example
      comment: "Bootstrap: index on orders.status for filtering"
      changes:
        - createIndex:
            indexName: idx_orders_status
            tableName: orders
            columns:
              - column:
                  name: status
