databaseChangeLog:
  - changeSet:
      id: 005-order-event-outbox
      author: aws-sdlc-containers
      comment: "Durable transactional outbox for order domain events."
      changes:
        - sql:
            sql: |
              CREATE TABLE outbox_messages (
                id BIGSERIAL PRIMARY KEY,
                event_type VARCHAR(100) NOT NULL,
                event_id VARCHAR(200) NOT NULL,
                aggregate_type VARCHAR(100) NOT NULL,
                aggregate_id BIGINT NOT NULL,
                message_group_id VARCHAR(200) NOT NULL,
                message_deduplication_id VARCHAR(200) NOT NULL,
                payload JSONB NOT NULL,
                status VARCHAR(32) NOT NULL DEFAULT 'pending',
                attempt_count INTEGER NOT NULL DEFAULT 0,
                next_attempt_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                locked_until TIMESTAMPTZ,
                published_at TIMESTAMPTZ,
                last_error TEXT,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                CONSTRAINT uq_outbox_messages_event_id UNIQUE (event_id),
                CONSTRAINT chk_outbox_messages_status_known
                  CHECK (status IN ('pending', 'processing', 'published')),
                CONSTRAINT chk_outbox_messages_attempt_count_non_negative
                  CHECK (attempt_count >= 0)
              );

              CREATE INDEX ix_outbox_messages_dispatch
                ON outbox_messages (status, next_attempt_at, locked_until);
              CREATE INDEX ix_outbox_messages_aggregate
                ON outbox_messages (aggregate_type, aggregate_id);
            splitStatements: false
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS outbox_messages;
            splitStatements: false
