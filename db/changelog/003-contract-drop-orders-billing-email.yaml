databaseChangeLog:
  - changeSet:
      id: 003-drop-orders-billing-email
      author: db-migration-example
      comment: >
        Contract: drop orders.billing_email. Guarded by sqlCheck precondition — only runs when
        READ_MODE = new, confirming all reads have been switched to order_contact_email.
        Applied independently after the Switch phase is complete and verify_contract_ready.py exits 0.
      preConditions:
        - onFail: HALT
          sqlCheck:
            expectedResult: new
            sql: >
              SELECT value FROM app_runtime_config WHERE key = 'READ_MODE'
      changes:
        - dropColumn:
            tableName: orders
            columnName: billing_email
