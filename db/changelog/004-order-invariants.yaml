databaseChangeLog:
  - changeSet:
      id: 004-order-status-known
      author: aws-sdlc-containers
      comment: "Guard orders.status so persisted rows use the application lifecycle values."
      changes:
        - sql:
            sql: |
              ALTER TABLE orders
              ADD CONSTRAINT chk_orders_status_known
              CHECK (status IN ('SUBMITTED', 'PAID', 'CANCELLED'));
            splitStatements: false
      rollback:
        - sql:
            sql: |
              ALTER TABLE orders
              DROP CONSTRAINT IF EXISTS chk_orders_status_known;
            splitStatements: false

  - changeSet:
      id: 004-order-total-amount-positive
      author: aws-sdlc-containers
      comment: "Guard orders.total_amount so persisted orders always have positive value."
      changes:
        - sql:
            sql: |
              ALTER TABLE orders
              ADD CONSTRAINT chk_orders_total_amount_positive
              CHECK (total_amount > 0);
            splitStatements: false
      rollback:
        - sql:
            sql: |
              ALTER TABLE orders
              DROP CONSTRAINT IF EXISTS chk_orders_total_amount_positive;
            splitStatements: false
