[project]
name = "aws-sdlc-containers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.4",
]
test = [
    "pytest>=8.2.0",
    "testcontainers[postgres]>=4.8.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/backfill-worker",
    "apps/data-export-job",
    "packages/core",
    "packages/adapters",
]

[tool.uv.sources]
aws-sdlc-containers-adapters = { workspace = true }
aws-sdlc-containers-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "last: run this test after all others",
    "require_phase: skip test unless current migration phase matches",
]
