[project]
name = "aws-sdlc-containers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7.0",
    "pyright>=1.1.409",
    "ruff>=0.4.4",
]
test = [
    "pytest>=9.0.3",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/backfill-worker",
    "apps/data-export-job",
    "packages/core",
    "packages/adapters",
]

[tool.uv.sources]
aws-sdlc-containers-adapters = { workspace = true }
aws-sdlc-containers-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "require_phase: skip test unless current migration phase matches",
]

[tool.pyright]
include = ["apps", "packages", "tests", "scripts"]
extraPaths = [
    "apps/api/src",
    "apps/backfill-worker/src",
    "apps/data-export-job/src",
    "packages/adapters/src",
    "packages/core/src",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
