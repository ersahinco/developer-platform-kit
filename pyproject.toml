[project]
name = "aws-sdlc-containers"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.7",
    "pip-audit>=2.7.0",
    "pyright>=1.1.409",
    "ruff>=0.4.4",
]
test = [
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/backfill_worker",
    "apps/data_export_job",
    "apps/order_event_consumer",
    "packages/domain",
    "packages/application",
    "packages/infrastructure",
]

[tool.uv.sources]
aws-sdlc-containers-domain = { workspace = true }
aws-sdlc-containers-application = { workspace = true }
aws-sdlc-containers-infrastructure = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "require_phase: skip test unless current migration phase matches",
]

[tool.pyright]
include = ["apps", "packages", "tests", "scripts"]
extraPaths = [
    "apps",
    "packages",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"
