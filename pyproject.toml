[project]
name = "aws-sdlc-containers"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
]

[dependency-groups]
dev = [
    "pip-audit>=2.7.0",
    "pyright>=1.1.410",
    "ruff>=0.15.14",
]
scripts = [
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.30",
]
test = [
    "duckdb>=1.4.2",
    "httpx>=0.27.0",
    "hypothesis>=6.152.7",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/backfill_worker",
    "apps/churn_model_train_job",
    "apps/churn_prediction_api",
    "apps/data_export_job",
    "apps/event_consumer",
    "apps/foreign_inventory_sync",
    "apps/integration_check_job",
    "apps/lake_orders_ingest_job",
    "apps/open_dataset_pipeline",
    "apps/operational_snapshot_job",
    "apps/support_triage_llm",
    "packages/domain",
    "packages/application",
    "packages/infrastructure",
]

[tool.uv.sources]
aws-sdlc-containers-domain = { workspace = true }
aws-sdlc-containers-application = { workspace = true }
aws-sdlc-containers-infrastructure = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "require_phase: skip test unless current migration phase matches",
]

[tool.pyright]
include = ["apps", "examples", "packages", "tests", "scripts"]
extraPaths = [
    "apps",
    "examples",
    "packages",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"
