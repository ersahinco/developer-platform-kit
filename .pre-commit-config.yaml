repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive

  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan
        entry: uv run python scripts/secret_scan.py .
        language: system
        pass_filenames: false

      - id: shell-syntax
        name: shell script syntax
        entry: bash -n
        language: system
        files: ^scripts/.*\.sh$

      - id: docs-links
        name: docs local links
        entry: python3 scripts/check_docs_links.py
        language: system
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
