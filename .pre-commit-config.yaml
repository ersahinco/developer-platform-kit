default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        args: [--allow-multiple-documents]
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan
        entry: gitleaks dir . --redact --no-banner
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: shell-syntax
        name: shell script syntax
        entry: bash -n
        language: system
        files: ^scripts/.*\.sh$
        stages: [pre-commit]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^scripts/.*\.sh$
        stages: [pre-commit]

      - id: typos
        name: typos
        entry: make lint-typos
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: markdownlint
        name: markdownlint
        entry: make lint-markdown
        language: system
        pass_filenames: false
        files: \.md$
        stages: [pre-commit]

      - id: docs-links
        name: docs local links
        entry: lychee README.md docs/**/*.md
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit]

      - id: dockerfile-lint
        name: Dockerfile lint
        entry: hadolint db/Dockerfile db/pgbouncer/Dockerfile platform/workload.Dockerfile
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: commitlint
        name: commitlint
        entry: python3 scripts/ci/commitlint.py
        language: system
        stages: [commit-msg]

      - id: terraform-validate
        name: Terraform validate
        entry: make infra-validate-local
        language: system
        pass_filenames: false
        files: ^infra/.*\.tf$
        stages: [pre-push]

      - id: tflint
        name: TFLint
        entry: make lint-tflint
        language: system
        pass_filenames: false
        files: ^infra/.*\.tf$
        stages: [pre-push]

      - id: checkov
        name: Checkov IaC scan
        entry: make lint-checkov
        language: system
        pass_filenames: false
        files: ^infra/.*(\.tf|\.checkov\.yaml)$
        stages: [pre-push]

      - id: dependency-audit
        name: dependency audit
        entry: make dependency-audit
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|apps/.*/pyproject\.toml|packages/.*/pyproject\.toml)$
        stages: [pre-push]

      - id: container-config-scan
        name: Trivy container and config scan
        entry: make container-config-scan
        language: system
        pass_filenames: false
        files: ^(\.trivyignore\.yaml|Dockerfile|docker-compose\.ya?ml|db/Dockerfile|db/pgbouncer/Dockerfile|platform/workload\.Dockerfile|infra/|platform/concerns/|\.github/workflows/)
        stages: [pre-push]

      - id: container-image-scan
        name: Trivy container image scan
        entry: make container-image-scan
        language: system
        pass_filenames: false
        files: ^(Dockerfile|docker-compose\.ya?ml|db/Dockerfile|db/pgbouncer/Dockerfile|platform/workload\.Dockerfile|platform/workloads\.json)
        stages: [pre-push]

      - id: deepfence-secret-scan
        name: Deepfence image secret scan
        entry: make secret-scan-deepfence
        language: system
        pass_filenames: false
        files: ^(Dockerfile|docker-compose\.ya?ml|db/Dockerfile|db/pgbouncer/Dockerfile|platform/workload\.Dockerfile|platform/workloads\.json)
        stages: [pre-push]

      - id: policy
        name: OPA Conftest policy scan
        entry: make lint-policy
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/.*\.yml|platform/(workloads|runtime-conformance|platform-inventory|runtime-defaults)\.json|platform/concerns/policy/)
        stages: [pre-push]

      - id: workload-readiness
        name: workload readiness
        entry: make workload-readiness-check
        language: system
        pass_filenames: false
        files: ^(platform/workloads\.json|apps/|packages/|platform/workload\.Dockerfile)
        stages: [pre-push]

      - id: workflow-dry-run
        name: workflow dry-run validation
        entry: make workflow-dry-run-validate
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/|scripts/ci/|scripts/release/|scripts/platform/)
        stages: [pre-push]

      - id: python-lint-push
        name: python lint on push
        entry: make lint-app
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: python-format-check-push
        name: python format check on push
        entry: uv run ruff format --check apps/ examples/ packages/ tests/ scripts/
        language: system
        pass_filenames: false
        stages: [pre-push]
