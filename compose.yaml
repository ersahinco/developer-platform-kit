x-workload-build: &workload_build
  context: .
  dockerfile: platform/workload.Dockerfile

x-db-identity-env: &db_identity_env
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  DB_NAME: ${POSTGRES_DB:-aws_sdlc_containers}

x-direct-db-env: &direct_db_env
  <<: *db_identity_env
  DB_HOST: db
  DB_PORT: 5432

x-pooled-db-env: &pooled_db_env
  <<: *db_identity_env
  DB_HOST: pgbouncer
  DB_PORT: 5432

x-api-database-url: &api_database_url ${DATABASE_URL:-postgresql://postgres:postgres@pgbouncer:5432/aws_sdlc_containers}
x-backfill-database-url: &backfill_database_url ${BACKFILL_DATABASE_URL:-postgresql://postgres:postgres@db:5432/aws_sdlc_containers}
x-data-export-database-url: &data_export_database_url ${DATA_EXPORT_DATABASE_URL:-postgresql://postgres:postgres@db:5432/aws_sdlc_containers}

x-event-consumer-app-id: &event_consumer_app_id event-consumer
x-event-consumer-app-port: &event_consumer_app_port "8081"
x-event-consumer-pubsub-name: &event_consumer_pubsub_name async-events-pubsub
x-event-consumer-topic: &event_consumer_topic async-events-v1.fifo

services:

  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aws_sdlc_containers}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/sql/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql
      # observability.sql removed — backfill_progress is owned by Liquibase changeset 003.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aws_sdlc_containers}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # PgBouncer sits between the API and Postgres.
  # The API's DATABASE_URL points to pgbouncer:5432, not db:5432.
  # transaction mode: server connections are returned to the pool after each
  # transaction, allowing many API connections to share a small server-side pool.
  # edoburu/pgbouncer: actively maintained, current versions, simple env-var config.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aws_sdlc_containers}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
      # Log pool stats once per hour — same as ECS. Reduces noise during local dev.
      STATS_PERIOD: 3600
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  liquibase:
    build:
      context: db
    image: aws-sdlc-containers-liquibase:local
    volumes:
      - ./db:/liquibase/db
    environment:
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/db.changelog-master.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/db
      # Liquibase connects directly to Postgres, not pgbouncer — DDL statements
      # require session mode and must not be proxied through a transaction-mode pool.
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-aws_sdlc_containers}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migration

  api:
    build:
      <<: *workload_build
      args:
        APP_PATH: apps/api
        UV_PACKAGE: aws-sdlc-containers-api
        WORKLOAD_CMD: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *pooled_db_env
      DATABASE_URL: *api_database_url
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_SERVICE_NAME: aws-sdlc-containers-api
      OTEL_DEPLOYMENT_ENVIRONMENT: local
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  backfill-worker:
    build:
      <<: *workload_build
      args:
        APP_PATH: apps/backfill_worker
        UV_PACKAGE: aws-sdlc-containers-backfill-worker
        WORKLOAD_CMD: python -m backfill_worker.main
    environment:
      <<: *direct_db_env
      # Backfill bypasses pgbouncer and connects directly to Postgres.
      BACKFILL_DATABASE_URL: *backfill_database_url
      BACKFILL_BATCH_SIZE: ${BACKFILL_BATCH_SIZE:-1000}
      BACKFILL_SLEEP_MS: ${BACKFILL_SLEEP_MS:-100}
    depends_on:
      db:
        condition: service_healthy

  data-export-job:
    build:
      <<: *workload_build
      args:
        APP_PATH: apps/data_export_job
        UV_PACKAGE: aws-sdlc-containers-data-export-job
        WORKLOAD_CMD: python -m data_export_job.main
    environment:
      <<: *direct_db_env
      # Export job bypasses pgbouncer, matching backfill/DDL behavior.
      DATA_EXPORT_DATABASE_URL: *data_export_database_url
      DATA_EXPORT_OUTPUT_DIR: /exports
    volumes:
      - data_exports:/exports
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - data

  open-dataset-pipeline:
    build:
      <<: *workload_build
      args:
        APP_PATH: apps/open_dataset_pipeline
        UV_PACKAGE: aws-sdlc-containers-open-dataset-pipeline
        WORKLOAD_CMD: python -m open_dataset_pipeline.main
    environment:
      OPEN_DATASET_URL: ${OPEN_DATASET_URL:-file:///app/apps/open_dataset_pipeline/sample_data/iris.csv}
      OPEN_DATASET_NAME: ${OPEN_DATASET_NAME:-iris}
      OPEN_DATASET_OUTPUT_DIR: ${OPEN_DATASET_OUTPUT_DIR:-/exports}
      OPEN_DATASET_RUN_ID: ${OPEN_DATASET_RUN_ID:-}
      OPEN_DATASET_DATE: ${OPEN_DATASET_DATE:-}
    volumes:
      - data_exports:/exports
    profiles:
      - data

  redis:
    image: redis:8.2.1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles:
      - dapr

  event-consumer:
    build:
      <<: *workload_build
      args:
        APP_PATH: apps/event_consumer
        UV_PACKAGE: aws-sdlc-containers-event-consumer
        WORKLOAD_CMD: python -m event_consumer.main
    environment:
      <<: *direct_db_env
      DAPR_HTTP_ENDPOINT: http://event-consumer-dapr:3500
      EVENT_CONSUMER_WORKER_MODE: both
      DAPR_PUBSUB_NAME: *event_consumer_pubsub_name
      DAPR_TOPIC: *event_consumer_topic
      DAPR_SUBSCRIPTION_ROUTE: /internal/events/consume
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - dapr

  event-consumer-dapr:
    image: daprio/daprd:1.17.0
    command:
      - ./daprd
      - --app-id
      - *event_consumer_app_id
      - --app-port
      - *event_consumer_app_port
      - --app-channel-address
      - *event_consumer_app_id
      - --dapr-http-port
      - "3500"
      - --components-path
      - /components
      - --config
      - /config/config.yaml
    volumes:
      - ./platform/concerns/dapr/profiles/local/components:/components:ro
      - ./platform/concerns/dapr/profiles/local/config.yaml:/config/config.yaml:ro
    ports:
      - "${DAPR_HTTP_PORT:-3500}:3500"
    depends_on:
      event-consumer:
        condition: service_started
      redis:
        condition: service_started
    profiles:
      - dapr

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_LOGIN_BANNER: "'Local admin only'"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tools

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.11.2}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --log.level=warn
    volumes:
      - ./platform/concerns/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./platform/concerns/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_started
    profiles:
      - observability

  loki:
    image: grafana/loki:${LOKI_TAG:-3.6.10}
    command:
      - -config.file=/etc/loki/loki.yml
      - -log.level=warn
    volumes:
      - ./platform/concerns/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    profiles:
      - observability

  tempo:
    image: grafana/tempo:${TEMPO_TAG:-2.9.0}
    # The upstream image runs as a non-root user that cannot initialize a fresh
    # Docker named volume on macOS/Linux without a one-time chown.
    user: "0:0"
    command:
      - -config.file=/etc/tempo/tempo.yml
      - -log.level=warn
    volumes:
      - ./platform/concerns/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
    profiles:
      - observability

  promtail:
    image: grafana/promtail:${PROMTAIL_TAG:-3.6.10}
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    environment:
      STACK_NAME: ${STACK_NAME:-aws-sdlc-containers}
    volumes:
      - ./platform/concerns/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    profiles:
      - observability

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-13.0.1}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      PROMETHEUS_URL: "http://prometheus:9090"
      LOKI_URL: "http://loki:3100"
      TEMPO_URL: "http://tempo:3200"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./platform/concerns/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/concerns/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    profiles:
      - observability

volumes:
  db_data:
  pgadmin_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  data_exports:
